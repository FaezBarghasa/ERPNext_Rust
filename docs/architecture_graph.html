gs": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn memory_growing(\n        &mut self,\n        _current: usize,\n        desired: usize,\n        _maximum: Option<usize>,\n    ) -> anyhow::Result<bool> {\n        self.used = desired;\n        Ok(desired <= self.max_bytes)\n    }", "bundle": "crates"}, {"id": "crates/frappe-framework/src/wasmtime_sandbox/new", "title": "new", "type": "Function", "description": "", "resource": "crates/frappe-framework/src/wasmtime_sandbox.rs", "tags": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new(fuel: u64, max_mem_bytes: usize) -> Result<Self> {\n        let mut cfg = Config::new();\n        cfg.consume_fuel(true);\n        Ok(Self {\n            engine: Engine::new(&cfg)?,\n            fuel,\n            max_bytes: max_mem_bytes,\n        })\n    }", "bundle": "crates"}, {"id": "crates/frappe-framework/src/wasmtime_sandbox/new_1", "title": "new", "type": "Function", "description": "", "resource": "crates/frappe-framework/src/wasmtime_sandbox.rs", "tags": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new(fuel: u64, max_mem_bytes: usize) -> Result<Self> {\n        let mut cfg = Config::new();\n        cfg.consume_fuel(true);\n        Ok(Self {\n            engine: Engine::new(&cfg)?,\n            fuel,\n            max_bytes: max_mem_bytes,\n        })\n    }", "bundle": "crates"}, {"id": "crates/frappe-framework/src/wasmtime_sandbox/run_wat", "title": "run_wat", "type": "Function", "description": "Compile + run a wat module exporting `run() -> i32`; proves fuel termination.", "resource": "crates/frappe-framework/src/wasmtime_sandbox.rs", "tags": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn run_wat(&self, wat: &str) -> Result<i32> {\n        let module = Module::new(&self.engine, wat).context(\"compile\")?;\n        let limits = Limits {\n            max_bytes: self.max_bytes,\n            used: 0,\n        };\n        let mut store = Store::new(&self.engine, limits);\n        store.set_fuel(self.fuel).context(\"set fuel\")?;\n        store.limiter(|state| state as _);\n        let instance = wasmtime::Instance::new(&mut store, &module, &[]).context(\"instantiate\")?;\n        let f = instance\n            .get_typed_func::<(), i32>(&mut store, \"run\")\n            .context(\"missing export `run`\")?;\n        f.call(&mut store, ()).context(\"trap\")\n    }", "bundle": "crates"}, {"id": "crates/frappe-framework/src/wasmtime_sandbox/run_wat_1", "title": "run_wat", "type": "Function", "description": "Compile + run a wat module exporting `run() -> i32`; proves fuel termination.", "resource": "crates/frappe-framework/src/wasmtime_sandbox.rs", "tags": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn run_wat(&self, wat: &str) -> Result<i32> {\n        let module = Module::new(&self.engine, wat).context(\"compile\")?;\n        let limits = Limits {\n            max_bytes: self.max_bytes,\n            used: 0,\n        };\n        let mut store = Store::new(&self.engine, limits);\n        store.set_fuel(self.fuel).context(\"set fuel\")?;\n        store.limiter(|state| state as _);\n        let instance = wasmtime::Instance::new(&mut store, &module, &[]).context(\"instantiate\")?;\n        let f = instance\n            .get_typed_func::<(), i32>(&mut store, \"run\")\n            .context(\"missing export `run`\")?;\n        f.call(&mut store, ()).context(\"trap\")\n    }", "bundle": "crates"}, {"id": "crates/frappe-framework/src/wasmtime_sandbox/table_growing", "title": "table_growing", "type": "Function", "description": "", "resource": "crates/frappe-framework/src/wasmtime_sandbox.rs", "tags": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn table_growing(\n        &mut self,\n        _current: usize,\n        _desired: usize,\n        _maximum: Option<usize>,\n    ) -> anyhow::Result<bool> {\n        Ok(true)\n    }", "bundle": "crates"}, {"id": "crates/frappe-framework/src/wasmtime_sandbox/table_growing_1", "title": "table_growing", "type": "Function", "description": "", "resource": "crates/frappe-framework/src/wasmtime_sandbox.rs", "tags": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn table_growing(\n        &mut self,\n        _current: usize,\n        _desired: usize,\n        _maximum: Option<usize>,\n    ) -> anyhow::Result<bool> {\n        Ok(true)\n    }", "bundle": "crates"}, {"id": "crates/frappe-framework/src/wasmtime_sandbox/wat_runs", "title": "wat_runs", "type": "Function", "description": "[test]", "resource": "crates/frappe-framework/src/wasmtime_sandbox.rs", "tags": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn wat_runs() {\n        let s = RealSandbox::new(1_000_000, 32 * 1024 * 1024).expect(\"engine\");\n        let v = s.run_wat(\"(module (func (export \\\"run\\\") (result i32) i32.const 42))\");\n        assert_eq!(v.unwrap(), 42);\n    }", "bundle": "crates"}, {"id": "crates/frappe-meta/src/migration", "title": "migration", "type": "Module", "description": "", "resource": "crates/frappe-meta/src/migration.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-meta/src/migration/ExistingDatabaseSchema", "title": "ExistingDatabaseSchema", "type": "Class", "description": "Snapshot of the live database dictionary.", "resource": "crates/frappe-meta/src/migration.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct ExistingDatabaseSchema {\n    /// Map of table names to their table definitions.\n    pub tables: HashMap<String, ExistingTableDef>,\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/migration/ExistingFieldDef", "title": "ExistingFieldDef", "type": "Class", "description": "Representation of an existing field in SurrealDB live dictionary.", "resource": "crates/frappe-meta/src/migration.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct ExistingFieldDef {\n    /// Field identifier.\n    pub name: String,\n    /// SurrealQL data type.\n    pub field_type: String,\n    /// Is this field constrained by assertions?\n    pub has_assertion: bool,\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/migration/ExistingTableDef", "title": "ExistingTableDef", "type": "Class", "description": "Representation of an existing table definition in SurrealDB.", "resource": "crates/frappe-meta/src/migration.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct ExistingTableDef {\n    /// Table name.\n    pub name: String,\n    /// Map of field names to their live definitions.\n    pub fields: HashMap<String, ExistingFieldDef>,\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/migration/MigrationDelta", "title": "MigrationDelta", "type": "Class", "description": "Calculated structural difference between target schema and live database.", "resource": "crates/frappe-meta/src/migration.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct MigrationDelta {\n    /// Table name being modified.\n    pub table_name: String,\n    /// Is the table newly created?\n    pub is_new_table: bool,\n    /// Fields to be added.\n    pub added_fields: Vec<DocFieldSchema>,\n    /// Fields to be removed.\n    pub removed_fields: Vec<String>,\n    /// Fields with changed types or constraints.\n    pub modified_fields: Vec<DocFieldSchema>,\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/migration/diff_schema", "title": "diff_schema", "type": "Function", "description": "Calculates the structural diff between a target DocType and live database schema.", "resource": "crates/frappe-meta/src/migration.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn diff_schema(\n    target: &DocTypeSchema,\n    existing_db: &ExistingDatabaseSchema,\n) -> Result<MigrationDelta, SchemaError> {\n    target.validate()?;\n    let table_name = target.table_name();\n\n    let mut delta = MigrationDelta {\n        table_name: table_name.clone(),\n        ..Default::default()\n    };\n\n    if let Some(existing_table) = existing_db.tables.get(&table_name) {\n        let mut target_fields_map = HashMap::new();\n        for field in &target.fields {\n            target_fields_map.insert(field.fieldname.clone(), field);\n            if let Some(existing_field) = existing_table.fields.get(&field.fieldname) {\n                let target_type = field.fieldtype.surreal_type();\n                if existing_field.field_type != target_type {\n                    delta.modified_fields.push(field.clone());\n                }\n            } else {\n                delta.added_fields.push(field.clone());\n            }\n        }\n\n        for existing_field_name in existing_table.fields.keys() {\n            // Ignore standard Frappe metadata fields during drop diff\n            if matches!(\n                existing_field_name.as_str(),\n                \"docstatus\" | \"idx\" | \"owner\" | \"creation\" | \"modified\" | \"modified_by\" | \"id\"\n            ) {\n                continue;\n            }\n            if !target_fields_map.contains_key(existing_field_name) {\n                delta.removed_fields.push(existing_field_name.clone());\n            }\n        }\n    } else {\n        delta.is_new_table = true;\n        delta.added_fields = target.fields.clone();\n    }\n\n    Ok(delta)\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/migration/generate_migration_ddl", "title": "generate_migration_ddl", "type": "Function", "description": "Generates transactional forward migration DDL and corresponding reverse rollback DDL.", "resource": "crates/frappe-meta/src/migration.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn generate_migration_ddl(\n    target: &DocTypeSchema,\n    delta: &MigrationDelta,\n) -> (Vec<String>, Vec<String>) {\n    let table = &delta.table_name;\n    let mut forward = vec![\"BEGIN TRANSACTION;\".to_string()];\n    let mut rollback = vec![\"BEGIN TRANSACTION;\".to_string()];\n\n    if delta.is_new_table {\n        forward.push(format!(\"DEFINE TABLE {table} SCHEMAFULL;\"));\n        rollback.push(format!(\"REMOVE TABLE {table};\"));\n\n        for field in &delta.added_fields {\n            let type_str = field.fieldtype.surreal_type();\n            forward.push(format!(\n                \"DEFINE FIELD {name} ON TABLE {table} TYPE {type_str};\",\n                name = field.fieldname\n            ));\n        }\n    } else {\n        for field in &delta.added_fields {\n            let type_str = field.fieldtype.surreal_type();\n            forward.push(format!(\n                \"DEFINE FIELD {name} ON TABLE {table} TYPE {type_str};\",\n                name = field.fieldname\n            ));\n            rollback.push(format!(\n                \"REMOVE FIELD {name} ON TABLE {table};\",\n                name = field.fieldname\n            ));\n        }\n\n        for field_name in &delta.removed_fields {\n            forward.push(format!(\"REMOVE FIELD {field_name} ON TABLE {table};\"));\n            rollback.push(format!(\n                \"DEFINE FIELD {field_name} ON TABLE {table} TYPE string;\",\n            ));\n        }\n\n        for field in &delta.modified_fields {\n            let type_str = field.fieldtype.surreal_type();\n            forward.push(format!(\n                \"DEFINE FIELD {name} ON TABLE {table} TYPE {type_str} OVERWRITE;\",\n                name = field.fieldname\n            ));\n            rollback.push(format!(\n                \"DEFINE FIELD {name} ON TABLE {table} TYPE string OVERWRITE;\",\n                name = field.fieldname\n            ));\n        }\n    }\n\n    forward.push(format!(\n        \"UPDATE __schema_migrations SET last_applied = time::now() WHERE doctype = '{name}';\",\n        name = target.name\n    ));\n    forward.push(\"COMMIT TRANSACTION;\".to_string());\n    rollback.push(\"COMMIT TRANSACTION;\".to_string());\n\n    (forward, rollback)\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/naming", "title": "naming", "type": "Module", "description": "", "resource": "crates/frappe-meta/src/naming.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-meta/src/naming/NamingSeriesParser", "title": "NamingSeriesParser", "type": "Class", "description": "Naming series: \"ACC-SINV-.YYYY.-.#####\" -> \"ACC-SINV-2026-00001\" (Stage 3.2).", "resource": "crates/frappe-meta/src/naming.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct NamingSeriesParser;", "bundle": "crates"}, {"id": "crates/frappe-meta/src/naming/counter_stmt", "title": "counter_stmt", "type": "Function", "description": "SurrealQL atomic counter statement for concurrent inserts.", "resource": "crates/frappe-meta/src/naming.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn counter_stmt(table: &str) -> String {\n        format!(\"UPDATE counter:{} SET current_value += 1 RETURN current_value;\", table)\n    }", "bundle": "crates"}, {"id": "crates/frappe-meta/src/naming/counter_stmt_1", "title": "counter_stmt", "type": "Function", "description": "SurrealQL atomic counter statement for concurrent inserts.", "resource": "crates/frappe-meta/src/naming.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn counter_stmt(table: &str) -> String {\n        format!(\"UPDATE counter:{} SET current_value += 1 RETURN current_value;\", table)\n    }", "bundle": "crates"}, {"id": "crates/frappe-meta/src/naming/format", "title": "format", "type": "Function", "description": "", "resource": "crates/frappe-meta/src/naming.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn format(pattern: &str, year: u32, seq: u64) -> String {\n        let mut out = pattern.replace(\".YYYY.\", &year.to_string()).replace(\"YYYY\", &year.to_string());\n        while out.contains(\"--\") { out = out.replace(\"--\", \"-\"); }\n        out = out.replace(\".-.\", \"-\").replace('.', \"\");\n        // count trailing # run\n        let hashes = pattern.chars().rev().take_while(|&c| c == '#').count();\n        if hashes > 0 {\n            let num = format!(\"{:0>width$}\", seq, width = hashes as usize);\n            // replace last run of #\n            let idx = out.rfind('#').map(|i| i + 1 - hashes).unwrap_or(out.len());\n            out.replace_range(idx..idx + hashes, &num);\n        }\n        out.replace('#', &seq.to_string())\n    }", "bundle": "crates"}, {"id": "crates/frappe-meta/src/naming/format_1", "title": "format", "type": "Function", "description": "", "resource": "crates/frappe-meta/src/naming.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn format(pattern: &str, year: u32, seq: u64) -> String {\n        let mut out = pattern.replace(\".YYYY.\", &year.to_string()).replace(\"YYYY\", &year.to_string());\n        while out.contains(\"--\") { out = out.replace(\"--\", \"-\"); }\n        out = out.replace(\".-.\", \"-\").replace('.', \"\");\n        // count trailing # run\n        let hashes = pattern.chars().rev().take_while(|&c| c == '#').count();\n        if hashes > 0 {\n            let num = format!(\"{:0>width$}\", seq, width = hashes as usize);\n            // replace last run of #\n            let idx = out.rfind('#').map(|i| i + 1 - hashes).unwrap_or(out.len());\n            out.replace_range(idx..idx + hashes, &num);\n        }\n        out.replace('#', &seq.to_string())\n    }", "bundle": "crates"}, {"id": "crates/frappe-meta/src/naming/series_formats", "title": "series_formats", "type": "Function", "description": "[cfg(test)] mod t { use super::*;", "resource": "crates/frappe-meta/src/naming.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    #[test] fn series_formats() { assert_eq!(NamingSeriesParser::format(\"ACC-SINV-.YYYY.-.#####\", 2026, 1), \"ACC-SINV-2026-00001\"); }", "bundle": "crates"}, {"id": "crates/frappe-meta/src/rbac", "title": "rbac", "type": "Module", "description": "", "resource": "crates/frappe-meta/src/rbac.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-meta/src/rbac/HasPermissionEdge", "title": "HasPermissionEdge", "type": "Class", "description": "Graph edge definition: Role -> DocType with granular per xcel.\n    Export,\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/rbac/Role", "title": "Role", "type": "Class", "description": "Organizational Role definition.", "resource": "crates/frappe-meta/src/rbac.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct Role {\n    /// Role identifier (e.g. \"Accounts User\", \"System Manager\").\n    pub name: String,\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/rbac/User", "title": "User", "type": "Class", "description": "User identity representation in the security graph.", "resource": "crates/frappe-meta/src/rbac.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct User {\n    /// User identifier / email.\n    pub id: String,\n    /// Direct role assignments.\n    pub roles: Vec<String>,\n    /// Organization / company scopes.\n    pub allowed_companies: Vec<String>,\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/rbac/allows", "title": "allows", "type": "Function", "description": "Checks if this edge grants the specified permission.", "resource": "crates/frappe-meta/src/rbac.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn allows(&self, perm: Permission) -> bool {\n        match perm {\n            Permission::Read => self.p_read,\n            Permission::Write => self.p_write,\n            Permission::Create => self.p_create,\n            Permission::Delete => self.p_delete,\n            Permission::Submit => self.p_submit,\n            Permission::Cancel => self.p_cancel,\n            Permission::Amend => self.p_amend,\n            Permission::Report => self.p_read,\n            Permission::Export => self.p_read,\n        }\n    }", "bundle": "crates"}, {"id": "crates/frappe-meta/src/rbac/allows_1", "title": "allows", "type": "Function", "description": "Checks if this edge grants the specified permission.", "resource": "crates/frappe-meta/src/rbac.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn allows(&self, perm: Permission) -> bool {\n        match perm {\n            Permission::Read => self.p_read,\n            Permission::Write => self.p_write,\n            Permission::Create => self.p_create,\n            Permission::Delete => self.p_delete,\n            Permission::Submit => self.p_submit,\n            Permission::Cancel => self.p_cancel,\n            Permission::Amend => self.p_amend,\n            Permission::Report => self.p_read,\n            Permission::Export => self.p_read,\n        }\n    }", "bundle": "crates"}, {"id": "crates/frappe-meta/src/rbac/check_permission", "title": "check_permission", "type": "Function", "description": "Evaluates whether a user with given roles is permitted to perform an operation.", "resource": "crates/frappe-meta/src/rbac.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn check_permission(\n    user_roles: &[String],\n    permission_edges: &[HasPermissionEdge],\n    perm: Permission,\n    target_permlevel: u8,\n) -> bool {\n    // System Manager bypass\n    if user_roles.iter().any(|r| r == \"System Manager\" || r == \"Administrator\") {\n        return true;\n    }\n\n    permission_edges.iter().any(|edge| {\n        user_roles.contains(&edge.role)\n            && edge.permlevel <= target_permlevel\n            && edge.allows(perm)\n    })\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/rbac/compile_rls_policy", "title": "compile_rls_policy", "type": "Function", "description": "Generates SurrealDB Row-Level Security (RLS) predicate for a table.", "resource": "crates/frappe-meta/src/rbac.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn compile_rls_policy(doctype: &str, roles_with_read: &[String], roles_with_write: &[String]) -> String {\n    let read_roles = roles_with_read\n        .iter()\n        .map(|r| format!(\"\\\"{r}\\\"\"))\n        .collect::<Vec<_>>()\n        .join(\", \");\n    let write_roles = roles_with_write\n        .iter()\n        .map(|r| format!(\"\\\"{r}\\\"\"))\n        .collect::<Vec<_>>()\n        .join(\", \");\n\n    format!(\n        \"DEFINE TABLE {doctype} SCHEMAFULL PERMISSIONS \\\n         FOR select WHERE $auth.roles CONTAINSANY [{read_roles}] OR owner = $auth.id, \\\n         FOR create, update WHERE $auth.roles CONTAINSANY [{write_roles}], \\\n         FOR delete WHERE $auth.roles CONTAINS \\\"System Manager\\\";\"\n    )\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema", "title": "schema", "type": "Module", "description": "", "resource": "crates/frappe-meta/src/schema.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema/DocFieldSchema", "title": "DocFieldSchema", "type": "Class", "description": "Structural schema definition for an individual DocField.", "resource": "crates/frappe-meta/src/schema.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct DocFieldSchema {\n    /// Programmatic field identifier.\n    pub fieldname: String,\n    /// Logical field data type.\n    pub fieldtype: FieldType,\n    /// Human readable UI label.\n    pub label: String,\n    /// Is this field mandatory for document submission/saving?\n    #[serde(default)]\n    pub reqd: bool,\n    /// Must this field be unique across all records?\n    #[serde(default)]\n    pub unique: bool,\n    /// Is this field read-only in the UI and API?\n    #[serde(default)]\n    pub read_only: bool,\n    /// Is this field hidden from standard view?\n    #[serde(default)]\n    pub hidden: bool,\n    /// Should this field appear in the default list view?\n    #[serde(default)]\n    pub in_list_view: bool,\n    /// Dynamic options or select values.\n    #[serde(default)]\n    pub options: Option<String>,\n    /// Default fallback value.\n    #[serde(default)]\n    pub default_value: Option<serde_json::Value>,\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema/DocPermSchema", "title": "DocPermSchema", "type": "Class", "description": "Role permission specification for DocType access control.", "resource": "crates/frappe-meta/src/schema.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct DocPermSchema {\n    /// Role identifier permitted.\n    pub role: String,\n    /// Read permission flag.\n    #[serde(default)]\n    pub read: bool,\n    /// Write / Edit permission flag.\n    #[serde(default)]\n    pub write: bool,\n    /// Create new document flag.\n    #[serde(default)]\n    pub create: bool,\n    /// Delete document flag.\n    #[serde(default)]\n    pub delete: bool,\n    /// Submit document flag.\n    #[serde(default)]\n    pub submit: bool,\n    /// Cancel document flag.\n    #[serde(default)]\n    pub cancel: bool,\n    /// Amend cancelled document flag.\n    #[serde(default)]\n    pub amend: bool,\n    /// View reports flag.\n    #[serde(default)]\n    pub report: bool,\n    /// Export data flag.\n    #[serde(default)]\n    pub export: bool,\n    /// Permission level ceiling (0 = document level, 1+ = field level).\n    #[serde(default)]\n    pub permlevel: u8,\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema/DocTypeSchema", "title": "DocTypeSchema", "type": "Class", "description": "Abstract Syntax Tree (AST) definition for an entire DocType schema.", "resource": "crates/frappe-meta/src/schema.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct DocTypeSchema {\n    /// DocType name (e.g. \"Sales Invoice\", \"Customer\").\n    pub name: String,\n    /// Application module namespace (e.g. \"Accounts\", \"Stock\").\n    pub module: String,\n    /// Is this a singleton configuration document?\n    #[serde(default)]\n    pub is_single: bool,\n    /// Can documents of this type be submitted and posted to ledgers?\n    #[serde(default)]\n    pub is_submittable: bool,\n    /// Track historical version changes?\n    #[serde(default)]\n    pub track_changes: bool,\n    /// Naming rule template (e.g. \"ACC-INV-.YYYY.-.#####\").\n    #[serde(default)]\n    pub naming_rule: Option<String>,\n    /// Field definitions.\n    pub fields: Vec<DocFieldSchema>,\n    /// Security permission definitions.\n    #[serde(default)]\n    pub permissions: Vec<DocPermSchema>,\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema/FieldType", "title": "FieldType", "type": "Class", "description": "Primitives for DocType field types.", "resource": "crates/frappe-meta/src/schema.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum FieldType {\n    /// Standard single-line text string.\n    Data,\n    /// 64-bit integer.\n    Int,\n    /// 64-bit floating point number.\n    Float,\n    /// Fixed-point financial currency.\n    Currency,\n    /// Boolean flag.\n    Check,\n    /// Foreign key reference to another DocType.\n    Link { target_doctype: String },\n    /// Dynamic foreign key referencing another field for DocType name.\n    DynamicLink { link_field: String },\n    /// Nested child table association.\n    Table { child_doctype: String },\n    /// Multi-option select list.\n    Select { options: Vec<String> },\n    /// Multi-line text field.\n    Text,\n    /// Unbounded long text field.\n    LongText,\n    /// Code or script block.\n    Code,\n    /// Calendar date (YYYY-MM-DD).\n    Date,\n    /// Timestamp (ISO 8601).\n    Datetime,\n    /// Percentage value.\n    Percent,\n    /// Numeric rating score.\n    Rating,\n    /// Time duration.\n    Duration,\n    /// Geographic coordinates.\n    GeoPoint,\n    /// Encrypted password string.\n    Password,\n    /// File attachment record.\n    Attach,\n    /// Arbitrary JSON object.\n    Json,\n    /// Barcode or QR string.\n    Barcode,\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema/SchemaError", "title": "SchemaError", "type": "Class", "description": "Schema validation and compilation errors.", "resource": "crates/frappe-meta/src/schema.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum SchemaError {\n    /// Invalid field name violating naming conventions.\n    #[error(\"Invalid fieldname '{0}': must match ^[a-z_][a-z0-9_]{{0,62}}$\")]\n    InvalidFieldName(String),\n    /// Field name is a reserved keyword in SurrealQL.\n    #[error(\"Fieldname '{0}' is a reserved keyword\")]\n    ReservedKeyword(String),\n    /// Invalid link target DocType.\n    #[error(\"Link field '{0}' specifies empty target doctype\")]\n    InvalidLinkTarget(String),\n    /// Invalid child table DocType.\n    #[error(\"Table field '{0}' specifies empty child doctype\")]\n    InvalidChildTable(String),\n    /// Duplicate field name in DocType schema.\n    #[error(\"Duplicate fieldname '{0}' in doctype '{1}'\")]\n    DuplicateFieldName(String, String),\n    /// Compilation error.\n    #[error(\"SurrealQL compilation failed: {0}\")]\n    CompilationFailed(String),\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema/surreal_type", "title": "surreal_type", "type": "Function", "description": "Returns the corresponding SurrealQL field type string.", "resource": "crates/frappe-meta/src/schema.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn surreal_type(&self) -> String {\n        match self {\n            Self::Data\n            | Self::Text\n            | Self::LongText\n            | Self::Code\n            | Self::Password\n            | Self::Barcode => \"string\".into(),\n            Self::Int => \"int\".into(),\n            Self::Float | Self::Percent => \"float\".into(),\n            Self::Currency => \"decimal\".into(),\n            Self::Check => \"bool\".into(),\n            Self::Date | Self::Datetime => \"datetime\".into(),\n            Self::Duration => \"duration\".into(),\n            Self::GeoPoint => \"geometry::point\".into(),\n            Self::Attach => \"record<tab_file>\".into(),\n            Self::Json => \"object\".into(),\n            Self::Rating => \"int\".into(),\n            Self::Link { target_doctype } => {\n                let sanitized = target_doctype.to_lowercase().replace(' ', \"_\");\n                format!(\"record<{sanitized}>\")\n            }\n            Self::DynamicLink { .. } => \"record\".into(),\n            Self::Table { child_doctype } => {\n                let sanitized = child_doctype.to_lowercase().replace(' ', \"_\");\n                format!(\"array<record<{sanitized}>>\")\n            }\n            Self::Select { .. } => \"string\".into(),\n        }\n    }", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema/surreal_type_1", "title": "surreal_type", "type": "Function", "description": "Returns the corresponding SurrealQL field type string.", "resource": "crates/frappe-meta/src/schema.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn surreal_type(&self) -> String {\n        match self {\n            Self::Data\n            | Self::Text\n            | Self::LongText\n            | Self::Code\n            | Self::Password\n            | Self::Barcode => \"string\".into(),\n            Self::Int => \"int\".into(),\n            Self::Float | Self::Percent => \"float\".into(),\n            Self::Currency => \"decimal\".into(),\n            Self::Check => \"bool\".into(),\n            Self::Date | Self::Datetime => \"datetime\".into(),\n            Self::Duration => \"duration\".into(),\n            Self::GeoPoint => \"geometry::point\".into(),\n            Self::Attach => \"record<tab_file>\".into(),\n            Self::Json => \"object\".into(),\n            Self::Rating => \"int\".into(),\n            Self::Link { target_doctype } => {\n                let sanitized = target_doctype.to_lowercase().replace(' ', \"_\");\n                format!(\"record<{sanitized}>\")\n            }\n            Self::DynamicLink { .. } => \"record\".into(),\n            Self::Table { child_doctype } => {\n                let sanitized = child_doctype.to_lowercase().replace(' ', \"_\");\n                format!(\"array<record<{sanitized}>>\")\n            }\n            Self::Select { .. } => \"string\".into(),\n        }\n    }", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema/table_name", "title": "table_name", "type": "Function", "description": "Returns the database table name derived from the DocType name.", "resource": "crates/frappe-meta/src/schema.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn table_name(&self) -> String {\n        self.name.to_lowercase().replace(' ', \"_\")\n    }", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema/table_name_1", "title": "table_name", "type": "Function", "description": "Returns the database table name derived from the DocType name.", "resource": "crates/frappe-meta/src/schema.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn table_name(&self) -> String {\n        self.name.to_lowercase().replace(' ', \"_\")\n    }", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema/validate", "title": "validate", "type": "Function", "description": "Validates the DocType schema AST according to strict architectural invariants.", "resource": "crates/frappe-meta/src/schema.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn validate(&self) -> Result<(), SchemaError> {\n        let field_regex = Regex::new(r\"^[a-z_][a-z0-9_]{0,62}$\")\n            .map_err(|e| SchemaError::CompilationFailed(e.to_string()))?;\n\n        let mut seen_fields = std::collections::HashSet::new();\n\n        for field in &self.fields {\n            if !field_regex.is_match(&field.fieldname) {\n                return Err(SchemaError::InvalidFieldName(field.fieldname.clone()));\n            }\n\n            if RESERVED_KEYWORDS.contains(&field.fieldname.to_lowercase().as_str()) {\n                return Err(SchemaError::ReservedKeyword(field.fieldname.clone()));\n            }\n\n            if !seen_fields.insert(&field.fieldname) {\n                return Err(SchemaError::DuplicateFieldName(\n                    field.fieldname.clone(),\n                    self.name.clone(),\n                ));\n            }\n\n            match &field.fieldtype {\n                FieldType::Link { target_doctype } => {\n                    if target_doctype.trim().is_empty() {\n                        return Err(SchemaError::InvalidLinkTarget(field.fieldname.clone()));\n                    }\n                }\n                FieldType::Table { child_doctype } => {\n                    if child_doctype.trim().is_empty() {\n                        return Err(SchemaError::InvalidChildTable(field.fieldname.clone()));\n                    }\n                }\n                _ => {}\n            }\n        }\n\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema/validate_1", "title": "validate", "type": "Function", "description": "Validates the DocType schema AST according to strict architectural invariants.", "resource": "crates/frappe-meta/src/schema.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn validate(&self) -> Result<(), SchemaError> {\n        let field_regex = Regex::new(r\"^[a-z_][a-z0-9_]{0,62}$\")\n            .map_err(|e| SchemaError::CompilationFailed(e.to_string()))?;\n\n        let mut seen_fields = std::collections::HashSet::new();\n\n        for field in &self.fields {\n            if !field_regex.is_match(&field.fieldname) {\n                return Err(SchemaError::InvalidFieldName(field.fieldname.clone()));\n            }\n\n            if RESERVED_KEYWORDS.contains(&field.fieldname.to_lowercase().as_str()) {\n                return Err(SchemaError::ReservedKeyword(field.fieldname.clone()));\n            }\n\n            if !seen_fields.insert(&field.fieldname) {\n                return Err(SchemaError::DuplicateFieldName(\n                    field.fieldname.clone(),\n                    self.name.clone(),\n                ));\n            }\n\n            match &field.fieldtype {\n                FieldType::Link { target_doctype } => {\n                    if target_doctype.trim().is_empty() {\n                        return Err(SchemaError::InvalidLinkTarget(field.fieldname.clone()));\n                    }\n                }\n                FieldType::Table { child_doctype } => {\n                    if child_doctype.trim().is_empty() {\n                        return Err(SchemaError::InvalidChildTable(field.fieldname.clone()));\n                    }\n                }\n                _ => {}\n            }\n        }\n\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema_compiler", "title": "schema_compiler", "type": "Module", "description": "", "resource": "crates/frappe-meta/src/schema_compiler.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema_compiler/compile_field_ddl", "title": "compile_field_ddl", "type": "Function", "description": "", "resource": "crates/frappe-meta/src/schema_compiler.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "fn compile_field_ddl(table: &str, field: &DocFieldSchema) -> Result<String, SchemaError> {\n    let type_str = field.fieldtype.surreal_type();\n    let mut parts = vec![format!(\n        \"DEFINE FIELD {name} ON TABLE {table} TYPE {type_str}\",\n        name = field.fieldname\n    )];\n\n    if let Some(default) = &field.default_value {\n        let default_str = match default {\n            serde_json::Value::String(s) => format!(\"\\\"{s}\\\"\"),\n            serde_json::Value::Number(n) => n.to_string(),\n            serde_json::Value::Bool(b) => b.to_string(),\n            serde_json::Value::Null => \"NULL\".to_string(),\n            other => other.to_string(),\n        };\n        parts.push(format!(\"DEFAULT {default_str}\"));\n    } else if let FieldType::Check = field.fieldtype {\n        parts.push(\"DEFAULT false\".to_string());\n    }\n\n    let mut assertions = Vec::new();\n\n    if field.reqd {\n        assertions.push(\"$value != NONE AND $value != NULL\".to_string());\n    }\n\n    if let FieldType::Select { options } = &field.fieldtype {\n        let formatted_opts = options\n            .iter()\n            .map(|o| format!(\"\\\"{o}\\\"\"))\n            .collect::<Vec<_>>()\n            .join(\", \");\n        assertions.push(format!(\"$value IN [{formatted_opts}]\"));\n    }\n\n    if !assertions.is_empty() {\n        parts.push(format!(\"ASSERT {}\", assertions.join(\" AND \")));\n    }\n\n    parts.push(\";\".to_string());\n    Ok(parts.join(\" \"))\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/src/schema_compiler/compile_to_surrealql", "title": "compile_to_surrealql", "type": "Function", "description": "Compiles a strongly typed `DocTypeSchema` into a sequence of enforceable SurrealQL DDL statements.", "resource": "crates/frappe-meta/src/schema_compiler.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn compile_to_surrealql(schema: &DocTypeSchema) -> Result<Vec<String>, SchemaError> {\n    schema.validate()?;\n\n    let mut statements = Vec::new();\n    let table = schema.table_name();\n\n    // Define table\n    statements.push(format!(\"DEFINE TABLE {table} SCHEMAFULL;\"));\n\n    // Standard Frappe metadata fields\n    statements.push(format!(\n        \"DEFINE FIELD docstatus ON TABLE {table} TYPE int DEFAULT 0 ASSERT $value IN [0, 1, 2];\"\n    ));\n    statements.push(format!(\n        \"DEFINE FIELD idx ON TABLE {table} TYPE int DEFAULT 0;\"\n    ));\n    statements.push(format!(\n        \"DEFINE FIELD owner ON TABLE {table} TYPE string DEFAULT $auth.id;\"\n    ));\n    statements.push(format!(\n        \"DEFINE FIELD creation ON TABLE {table} TYPE datetime DEFAULT time::now();\"\n    ));\n    statements.push(format!(\n        \"DEFINE FIELD modified ON TABLE {table} TYPE datetime DEFAULT time::now();\"\n    ));\n    statements.push(format!(\n        \"DEFINE FIELD modified_by ON TABLE {table} TYPE string DEFAULT $auth.id;\"\n    ));\n\n    // Custom fields from schema\n    for field in &schema.fields {\n        let field_ddl = compile_field_ddl(&table, field)?;\n        statements.push(field_ddl);\n\n        if field.unique {\n            statements.push(format!(\n                \"DEFINE INDEX idx_{table}_{field_name} ON TABLE {table} FIELDS {field_name} UNIQUE;\",\n                field_name = field.fieldname\n            ));\n        }\n    }\n\n    Ok(statements)\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/tests/schema_compiler_tests", "title": "schema_compiler_tests", "type": "Module", "description": "", "resource": "crates/frappe-meta/tests/schema_compiler_tests.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-meta/tests/schema_compiler_tests/create_customer_schema", "title": "create_customer_schema", "type": "Function", "description": "", "resource": "crates/frappe-meta/tests/schema_compiler_tests.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "fn create_customer_schema() -> DocTypeSchema {\n    DocTypeSchema {\n        name: \"Customer\".to_string(),\n        module: \"Selling\".to_string(),\n        is_single: false,\n        is_submittable: false,\n        track_changes: true,\n        naming_rule: Some(\"CUST-.#####\".to_string()),\n        fields: vec![\n            DocFieldSchema {\n                fieldname: \"customer_name\".to_string(),\n                fieldtype: FieldType::Data,\n                label: \"Customer Name\".to_string(),\n                reqd: true,\n                unique: true,\n                read_only: false,\n                hidden: false,\n                in_list_view: true,\n                options: None,\n                default_value: None,\n            },\n            DocFieldSchema {\n                fieldname: \"credit_limit\".to_string(),\n                fieldtype: FieldType::Currency,\n                label: \"Credit Limit\".to_string(),\n                reqd: false,\n                unique: false,\n                read_only: false,\n                hidden: false,\n                in_list_view: false,\n                options: None,\n                default_value: Some(serde_json::json!(0.0)),\n            },\n            DocFieldSchema {\n                fieldname: \"default_currency\".to_string(),\n                fieldtype: FieldType::Link {\n                    target_doctype: \"Currency\".to_string(),\n                },\n                label: \"Currency\".to_string(),\n                reqd: false,\n                unique: false,\n                read_only: false,\n                hidden: false,\n                in_list_view: false,\n                options: None,\n                default_value: None,\n            },\n            DocFieldSchema {\n                fieldname: \"disabled\".to_string(),\n                fieldtype: FieldType::Check,\n                label: \"Disabled\".to_string(),\n                reqd: false,\n                unique: false,\n                read_only: false,\n                hidden: false,\n                in_list_view: false,\n                options: None,\n                default_value: Some(serde_json::json!(false)),\n            },\n        ],\n        permissions: vec![DocPermSchema {\n            role: \"Sales User\".to_string(),\n            read: true,\n            write: true,\n            create: true,\n            delete: false,\n            submit: false,\n            cancel: false,\n            amend: false,\n            report: true,\n            export: false,\n            permlevel: 0,\n        }],\n    }\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/tests/schema_compiler_tests/test_reserved_keyword_rejection", "title": "test_reserved_keyword_rejection", "type": "Function", "description": "[test]", "resource": "crates/frappe-meta/tests/schema_compiler_tests.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "fn test_reserved_keyword_rejection() {\n    let invalid = DocTypeSchema {\n        name: \"TestDoc\".to_string(),\n        module: \"Core\".to_string(),\n        is_single: false,\n        is_submittable: false,\n        track_changes: false,\n        naming_rule: None,\n        fields: vec![DocFieldSchema {\n            fieldname: \"table\".to_string(),\n            fieldtype: FieldType::Data,\n            label: \"Table Field\".to_string(),\n            reqd: false,\n            unique: false,\n            read_only: false,\n            hidden: false,\n            in_list_view: false,\n            options: None,\n            default_value: None,\n        }],\n        permissions: vec![],\n    };\n\n    assert_eq!(\n        invalid.validate(),\n        Err(SchemaError::ReservedKeyword(\"table\".to_string()))\n    );\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/tests/schema_compiler_tests/test_schema_deserialization_and_compilation", "title": "test_schema_deserialization_and_compilation", "type": "Function", "description": "[test]", "resource": "crates/frappe-meta/tests/schema_compiler_tests.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "fn test_schema_deserialization_and_compilation() {\n    let customer = create_customer_schema();\n    assert!(customer.validate().is_ok());\n\n    let ddl = compile_to_surrealql(&customer).expect(\"DDL compilation failed\");\n    assert!(ddl.iter().any(|s| s.contains(\"DEFINE TABLE customer SCHEMAFULL;\")));\n    assert!(ddl.iter().any(|s| s.contains(\"DEFINE FIELD customer_name ON TABLE customer TYPE string\")));\n    assert!(ddl.iter().any(|s| s.contains(\"ASSERT $value != NONE AND $value != NULL\")));\n    assert!(ddl.iter().any(|s| s.contains(\"DEFINE INDEX idx_customer_customer_name ON TABLE customer FIELDS customer_name UNIQUE;\")));\n}", "bundle": "crates"}, {"id": "crates/frappe-meta/tests/schema_compiler_tests/test_schema_migration_diff_and_rollback", "title": "test_schema_migration_diff_and_rollback", "type": "Function", "description": "[test]", "resource": "crates/frappe-meta/tests/schema_compiler_tests.rs", "tags": ["domain:frappe-meta", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "fn test_schema_migration_diff_and_rollback() {\n    let target = create_customer_schema();\n    let mut existing_db = ExistingDatabaseSchema::default();\n\n    let mut customer_fields = std::collections::HashMap::new();\n    customer_fields.insert(\n        \"customer_name\".to_string(),\n        ExistingFieldDef {\n            name: \"customer_name\".to_string(),\n            field_type: \"string\".to_string(),\n            has_assertion: true,\n        },\n    );\n\n    existing_db.tables.insert(\n        \"customer\".to_string(),\n        ExistingTableDef {\n            name: \"customer\".to_string(),\n            fields: customer_fields,\n        },\n    );\n\n    let delta = diff_schema(&target, &existing_db).expect(\"Diff failed\");\n    assert!(!delta.is_new_table);\n    assert_eq!(delta.added_fields.len(), 3); // credit_limit, default_currency, disabled\n\n    let (forward, rollback) = generate_migration_ddl(&target, &delta);\n    assert!(forward.first().unwrap().contains(\"BEGIN TRANSACTION\"));\n    assert!(forward.last().unwrap().contains(\"COMMIT TRANSACTION\"));\n    assert!(forward.iter().any(|s| s.contains(\"DEFINE FIELD credit_limit ON TABLE customer TYPE decimal;\")));\n    assert!(rollback.iter().any(|s| s.contains(\"REMOVE FIELD credit_limit ON TABLE customer;\")));\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/live", "title": "live", "type": "Module", "description": "", "resource": "crates/frappe-net/src/live.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-net/src/live/live_query", "title": "live_query", "type": "Function", "description": "Generates a SurrealQL LIVE SELECT registration query.", "resource": "crates/frappe-net/src/live.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn live_query(tenant_ns: &str, table: &str, id: &str) -> String {\n    format!(\n        \"LIVE SELECT * FROM {}:{} WHERE $tenant = '{}';\",\n        table, id, tenant_ns\n    )\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/live/live_ws_handler", "title": "live_ws_handler", "type": "Function", "description": "WebSocket Live Query Streaming Actor (Milestone 1.8 & 4.3).", "resource": "crates/frappe-net/src/live.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub async fn live_ws_handler(\n    req: HttpRequest,\n    body: web::Payload,\n) -> actix_web::Result<HttpResponse> {\n    let (res, mut session, mut stream) = actix_ws::handle(&req, body)?;\n\n    actix_web::rt::spawn(async move {\n        while let Some(Ok(msg)) = stream.next().await {\n            if let actix_ws::Message::Text(text) = msg {\n                // In production this relays SurrealDB LIVE SELECT events\n                let ack_frame = format!(\"LIVE_EVENT:{}\", text);\n                let _ = session.text(ack_frame).await;\n            }\n        }\n    });\n\n    Ok(res)\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/live/test_live_query_format", "title": "test_live_query_format", "type": "Function", "description": "[test]", "resource": "crates/frappe-net/src/live.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_live_query_format() {\n        let q = live_query(\"tenant_acme\", \"sales_invoice\", \"INV-001\");\n        assert!(q.starts_with(\"LIVE SELECT * FROM sales_invoice:INV-001\"));\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/main", "title": "src", "type": "Module", "description": "", "resource": "crates/frappe-net/src/main.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-net/src/main/main", "title": "main", "type": "Function", "description": "", "resource": "crates/frappe-net/src/main.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "fn main() { println!(\"frappe-net: Actix substrate stub — TenantContext + queue + live query ready\"); }", "bundle": "crates"}, {"id": "crates/frappe-net/src/queue", "title": "queue", "type": "Module", "description": "", "resource": "crates/frappe-net/src/queue.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-net/src/queue/qs", "title": "qs", "type": "Function", "description": "[cfg(test)] mod t { #[test]", "resource": "crates/frappe-net/src/queue.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "#[cfg(test)] mod t { #[test] fn qs(){ assert_eq!(super::QUEUES.len(),4); } }", "bundle": "crates"}, {"id": "crates/frappe-net/src/routes", "title": "routes", "type": "Module", "description": "", "resource": "crates/frappe-net/src/routes.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-net/src/routes/ListQuery", "title": "ListQuery", "type": "Class", "description": "[derive(Debug, Deserialize)]", "resource": "crates/frappe-net/src/routes.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct ListQuery {\n    pub limit: Option<usize>,\n    pub offset: Option<usize>,\n    pub order_by: Option<String>,\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/routes/create_resource", "title": "create_resource", "type": "Function", "description": "Generic handler for creating a document: `POST /api/v1/resource/{doctype}`", "resource": "crates/frappe-net/src/routes.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub async fn create_resource(\n    req: HttpRequest,\n    path: web::Path<String>,\n    body: web::Json<serde_json::Value>,\n    pool_mgr: web::Data<ConnectionPoolManager>,\n) -> impl Responder {\n    let doctype = path.into_inner();\n    let tenant_id = match req.extensions().get::<TenantId>() {\n        Some(t) => t.clone(),\n        None => return HttpResponse::BadRequest().body(\"Missing tenant context\"),\n    };\n\n    let client = match pool_mgr.get_or_initialize_client(&tenant_id).await {\n        Ok(c) => c,\n        Err(e) => return HttpResponse::InternalServerError().body(e.to_string()),\n    };\n\n    let schema = DocTypeSchema {\n        name: doctype.clone(),\n        module: \"Core\".to_string(),\n        is_single: false,\n        is_submittable: false,\n        track_changes: true,\n        naming_rule: None,\n        fields: vec![],\n        permissions: vec![],\n    };\n\n    let mut doc = Document::new(&doctype, body.into_inner());\n    let controller = DocumentController::new();\n\n    if let Err(e) = controller.insert(&mut doc, &schema, None, 2026, 1) {\n        return HttpResponse::BadRequest().body(e.to_string());\n    }\n\n    let table = doctype.to_lowercase().replace(' ', \"_\");\n    let sql = format!(\"CREATE {table} CONTENT $doc;\");\n    match client.query(&sql).bind((\"doc\", doc.data)).await {\n        Ok(mut res) => {\n            let created: Option<serde_json::Value> = res.take(0).unwrap_or(None);\n            HttpResponse::Created().json(created)\n        }\n        Err(e) => HttpResponse::InternalServerError().body(e.to_string()),\n    }\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/routes/delete_resource", "title": "delete_resource", "type": "Function", "description": "Generic handler for deleting a document: `DELETE /api/v1/resource/{doctype}/{id}`", "resource": "crates/frappe-net/src/routes.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub async fn delete_resource(\n    req: HttpRequest,\n    path: web::Path<(String, String)>,\n    pool_mgr: web::Data<ConnectionPoolManager>,\n) -> impl Responder {\n    let (doctype, id) = path.into_inner();\n    let tenant_id = match req.extensions().get::<TenantId>() {\n        Some(t) => t.clone(),\n        None => return HttpResponse::BadRequest().body(\"Missing tenant context\"),\n    };\n\n    let client = match pool_mgr.get_or_initialize_client(&tenant_id).await {\n        Ok(c) => c,\n        Err(e) => return HttpResponse::InternalServerError().body(e.to_string()),\n    };\n\n    let table = doctype.to_lowercase().replace(' ', \"_\");\n    let sql = format!(\"DELETE {table}:{id};\");\n    match client.query(&sql).await {\n        Ok(_) => HttpResponse::NoContent().finish(),\n        Err(e) => HttpResponse::InternalServerError().body(e.to_string()),\n    }\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/routes/get_resource", "title": "get_resource", "type": "Function", "description": "Generic handler for getting a document by ID: `GET /api/v1/resource/{doctype}/{id}`", "resource": "crates/frappe-net/src/routes.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub async fn get_resource(\n    req: HttpRequest,\n    path: web::Path<(String, String)>,\n    pool_mgr: web::Data<ConnectionPoolManager>,\n) -> impl Responder {\n    let (doctype, id) = path.into_inner();\n    let tenant_id = match req.extensions().get::<TenantId>() {\n        Some(t) => t.clone(),\n        None => return HttpResponse::BadRequest().body(\"Missing tenant context\"),\n    };\n\n    let client = match pool_mgr.get_or_initialize_client(&tenant_id).await {\n        Ok(c) => c,\n        Err(e) => return HttpResponse::InternalServerError().body(e.to_string()),\n    };\n\n    let table = doctype.to_lowercase().replace(' ', \"_\");\n    let sql = format!(\"SELECT * FROM {table}:{id};\");\n    match client.query(&sql).await {\n        Ok(mut res) => {\n            let record: Option<serde_json::Value> = res.take(0).unwrap_or(None);\n            match record {\n                Some(r) => HttpResponse::Ok().json(r),\n                None => HttpResponse::NotFound().body(\"Record not found\"),\n            }\n        }\n        Err(e) => HttpResponse::InternalServerError().body(e.to_string()),\n    }\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/routes/list_resource", "title": "list_resource", "type": "Function", "description": "Generic handler for listing documents: `GET /api/v1/resource/{doctype}`", "resource": "crates/frappe-net/src/routes.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub async fn list_resource(\n    req: HttpRequest,\n    path: web::Path<String>,\n    query: web::Query<ListQuery>,\n    pool_mgr: web::Data<ConnectionPoolManager>,\n) -> impl Responder {\n    let doctype = path.into_inner();\n    let tenant_id = match req.extensions().get::<TenantId>() {\n        Some(t) => t.clone(),\n        None => return HttpResponse::BadRequest().body(\"Missing tenant context\"),\n    };\n\n    let client = match pool_mgr.get_or_initialize_client(&tenant_id).await {\n        Ok(c) => c,\n        Err(e) => return HttpResponse::InternalServerError().body(e.to_string()),\n    };\n\n    let table = doctype.to_lowercase().replace(' ', \"_\");\n    let limit = query.limit.unwrap_or(20);\n    let offset = query.offset.unwrap_or(0);\n\n    let sql = format!(\"SELECT * FROM {table} LIMIT {limit} START {offset};\");\n    match client.query(&sql).await {\n        Ok(mut res) => {\n            let records: Vec<serde_json::Value> = res.take(0).unwrap_or_default();\n            HttpResponse::Ok().json(records)\n        }\n        Err(e) => HttpResponse::InternalServerError().body(e.to_string()),\n    }\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/server", "title": "server", "type": "Module", "description": "", "resource": "crates/frappe-net/src/server.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-net/src/server/configure_app", "title": "configure_app", "type": "Function", "description": "Configures the Actix Web ERP API application.", "resource": "crates/frappe-net/src/server.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn configure_app(cfg: &mut web::ServiceConfig, pool_mgr: ConnectionPoolManager) {\n    cfg.app_data(web::Data::new(pool_mgr))\n        .route(\"/health\", web::get().to(health_check))\n        .route(\"/api/v1/live\", web::get().to(live_ws_handler))\n        .service(\n            web::scope(\"/api/v1/resource\")\n                .wrap(TenantResolver)\n                .route(\"/{doctype}\", web::get().to(list_resource))\n                .route(\"/{doctype}\", web::post().to(create_resource))\n                .route(\"/{doctype}/{id}\", web::get().to(get_resource))\n                .route(\"/{doctype}/{id}\", web::delete().to(delete_resource)),\n        );\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/server/health_check", "title": "health_check", "type": "Function", "description": "", "resource": "crates/frappe-net/src/server.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "async fn health_check() -> impl Responder {\n    HttpResponse::Ok().json(serde_json::json!({\n        \"status\": \"healthy\",\n        \"version\": env!(\"CARGO_PKG_VERSION\")\n    }))\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/server/run_server", "title": "run_server", "type": "Function", "description": "Runs the Actix Web Server on the specified address.", "resource": "crates/frappe-net/src/server.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub async fn run_server(addr: &str) -> std::io::Result<()> {\n    let pool_mgr = ConnectionPoolManager::new(Duration::from_secs(300));\n    let pool_mgr_data = pool_mgr.clone();\n\n    HttpServer::new(move || {\n        App::new().configure(|cfg| configure_app(cfg, pool_mgr_data.clone()))\n    })\n    .bind(addr)?\n    .run()\n    .await\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant", "title": "tenant", "type": "Module", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/ConnectionPoolManager", "title": "ConnectionPoolManager", "type": "Class", "description": "Dynamic Connection Pool Manager for multi-tenant database handles.", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct ConnectionPoolManager {\n    pools: Arc<RwLock<HashMap<TenantId, (Surreal<surrealdb::engine::local::Db>, Instant)>>>,\n    inactivity_threshold: Duration,\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/TenantError", "title": "TenantError", "type": "Class", "description": "Multi-tenant pool and routing errors.", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum TenantError {\n    /// Remote/Local database connection failure.\n    #[error(\"Database connection failed: {0}\")]\n    ConnectionFailed(String),\n    /// Tenant authentication failure.\n    #[error(\"Tenant authentication failed: {0}\")]\n    AuthenticationFailed(String),\n    /// Host header or X-Tenant-Id could not be resolved.\n    #[error(\"Tenant unresolved from request\")]\n    TenantUnresolved,\n    /// Pool acquisition timed out.\n    #[error(\"Connection pool acquisition timeout\")]\n    PoolAcquisitionTimeout,\n    /// Database namespace initialization failed.\n    #[error(\"Namespace initialization failed: {0}\")]\n    NamespaceInitializationFailed(String),\n    /// Tenant identifier is invalid.\n    #[error(\"Invalid tenant identifier: must be alphanumeric (hyphens allowed) and <= 63 characters\")]\n    InvalidTenantIdentifier,\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/TenantId", "title": "TenantId", "type": "Class", "description": "Unique Tenant Identifier.", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct TenantId(pub String);", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/TenantResolver", "title": "TenantResolver", "type": "Class", "description": "Actix Web Middleware for dynamic Tenant Resolution.", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct TenantResolver;", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/TenantResolverMiddleware", "title": "TenantResolverMiddleware", "type": "Class", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct TenantResolverMiddleware<S> {\n    service: Arc<S>,\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/call", "title": "call", "type": "Function", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn call(&self, req: ServiceRequest) -> Self::Future {\n        let host = req.connection_info().host().to_string();\n        let headers = req.headers().clone();\n\n        match parse_tenant_id(&headers, &host) {\n            Ok(tenant_id) => {\n                req.extensions_mut().insert(tenant_id);\n                let svc = self.service.clone();\n                Box::pin(async move { svc.call(req).await })\n            }\n            Err(e) => Box::pin(async move { Err(ActixError::from(e)) }),\n        }\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/call_1", "title": "call", "type": "Function", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn call(&self, req: ServiceRequest) -> Self::Future {\n        let host = req.connection_info().host().to_string();\n        let headers = req.headers().clone();\n\n        match parse_tenant_id(&headers, &host) {\n            Ok(tenant_id) => {\n                req.extensions_mut().insert(tenant_id);\n                let svc = self.service.clone();\n                Box::pin(async move { svc.call(req).await })\n            }\n            Err(e) => Box::pin(async move { Err(ActixError::from(e)) }),\n        }\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/default", "title": "default", "type": "Function", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn default() -> Self {\n        Self::new(Duration::from_secs(300))\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/default_1", "title": "default", "type": "Function", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn default() -> Self {\n        Self::new(Duration::from_secs(300))\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/error_response", "title": "error_response", "type": "Function", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn error_response(&self) -> HttpResponse<BoxBody> {\n        let status = self.status_code();\n        let body = serde_json::json!({\n            \"type\": \"https://datatracker.ietf.org/doc/html/rfc7807\",\n            \"title\": status.canonical_reason().unwrap_or(\"Error\"),\n            \"status\": status.as_u16(),\n            \"detail\": self.to_string(),\n        });\n        HttpResponse::build(status).json(body)\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/error_response_1", "title": "error_response", "type": "Function", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn error_response(&self) -> HttpResponse<BoxBody> {\n        let status = self.status_code();\n        let body = serde_json::json!({\n            \"type\": \"https://datatracker.ietf.org/doc/html/rfc7807\",\n            \"title\": status.canonical_reason().unwrap_or(\"Error\"),\n            \"status\": status.as_u16(),\n            \"detail\": self.to_string(),\n        });\n        HttpResponse::build(status).json(body)\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/evict_idle_pools", "title": "evict_idle_pools", "type": "Function", "description": "Evicts idle pools exceeding the configured inactivity duration.", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub async fn evict_idle_pools(&self) -> usize {\n        let mut write_guard = self.pools.write().await;\n        let now = Instant::now();\n        let threshold = self.inactivity_threshold;\n        let initial_count = write_guard.len();\n\n        write_guard.retain(|_, (_, last_used)| now.duration_since(*last_used) < threshold);\n        initial_count - write_guard.len()\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/evict_idle_pools_1", "title": "evict_idle_pools", "type": "Function", "description": "Evicts idle pools exceeding the configured inactivity duration.", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub async fn evict_idle_pools(&self) -> usize {\n        let mut write_guard = self.pools.write().await;\n        let now = Instant::now();\n        let threshold = self.inactivity_threshold;\n        let initial_count = write_guard.len();\n\n        write_guard.retain(|_, (_, last_used)| now.duration_since(*last_used) < threshold);\n        initial_count - write_guard.len()\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/get_or_initialize_client", "title": "get_or_initialize_client", "type": "Function", "description": "Retrieves an active connection handle for the tenant, initializing if missing.", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub async fn get_or_initialize_client(\n        &self,\n        tenant: &TenantId,\n    ) -> Result<Surreal<surrealdb::engine::local::Db>, TenantError> {\n        // 1. Fast read-lock lookup\n        {\n            let read_guard = self.pools.read().await;\n            if let Some((client, _)) = read_guard.get(tenant) {\n                return Ok(client.clone());\n            }\n        }\n\n        // 2. Write-lock initialization\n        let mut write_guard = self.pools.write().await;\n        if let Some((client, _)) = write_guard.get(tenant) {\n            return Ok(client.clone());\n        }\n\n        let db = Surreal::new::<Mem>(())\n            .await\n            .map_err(|e| TenantError::ConnectionFailed(e.to_string()))?;\n\n        let ns = format!(\"tenant_{}\", tenant.0.replace('-', \"_\"));\n        db.use_ns(&ns)\n            .use_db(\"erp\")\n            .await\n            .map_err(|e| TenantError::NamespaceInitializationFailed(e.to_string()))?;\n\n        write_guard.insert(tenant.clone(), (db.clone(), Instant::now()));\n        Ok(db)\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/get_or_initialize_client_1", "title": "get_or_initialize_client", "type": "Function", "description": "Retrieves an active connection handle for the tenant, initializing if missing.", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub async fn get_or_initialize_client(\n        &self,\n        tenant: &TenantId,\n    ) -> Result<Surreal<surrealdb::engine::local::Db>, TenantError> {\n        // 1. Fast read-lock lookup\n        {\n            let read_guard = self.pools.read().await;\n            if let Some((client, _)) = read_guard.get(tenant) {\n                return Ok(client.clone());\n            }\n        }\n\n        // 2. Write-lock initialization\n        let mut write_guard = self.pools.write().await;\n        if let Some((client, _)) = write_guard.get(tenant) {\n            return Ok(client.clone());\n        }\n\n        let db = Surreal::new::<Mem>(())\n            .await\n            .map_err(|e| TenantError::ConnectionFailed(e.to_string()))?;\n\n        let ns = format!(\"tenant_{}\", tenant.0.replace('-', \"_\"));\n        db.use_ns(&ns)\n            .use_db(\"erp\")\n            .await\n            .map_err(|e| TenantError::NamespaceInitializationFailed(e.to_string()))?;\n\n        write_guard.insert(tenant.clone(), (db.clone(), Instant::now()));\n        Ok(db)\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/new", "title": "new", "type": "Function", "description": "Creates a new connection pool manager.", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new(inactivity_threshold: Duration) -> Self {\n        Self {\n            pools: Arc::new(RwLock::new(HashMap::new())),\n            inactivity_threshold,\n        }\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/new_1", "title": "new", "type": "Function", "description": "Creates a new connection pool manager.", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new(inactivity_threshold: Duration) -> Self {\n        Self {\n            pools: Arc::new(RwLock::new(HashMap::new())),\n            inactivity_threshold,\n        }\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/new_transform", "title": "new_transform", "type": "Function", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn new_transform(&self, service: S) -> Self::Future {\n        ok(TenantResolverMiddleware {\n            service: Arc::new(service),\n        })\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/new_transform_1", "title": "new_transform", "type": "Function", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn new_transform(&self, service: S) -> Self::Future {\n        ok(TenantResolverMiddleware {\n            service: Arc::new(service),\n        })\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/parse_tenant_id", "title": "parse_tenant_id", "type": "Function", "description": "Resolves tenant identity from request headers or host string.", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn parse_tenant_id(headers: &actix_web::http::header::HeaderMap, host: &str) -> Result<TenantId, TenantError> {\n    if let Some(tenant_hdr) = headers.get(\"X-Tenant-Id\") {\n        if let Ok(tenant_str) = tenant_hdr.to_str() {\n            return validate_and_create_tenant_id(tenant_str);\n        }\n    }\n\n    let host_regex = Regex::new(r\"^(?P<tenant>[a-z0-9-]+)\\.[a-z0-9.-]+$\")\n        .map_err(|e| TenantError::ConnectionFailed(e.to_string()))?;\n\n    if let Some(caps) = host_regex.captures(host) {\n        if let Some(m) = caps.name(\"tenant\") {\n            return validate_and_create_tenant_id(m.as_str());\n        }\n    }\n\n    Err(TenantError::TenantUnresolved)\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/poll_ready", "title": "poll_ready", "type": "Function", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn poll_ready(\n        &self,\n        cx: &mut std::task::Context<'_>,\n    ) -> std::task::Poll<Result<(), Self::Error>> {\n        self.service.poll_ready(cx)\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/poll_ready_1", "title": "poll_ready", "type": "Function", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn poll_ready(\n        &self,\n        cx: &mut std::task::Context<'_>,\n    ) -> std::task::Poll<Result<(), Self::Error>> {\n        self.service.poll_ready(cx)\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/provision_tenant", "title": "provision_tenant", "type": "Function", "description": "Cloud Multi-Tenant Provisioning Coordinator (Milestone 5.8).", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub async fn provision_tenant(\n    pool_manager: &ConnectionPoolManager,\n    tenant_id: &str,\n) -> Result<Surreal<surrealdb::engine::local::Db>, TenantError> {\n    let tenant = validate_and_create_tenant_id(tenant_id)?;\n    let client = pool_manager.get_or_initialize_client(&tenant).await?;\n\n    // Seed baseline core tables\n    let seed_query = r#\"\n        DEFINE TABLE system_settings SCHEMAFULL;\n        DEFINE FIELD tenant_name ON TABLE system_settings TYPE string;\n        DEFINE FIELD created_at ON TABLE system_settings TYPE datetime DEFAULT time::now();\n        CREATE system_settings SET tenant_name = $tenant_name;\n    \"#;\n\n    client\n        .query(seed_query)\n        .bind((\"tenant_name\", tenant.0))\n        .await\n        .map_err(|e| TenantError::NamespaceInitializationFailed(e.to_string()))?\n        .check()\n        .map_err(|e| TenantError::NamespaceInitializationFailed(e.to_string()))?;\n\n    Ok(client)\n}", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/spawn_maintenance_worker", "title": "spawn_maintenance_worker", "type": "Function", "description": "St
