ult<Vec<AmortizationPeriod>, LendingError> {\n        if total_periods == 0 {\n            return Err(LendingError::InvalidTenure);\n        }\n        if principal <= Decimal::ZERO {\n            return Err(LendingError::InvalidPrincipal(principal));\n        }\n\n        let pmt = Self::calculate_pmt(principal, annual_interest_rate, total_periods);\n        let monthly_rate = (annual_interest_rate / dec!(100.0)) / dec!(12.0);\n\n        let mut schedule = Vec::with_capacity(total_periods);\n        let mut current_balance = principal;\n        let mut current_date = start_date;\n\n        for period_no in 1..=total_periods {\n            // Next month date advance (approximate 30 days)\n            current_date = current_date\n                .checked_add_signed(chrono::Duration::days(30))\n                .unwrap_or(current_date);\n\n            let interest_portion = (current_balance * monthly_rate).round_dp(2);\n\n            let (principal_portion, remaining_balance) = if period_no == total_periods {\n                // Final period: pay off exact remaining balance to terminate at exactly 0.00\n                (current_balance, Decimal::ZERO)\n            } else {\n                let p = pmt - interest_portion;\n                let rem = (current_balance - p).round_dp(2);\n                (p, rem)\n            };\n\n            let installment_amount = principal_portion + interest_portion;\n            current_balance = remaining_balance;\n\n            schedule.push(AmortizationPeriod {\n                period_no,\n                payment_date: current_date,\n                installment_amount,\n                principal_portion,\n                interest_portion,\n                remaining_balance,\n            });\n        }\n\n        Ok(schedule)\n    }", "bundle": "crates"}, {"id": "crates/erp-lending/src/amortization/generate_schedule_1", "title": "generate_schedule", "type": "Function", "description": "Generates complete amortization schedule with zero-loss final fractional cent reconciliation.", "resource": "crates/erp-lending/src/amortization.rs", "tags": ["domain:erp-lending", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn generate_schedule(\n        principal: Decimal,\n        annual_interest_rate: Decimal,\n        total_periods: usize,\n        start_date: NaiveDate,\n    ) -> Result<Vec<AmortizationPeriod>, LendingError> {\n        if total_periods == 0 {\n            return Err(LendingError::InvalidTenure);\n        }\n        if principal <= Decimal::ZERO {\n            return Err(LendingError::InvalidPrincipal(principal));\n        }\n\n        let pmt = Self::calculate_pmt(principal, annual_interest_rate, total_periods);\n        let monthly_rate = (annual_interest_rate / dec!(100.0)) / dec!(12.0);\n\n        let mut schedule = Vec::with_capacity(total_periods);\n        let mut current_balance = principal;\n        let mut current_date = start_date;\n\n        for period_no in 1..=total_periods {\n            // Next month date advance (approximate 30 days)\n            current_date = current_date\n                .checked_add_signed(chrono::Duration::days(30))\n                .unwrap_or(current_date);\n\n            let interest_portion = (current_balance * monthly_rate).round_dp(2);\n\n            let (principal_portion, remaining_balance) = if period_no == total_periods {\n                // Final period: pay off exact remaining balance to terminate at exactly 0.00\n                (current_balance, Decimal::ZERO)\n            } else {\n                let p = pmt - interest_portion;\n                let rem = (current_balance - p).round_dp(2);\n                (p, rem)\n            };\n\n            let installment_amount = principal_portion + interest_portion;\n            current_balance = remaining_balance;\n\n            schedule.push(AmortizationPeriod {\n                period_no,\n                payment_date: current_date,\n                installment_amount,\n                principal_portion,\n                interest_portion,\n                remaining_balance,\n            });\n        }\n\n        Ok(schedule)\n    }", "bundle": "crates"}, {"id": "crates/erp-lending/src/amortization/repayment_to_journal_entry", "title": "repayment_to_journal_entry", "type": "Function", "description": "Converts repayment entries into a validated JournalEntry document.", "resource": "crates/erp-lending/src/amortization.rs", "tags": ["domain:erp-lending", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn repayment_to_journal_entry(\n        entries: &[GlEntry],\n        posting_date: NaiveDate,\n        company: &str,\n        remarks: &str,\n    ) -> JournalEntry {\n        let lines = entries\n            .iter()\n            .map(|e| JournalEntryLine {\n                account: e.account.clone(),\n                debit: e.debit,\n                credit: e.credit,\n                debit_in_account_currency: e.debit,\n                credit_in_account_currency: e.credit,\n                exchange_rate: Decimal::ONE,\n                party_type: e.party_type.clone(),\n                party: e.party.clone(),\n            })\n            .collect();\n\n        JournalEntry {\n            posting_date,\n            company: company.to_string(),\n            lines,\n            remarks: remarks.to_string(),\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-lending/src/amortization/repayment_to_journal_entry_1", "title": "repayment_to_journal_entry", "type": "Function", "description": "Converts repayment entries into a validated JournalEntry document.", "resource": "crates/erp-lending/src/amortization.rs", "tags": ["domain:erp-lending", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn repayment_to_journal_entry(\n        entries: &[GlEntry],\n        posting_date: NaiveDate,\n        company: &str,\n        remarks: &str,\n    ) -> JournalEntry {\n        let lines = entries\n            .iter()\n            .map(|e| JournalEntryLine {\n                account: e.account.clone(),\n                debit: e.debit,\n                credit: e.credit,\n                debit_in_account_currency: e.debit,\n                credit_in_account_currency: e.credit,\n                exchange_rate: Decimal::ONE,\n                party_type: e.party_type.clone(),\n                party: e.party.clone(),\n            })\n            .collect();\n\n        JournalEntry {\n            posting_date,\n            company: company.to_string(),\n            lines,\n            remarks: remarks.to_string(),\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-lending/src/lib", "title": "lib", "type": "Module", "description": "", "resource": "crates/erp-lending/src/lib.rs", "tags": ["domain:erp-lending", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-lending/src/lib/test_loan_amortization_schedule_zero_termination", "title": "test_loan_amortization_schedule_zero_termination", "type": "Function", "description": "[test]", "resource": "crates/erp-lending/src/lib.rs", "tags": ["domain:erp-lending", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_loan_amortization_schedule_zero_termination() {\n        let principal = dec!(10000.00);\n        let annual_rate = dec!(12.0); // 12% annual rate = 1% per month\n        let periods = 12;\n        let start_date = NaiveDate::from_ymd_opt(2026, 1, 1).unwrap();\n\n        let schedule = AmortizationEngine::generate_schedule(\n            principal,\n            annual_rate,\n            periods,\n            start_date,\n        )\n        .expect(\"Schedule generation failed\");\n\n        assert_eq!(schedule.len(), 12);\n\n        // Sum of all principal portions must equal the original principal exactly\n        let total_principal_paid: Decimal = schedule.iter().map(|p| p.principal_portion).sum();\n        assert_eq!(total_principal_paid, principal);\n\n        // The final period's remaining balance must be exactly 0.00\n        let last_period = schedule.last().unwrap();\n        assert_eq!(last_period.remaining_balance, dec!(0.00));\n    }", "bundle": "crates"}, {"id": "crates/erp-lending/src/lib/test_loan_gl_repayment_journal_balance", "title": "test_loan_gl_repayment_journal_balance", "type": "Function", "description": "[test]", "resource": "crates/erp-lending/src/lib.rs", "tags": ["domain:erp-lending", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_loan_gl_repayment_journal_balance() {\n        let date = NaiveDate::from_ymd_opt(2026, 2, 1).unwrap();\n        let entries = LoanGlEngine::create_repayment_gl_entries(\n            \"1110 - Bank Account\",\n            \"1250 - Loan Principal Receivable\",\n            \"1260 - Interest Receivable\",\n            dec!(800.00),\n            dec!(100.00),\n            date,\n            \"LN-REP-001\",\n            \"Acme Corp\",\n        );\n\n        assert_eq!(entries.len(), 3);\n        let jv = LoanGlEngine::repayment_to_journal_entry(&entries, date, \"Acme Corp\", \"Month 1 Loan Repayment\");\n        assert!(jv.validate_balance().is_ok());\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/bom", "title": "bom", "type": "Module", "description": "", "resource": "crates/erp-manufacturing/src/bom.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/bom/Bom", "title": "Bom", "type": "Class", "description": "Complete Bill of Materials document.", "resource": "crates/erp-manufacturing/src/bom.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct Bom {\n    /// BOM identifier (e.g. \"BOM-DRONE-001\").\n    pub name: String,\n    /// Assembly item code produced.\n    pub item: String,\n    /// Component lines.\n    pub items: Vec<BomItem>,\n    /// Routing operations.\n    pub operations: Vec<BomOperation>,\n    /// Is this the active default BOM?\n    pub is_active: bool,\n}", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/bom/BomEngine", "title": "BomEngine", "type": "Class", "description": "Graph-Based BOM Engine (Milestones 3.1 & 3.2).", "resource": "crates/erp-manufacturing/src/bom.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct BomEngine;", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/bom/BomItem", "title": "BomItem", "type": "Class", "description": "Raw material or sub-assembly line in a Bill of Materials.", "resource": "crates/erp-manufacturing/src/bom.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct BomItem {\n    /// Target component item code.\n    pub item_code: String,\n    /// Required quantity per parent assembly unit.\n    pub qty: Decimal,\n    /// Expected scrap loss percentage (e.g. 5.0 for 5%).\n    pub scrap_percentage: Decimal,\n    /// Associated child BOM ID if this component is a sub-assembly.\n    pub bom_no: Option<String>,\n}", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/bom/BomOperation", "title": "BomOperation", "type": "Class", "description": "Operational routing step on a workstation.", "resource": "crates/erp-manufacturing/src/bom.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct BomOperation {\n    /// Operation name (e.g. \"Laser Cutting\", \"Surface Mounting\").\n    pub operation: String,\n    /// Target workstation identifier.\n    pub workstation: String,\n    /// Operating runtime in minutes.\n    pub time_in_mins: Decimal,\n    /// Workstation hourly rate.\n    pub hour_rate: Decimal,\n}", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/bom/ManufacturingError", "title": "ManufacturingError", "type": "Class", "description": "Manufacturing and BOM errors.", "resource": "crates/erp-manufacturing/src/bom.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum ManufacturingError {\n    /// Circular dependency detected in BOM assembly tree.\n    #[error(\"Circular dependency detected in BOM: {0}\")]\n    CircularDependencyDetected(String),\n    /// BOM not found.\n    #[error(\"BOM not found for item: {0}\")]\n    BomNotFound(String),\n    /// Workstation collision.\n    #[error(\"Workstation '{workstation}' conflict between [{start_1}, {end_1}] and [{start_2}, {end_2}]\")]\n    WorkstationCollision {\n        workstation: String,\n        start_1: u64,\n        end_1: u64,\n        start_2: u64,\n        end_2: u64,\n    },\n}", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/bom/calculate_cost", "title": "calculate_cost", "type": "Function", "description": "Calculates operation labor and machinery cost.", "resource": "crates/erp-manufacturing/src/bom.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn calculate_cost(&self) -> Decimal {\n        (self.time_in_mins / Decimal::from(60)) * self.hour_rate\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/bom/calculate_cost_1", "title": "calculate_cost", "type": "Function", "description": "Calculates operation labor and machinery cost.", "resource": "crates/erp-manufacturing/src/bom.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn calculate_cost(&self) -> Decimal {\n        (self.time_in_mins / Decimal::from(60)) * self.hour_rate\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/bom/calculate_cost_rollup", "title": "calculate_cost_rollup", "type": "Function", "description": "Recursive Multi-Level BOM Cost Rollup Engine (Milestone 3.2).", "resource": "crates/erp-manufacturing/src/bom.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn calculate_cost_rollup(\n        item_code: &str,\n        boms_by_item: &HashMap<String, Bom>,\n        item_valuation_rates: &HashMap<String, Decimal>,\n    ) -> Result<Decimal, ManufacturingError> {\n        let mut total_cost = Decimal::ZERO;\n\n        if let Some(bom) = boms_by_item.get(item_code) {\n            // 1. Operations cost on this assembly\n            for op in &bom.operations {\n                total_cost += op.calculate_cost();\n            }\n\n            // 2. Recursive component cost rollup\n            for component in &bom.items {\n                let scrap_factor = Decimal::ONE + (component.scrap_percentage / Decimal::from(100));\n                let effective_qty = component.qty * scrap_factor;\n\n                let component_unit_cost = if boms_by_item.contains_key(&component.item_code) {\n                    // Sub-assembly: recurse\n                    Self::calculate_cost_rollup(\n                        &component.item_code,\n                        boms_by_item,\n                        item_valuation_rates,\n                    )?\n                } else {\n                    // Leaf raw material: lookup valuation rate\n                    *item_valuation_rates\n                        .get(&component.item_code)\n                        .unwrap_or(&Decimal::ZERO)\n                };\n\n                total_cost += component_unit_cost * effective_qty;\n            }\n            Ok(total_cost)\n        } else {\n            // Leaf item valuation rate\n            Ok(*item_valuation_rates\n                .get(item_code)\n                .unwrap_or(&Decimal::ZERO))\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/bom/calculate_cost_rollup_1", "title": "calculate_cost_rollup", "type": "Function", "description": "Recursive Multi-Level BOM Cost Rollup Engine (Milestone 3.2).", "resource": "crates/erp-manufacturing/src/bom.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn calculate_cost_rollup(\n        item_code: &str,\n        boms_by_item: &HashMap<String, Bom>,\n        item_valuation_rates: &HashMap<String, Decimal>,\n    ) -> Result<Decimal, ManufacturingError> {\n        let mut total_cost = Decimal::ZERO;\n\n        if let Some(bom) = boms_by_item.get(item_code) {\n            // 1. Operations cost on this assembly\n            for op in &bom.operations {\n                total_cost += op.calculate_cost();\n            }\n\n            // 2. Recursive component cost rollup\n            for component in &bom.items {\n                let scrap_factor = Decimal::ONE + (component.scrap_percentage / Decimal::from(100));\n                let effective_qty = component.qty * scrap_factor;\n\n                let component_unit_cost = if boms_by_item.contains_key(&component.item_code) {\n                    // Sub-assembly: recurse\n                    Self::calculate_cost_rollup(\n                        &component.item_code,\n                        boms_by_item,\n                        item_valuation_rates,\n                    )?\n                } else {\n                    // Leaf raw material: lookup valuation rate\n                    *item_valuation_rates\n                        .get(&component.item_code)\n                        .unwrap_or(&Decimal::ZERO)\n                };\n\n                total_cost += component_unit_cost * effective_qty;\n            }\n            Ok(total_cost)\n        } else {\n            // Leaf item valuation rate\n            Ok(*item_valuation_rates\n                .get(item_code)\n                .unwrap_or(&Decimal::ZERO))\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/bom/detect_cycles", "title": "detect_cycles", "type": "Function", "description": "Detects circular dependencies across BOM hierarchies using DFS cycle detection.", "resource": "crates/erp-manufacturing/src/bom.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn detect_cycles(\n        boms_by_item: &HashMap<String, Bom>,\n    ) -> Result<(), ManufacturingError> {\n        let mut visited = HashSet::new();\n        let mut recursion_stack = HashSet::new();\n\n        for item_code in boms_by_item.keys() {\n            if !visited.contains(item_code) {\n                Self::dfs_cycle_check(\n                    item_code,\n                    boms_by_item,\n                    &mut visited,\n                    &mut recursion_stack,\n                )?;\n            }\n        }\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/bom/detect_cycles_1", "title": "detect_cycles", "type": "Function", "description": "Detects circular dependencies across BOM hierarchies using DFS cycle detection.", "resource": "crates/erp-manufacturing/src/bom.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn detect_cycles(\n        boms_by_item: &HashMap<String, Bom>,\n    ) -> Result<(), ManufacturingError> {\n        let mut visited = HashSet::new();\n        let mut recursion_stack = HashSet::new();\n\n        for item_code in boms_by_item.keys() {\n            if !visited.contains(item_code) {\n                Self::dfs_cycle_check(\n                    item_code,\n                    boms_by_item,\n                    &mut visited,\n                    &mut recursion_stack,\n                )?;\n            }\n        }\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/bom/dfs_cycle_check", "title": "dfs_cycle_check", "type": "Function", "description": "", "resource": "crates/erp-manufacturing/src/bom.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn dfs_cycle_check(\n        current_item: &str,\n        boms_by_item: &HashMap<String, Bom>,\n        visited: &mut HashSet<String>,\n        recursion_stack: &mut HashSet<String>,\n    ) -> Result<(), ManufacturingError> {\n        visited.insert(current_item.to_string());\n        recursion_stack.insert(current_item.to_string());\n\n        if let Some(bom) = boms_by_item.get(current_item) {\n            for child in &bom.items {\n                if !visited.contains(&child.item_code) {\n                    Self::dfs_cycle_check(\n                        &child.item_code,\n                        boms_by_item,\n                        visited,\n                        recursion_stack,\n                    )?;\n                } else if recursion_stack.contains(&child.item_code) {\n                    return Err(ManufacturingError::CircularDependencyDetected(format!(\n                        \"Cycle detected: {current_item} -> {}\",\n                        child.item_code\n                    )));\n                }\n            }\n        }\n\n        recursion_stack.remove(current_item);\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/bom/dfs_cycle_check_1", "title": "dfs_cycle_check", "type": "Function", "description": "", "resource": "crates/erp-manufacturing/src/bom.rs", "tags": [ Map::new();\n\n        // BOM A requires BOM B\n        boms.insert(\n            \"ITEM_A\".into(),\n            Bom {\n                name: \"BOM-A\".into(),\n                item: \"ITEM_A\".into(),\n                items: vec![BomItem {\n                    item_code: \"ITEM_B\".into(),\n                    qty: dec!(1.0),\n                    scrap_percentage: dec!(0.0),\n                    bom_no: Some(\"BOM-B\".into()),\n                }],\n                operations: vec![],\n                is_active: true,\n            },\n        );\n\n        // BOM B requires BOM C\n        boms.insert(\n            \"ITEM_B\".into(),\n            Bom {\n                name: \"BOM-B\".into(),\n                item: \"ITEM_B\".into(),\n                items: vec![BomItem {\n                    item_code: \"ITEM_C\".into(),\n                    qty: dec!(1.0),\n                    scrap_percentage: dec!(0.0),\n                    bom_no: Some(\"BOM-C\".into()),\n                }],\n                operations: vec![],\n                is_active: true,\n            },\n        );\n\n        // BOM C requires BOM A -> Creates circular dependency A -> B -> C -> A\n        boms.insert(\n            \"ITEM_C\".into(),\n            Bom {\n                name: \"BOM-C\".into(),\n                item: \"ITEM_C\".into(),\n                items: vec![BomItem {\n                    item_code: \"ITEM_A\".into(),\n                    qty: dec!(1.0),\n                    scrap_percentage: dec!(0.0),\n                    bom_no: Some(\"BOM-A\".into()),\n                }],\n                operations: vec![],\n                is_active: true,\n            },\n        );\n\n        let res = BomEngine::detect_cycles(&boms);\n        assert!(matches!(\n            res,\n            Err(ManufacturingError::CircularDependencyDetected(_))\n        ));\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/lib/test_mrp_net_requirement_and_workstation_scheduling", "title": "te b fn calculate_net_requirement(\n        gross_demand: Decimal,\n        current_stock: Decimal,\n        open_purchase_orders: Decimal,\n        safety_stock: Decimal,\n    ) -> Decimal {\n        let net = gross_demand - current_stock - open_purchase_orders + safety_stock;\n        net.max(Decimal::ZERO)\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/mrp/new", "title": "new", "type": "Function", "description": "Creates a new scheduler instance.", "resource": "crates/erp-manufacturing/src/mrp.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new() -> Self {\n        Self::default()\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/mrp/new_1", "title": "new", "type": "Function", "description": "Creates a new scheduler instance.", "resource": "crates/erp-manufacturing/src/mrp.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new() -> Self {\n        Self::default()\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/mrp/plan_order", "title": "plan_order", "type": "Function", "description": "Generates a planned replenishment order.", "resource": "crates/erp-manufacturing/src/mrp.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn plan_order(\n        item_code: &str,\n        gross_demand: Decimal,\n        current_stock: Decimal,\n        open_po: Decimal,\n        safety_stock: Decimal,\n        is_manufactured: bool,\n        lead_time_days: u32,\n    ) -> Option<PlannedOrder> {\n        let net = Self::calculate_net_requirement(gross_demand, current_stock, open_po, safety_stock);\n        if net > Decimal::ZERO {\n            Some(PlannedOrder {\n                item_code: item_code.to_string(),\n                qty: net,\n                order_type: if is_manufactured {\n                    OrderType::WorkOrder\n                } else {\n                    OrderType::PurchaseOrder\n                },\n                lead_time_days,\n            })\n        } else {\n            None\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/mrp/plan_order_1", "title": "plan_order", "type": "Function", "description": "Generates a planned replenishment order.", "resource": "crates/erp-manufacturing/src/mrp.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn plan_order(\n        item_code: &str,\n        gross_demand: Decimal,\n        current_stock: Decimal,\n        open_po: Decimal,\n        safety_stock: Decimal,\n        is_manufactured: bool,\n        lead_time_days: u32,\n    ) -> Option<PlannedOrder> {\n        let net = Self::calculate_net_requirement(gross_demand, current_stock, open_po, safety_stock);\n        if net > Decimal::ZERO {\n            Some(PlannedOrder {\n                item_code: item_code.to_string(),\n                qty: net,\n                order_type: if is_manufactured {\n                    OrderType::WorkOrder\n                } else {\n                    OrderType::PurchaseOrder\n                },\n                lead_time_days,\n            })\n        } else {\n            None\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/mrp/schedule_operation", "title": "schedule_operation", "type": "Function", "description": "Schedules an operation interval, automatically sliding forward if a collision occurs.", "resource": "crates/erp-manufacturing/src/mrp.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn schedule_operation(\n        &mut self,\n        workstation: &str,\n        job_id: String,\n        mut desired_start: u64,\n        duration: u64,\n    ) -> ScheduledSlot {\n        let slots = self.bookings.entry(workstation.to_string()).or_default();\n\n        // Sort existing slots by start time\n        slots.sort_by_key(|s| s.start_time);\n\n        // Slide forward until we find an available window\n        for booked in slots.iter() {\n            let desired_end = desired_start + duration;\n            // Collision condition: max(start1, start2) < min(end1, end2)\n            if desired_start.max(booked.start_time) < desired_end.min(booked.end_time) {\n                // Collides: slide desired_start forward to end of booked slot\n                desired_start = booked.end_time;\n            }\n        }\n\n        let assigned = ScheduledSlot {\n            job_id,\n            start_time: desired_start,\n            end_time: desired_start + duration,\n        };\n\n        slots.push(assigned.clone());\n        assigned\n    }", "bundle": "crates"}, {"id": "crates/erp-manufacturing/src/mrp/schedule_operation_1", "title": "schedule_operation", "type": "Function", "description": "Schedules an operation interval, automatically sliding forward if a collision occurs.", "resource": "crates/erp-manufacturing/src/mrp.rs", "tags": ["domain:erp-manufacturing", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn schedule_operation(\n        &mut self,\n        workstation: &str,\n        job_id: String,\n        mut desired_start: u64,\n        duration: u64,\n    ) -> ScheduledSlot {\n        let slots = self.bookings.entry(workstation.to_string()).or_default();\n\n        // Sort existing slots by start time\n        slots.sort_by_key(|s| s.start_time);\n\n        // Slide forward until we find an available window\n        for booked in slots.iter() {\n            let desired_end = desired_start + duration;\n            // Collision condition: max(start1, start2) < min(end1, end2)\n            if desired_start.max(booked.start_time) < desired_end.min(booked.end_time) {\n                // Collides: slide desired_start forward to end of booked slot\n                desired_start = booked.end_time;\n            }\n        }\n\n        let assigned = ScheduledSlot {\n            job_id,\n            start_time: desired_start,\n            end_time: desired_start + duration,\n        };\n\n        slots.push(assigned.clone());\n        assigned\n    }", "bundle": "crates"}, {"id": "crates/erp-support/src/gameplan", "title": "gameplan", "type": "Module", "description": "", "resource": "crates/erp-support/src/gameplan.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-support/src/gameplan/TaskStatus", "title": "TaskStatus", "type": "Class", "description": "Task status in collaborative workspace.", "resource": "crates/erp-support/src/gameplan.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum TaskStatus {\n    Backlog,\n    Todo,\n    InProgress,\n    Review,\n    Done,\n}", "bundle": "crates"}, {"id": "crates/erp-support/src/gameplan/WorkspaceManager", "title": "WorkspaceManager", "type": "Class", "description": "Real-Time Collaborative Workspace Manager (Milestone 4.3).", "resource": "crates/erp-support/src/gameplan.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct WorkspaceManager {\n    tasks: std::collections::HashMap<String, WorkspaceTask>,\n}", "bundle": "crates"}, {"id": "crates/erp-support/src/gameplan/WorkspaceTask", "title": "WorkspaceTask", "type": "Class", "description": "Collaborative project task.", "resource": "crates/erp-support/src/gameplan.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:r tatus", "title": "update_task_status", "type": "Function", "description": "Mutates task status.", "resource": "crates/erp-support/src/gameplan.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn update_task_status(\n        &mut self,\n        task_id: &str,\n        new_status: TaskStatus,\n    ) -> Option<WorkspaceTask> {\n        if let Some(task) = self.tasks.get_mut(task_id) {\n            task.status = new_status;\n            Some(task.clone())\n        } else {\n            None\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-support/src/gameplan/update_task_status_1", "title": "update_task_status", "type": "Function", "description": "Mutates task status.", "resource": "crates/erp-support/src/gameplan.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn update_task_status(\n        &mut self,\n        task_id: &str,\n        new_status: TaskStatus,\n    ) -> Option<WorkspaceTask> {\n        if let Some(task) = self.tasks.get_mut(task_id) {\n            task.status = new_status;\n            Some(task.clone())\n        } else {\n            None\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-support/src/lib", "title": "lib", "type": "Module", "description": "", "resource": "crates/erp-support/src/lib.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-support/src/lib/test_sla_watchdog_deadline_escalation", "title": "test_sla_watchdog_deadline_escalation", "type": "Function", "description": "[test]", "resource": "crates/erp-support/src/lib.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_sla_watchdog_deadline_escalation() {\n        let now = Utc::now();\n        let mut tickets = vec![\n            // Expired ticket (deadline 1 hour ago)\n            SupportTicket {\n                id: \"TICK-EXPIRED\".into(),\n                customer: \"Beta Corp\".into(),\n                subject: \"Server down\".into(),\n                priority: TicketPriority::High,\n                status: TicketStatus::Open,\n                assigned_to: None,\n                created_at: now - Duration::hours(5),\n                response_deadline: now - Duration::hours(1),\n            },\n            // Active ticket (deadline in 2 hours)\n            SupportTicket {\n                id: \"TICK-ACTIVE\".into(),\n                customer: \"Gamma Corp\".into(),\n                subject: \"Password reset\".into(),\n                priority: TicketPriority::Low,\n                status: TicketStatus::Open,\n                assigned_to: None,\n                created_at: now,\n                response_deadline: now + Duration::hours(2),\n            },\n        ];\n\n        let escalations = SlaWatchdog::evaluate_tickets(&mut tickets, now);\n\n        assert_eq!(escalations.len(), 1);\n        assert_eq!(escalations[0].ticket_id, \"TICK-EXPIRED\");\n        assert_eq!(escalations[0].previous_priority, TicketPriority::High);\n        assert_eq!(escalations[0].new_priority, TicketPriority::Urgent);\n\n        assert_eq!(tickets[0].priority, TicketPriority::Urgent);\n        assert_eq!(tickets[1].priority, TicketPriority::Low);\n    }", "bundle": "crates"}, {"id": "crates/erp-support/src/lib/test_ticket_routing_workload_balancer", "title": "test_ticket_routing_workload_balancer", "type": "Function", "description": "[test]", "resource": "crates/erp-support/src/lib.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_ticket_routing_workload_balancer() {\n        let mut agents = vec![\n            SupportAgent {\n                agent_id: \"agent_a\".into(),\n                name: \"Agent A\".into(),\n                is_online: true,\n                active_ticket_count: 3,\n            },\n            SupportAgent {\n                agent_id: \"agent_b\".into(),\n                name: \"Agent B\".into(),\n                is_online: true,\n                active_ticket_count: 1, // Lowest load\n            },\n            SupportAgent {\n                agent_id: \"agent_c\".into(),\n                name: \"Agent C (Offline)\".into(),\n                is_online: false,\n                active_ticket_count: 0,\n            },\n        ];\n\n        let now = Utc::now();\n        let mut ticket = SupportTicket {\n            id: \"TICK-001\".into(),\n            customer: \"Acme Corp\".into(),\n            subject: \"Printer issue\".into(),\n            priority: TicketPriority::Medium,\n            status: TicketStatus::Open,\n            assigned_to: None,\n            created_at: now,\n            response_deadline: now + Duration::hours(4),\n        };\n\n        // Assign ticket -> Should pick Agent B\n        let assigned_agent = TicketRouter::assign_ticket(&mut ticket, &mut agents)\n            .expect(\"Assignment failed\");\n\n        assert_eq!(assigned_agent.agent_id, \"agent_b\");\n        assert_eq!(assigned_agent.active_ticket_count, 2);\n        assert_eq!(ticket.assigned_to, Some(\"agent_b\".into()));\n        assert_eq!(ticket.status, TicketStatus::Assigned);\n    }", "bundle": "crates"}, {"id": "crates/erp-support/src/sla", "title": "sla", "type": "Module", "description": "", "resource": "crates/erp-support/src/sla.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-support/src/sla/SlaEscalationEvent", "title": "SlaEscalationEvent", "type": "Class", "description": "Escalation event generated upon SLA breach.", "resource": "crates/erp-support/src/sla.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct SlaEscalationEvent {\n    pub ticket_id: String,\n    pub previous_priority: TicketPriority,\n    pub new_priority: TicketPriority,\n    pub breached_at: DateTime<Utc>,\n}", "bundle": "crates"}, {"id": "crates/erp-support/src/sla/SlaWatchdog", "title": "SlaWatchdog", "type": "Class", "description": "Real-Time SLA Monitoring Watchdog (Milestone 4.2).", "resource": "crates/erp-support/src/sla.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct SlaWatchdog;", "bundle": "crates"}, {"id": "crates/erp-support/src/sla/SupportAgent", "title": "SupportAgent", "type": "Class", "description": "Support technician agent representation.", "resource": "crates/erp-support/src/sla.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct SupportAgent {\n    pub agent_id: String,\n    pub name: String,\n    pub is_online: bool,\n    pub active_ticket_count: usize,\n}", "bundle": "crates"}, {"id": "crates/erp-support/src/sla/SupportError", "title": "SupportError", "type": "Class", "description": "Support and ticketing errors.", "resource": "crates/erp-support/src/sla.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum SupportError {\n    /// No online support agents available.\n    #[error(\"No online support agents available for assignment\")]\n    NoOnlineAgentsAvailable,\n    /// Ticket not found.\n    #[error(\"Ticket not found: {0}\")]\n    TicketNotFound(String),\n}", "bundle": "crates"}, {"id": "crates/erp-support/src/sla/SupportTicket", "title": "SupportTicket", "type": "Class", "description": "Support Ticket record.", "resource": "crates/erp-support/src/sla.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct SupportTicket {\n    pub id: String,\n    pub customer: String,\n    pub subject: String,\n    pub priority: TicketPriority,\n    pub status: TicketStatus,\n    pub assigned_to: Option<String>,\n    pub created_at: DateTime<Utc>,\n    pub response_deadline: DateTime<Utc>,\n}", "bundle": "crates"}, {"id": "crates/erp-support/src/sla/TicketPriority", "title": "TicketPriority", "type": "Class", "description": "Support ticket priority levels.", "resource": "crates/erp-support/src/sla.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum TicketPriority {\n    Low,\n    Medium,\n    High,\n    Urgent,\n}", "bundle": "crates"}, {"id": "crates/erp-support/src/sla/TicketRouter", "title": "TicketRouter", "type": "Class", "description": "Omnichannel Ticket Routing & Workload Balancer (Milestone 4.1).", "resource": "crates/erp-support/src/sla.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct TicketRouter;", "bundle": "crates"}, {"id": "crates/erp-support/src/sla/TicketStatus", "title": "TicketStatus", "type": "Class", "description": "Operational status of support tickets.", "resource": "crates/erp-support/src/sla.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum TicketStatus {\n    Open,\n    Assigned,\n    Resolved,\n    Closed,\n}", "bundle": "crates"}, {"id": "crates/erp-support/src/sla/assign_ticket", "title": "assign_ticket", "type": "Function", "description": "Assigns an incoming ticket to the online technician with the lowest active workload.", "resource": "crates/erp-support/src/sla.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn assign_ticket<'a>(\n        ticket: &mut SupportTicket,\n        agents: &'a mut [SupportAgent],\n    ) -> Result<&'a mut SupportAgent, SupportError> {\n        let least_loaded = agents\n            .iter_mut()\n            .filter(|a| a.is_online)\n            .min_by_key(|a| a.active_ticket_count);\n\n        match least_loaded {\n            Some(agent) => {\n                agent.active_ticket_count += 1;\n                ticket.assigned_to = Some(agent.agent_id.clone());\n                ticket.status = TicketStatus::Assigned;\n                Ok(agent)\n            }\n            None => Err(SupportError::NoOnlineAgentsAvailable),\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-support/src/sla/assign_ticket_1", "title": "assign_ticket", "type": "Function", "description": "Assigns an incoming ticket to the online technician with the lowest active workload.", "resource": "crates/erp-support/src/sla.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn assign_ticket<'a>(\n        ticket: &mut SupportTicket,\n        agents: &'a mut [SupportAgent],\n    ) -> Result<&'a mut SupportAgent, SupportError> {\n        let least_loaded = agents\n            .iter_mut()\n            .filter(|a| a.is_online)\n            .min_by_key(|a| a.active_ticket_count);\n\n        match least_loaded {\n            Some(agent) => {\n                agent.active_ticket_count += 1;\n                ticket.assigned_to = Some(agent.agent_id.clone());\n                ticket.status = TicketStatus::Assigned;\n                Ok(agent)\n            }\n            None => Err(SupportError::NoOnlineAgentsAvailable),\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-support/src/sla/evaluate_tickets", "title": "evaluate_tickets", "type": "Function", "description": "Evaluates unresolved tickets against their SLA response deadlines and escalates breached tickets.", "resource": "crates/erp-support/src/sla.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn evaluate_tickets(\n        tickets: &mut [SupportTicket],\n        now: DateTime<Utc>,\n    ) -> Vec<SlaEscalationEvent> {\n        let mut escalations = Vec::new();\n\n        for ticket in tickets.iter_mut() {\n            if matches!(ticket.status, TicketStatus::Open | TicketStatus::Assigned) {\n                if now > ticket.response_deadline && ticket.priority != TicketPriority::Urgent {\n                    let prev = ticket.priority;\n                    ticket.priority = TicketPriority::Urgent;\n\n                    escalations.push(SlaEscalationEvent {\n                        ticket_id: ticket.id.clone(),\n                        previous_priority: prev,\n                        new_priority: TicketPriority::Urgent,\n                        breached_at: now,\n                    });\n                }\n            }\n        }\n\n        escalations\n    }", "bundle": "crates"}, {"id": "crates/erp-support/src/sla/evaluate_tickets_1", "title": "evaluate_tickets", "type": "Function", "description": "Evaluates unresolved tickets against their SLA response deadlines and escalates breached tickets.", "resource": "crates/erp-support/src/sla.rs", "tags": ["domain:erp-support", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn evaluate_tickets(\n        tickets: &mut [SupportTicket],\n        now: DateTime<Utc>,\n    ) -> Vec<SlaEscalationEvent> {\n        let mut escalations = Vec::new();\n\n        for ticket in tickets.iter_mut() {\n            if matches!(ticket.status, TicketStatus::Open | TicketStatus::Assigned) {\n                if now > ticket.response_deadline && ticket.priority != TicketPriority::Urgent {\n                    let prev = ticket.priority;\n                    ticket.priority = TicketPriority::Urgent;\n\n                    escalations.push(SlaEscalationEvent {\n                        ticket_id: ticket.id.clone(),\n                        previous_priority: prev,\n                        new_priority: TicketPriority::Urgent,\n                        breached_at: now,\n                    });\n                }\n            }\n        }\n\n        escalations\n    }", "bundle": "crates"}, {"id": "crates/erp-trade/src/landed_cost", "title": "landed_cost", "type": "Module", "description": "", "resource": "crates/erp-trade/src/landed_cost.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-trade/src/landed_cost/distribute_landed_cost", "title": "distribute_landed_cost", "type": "Function", "description": "Distributes landed cost charges across item valuation amounts proportionally.", "resource": "crates/erp-trade/src/landed_cost.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn distribute_landed_cost(item_values: &[Decimal], total_charges: Decimal) -> Vec<Decimal> {\n    let total_value: Decimal = item_values.iter().sum();\n    if total_value == Decimal::ZERO {\n        return vec![Decimal::ZERO; item_values.len()];\n    }\n\n    let mut distributed: Vec<Decimal> = item_values\n        .iter()\n        .map(|v| (v * total_charges) / total_value)\n        .collect();\n\n    let sum_distributed: Decimal = distributed.iter().sum();\n    let diff = total_charges - sum_distributed;\n\n    if let Some(last) = distributed.last_mut() {\n        *last += diff;\n    }\n\n    distributed\n}", "bundle": "crates"}, {"id": "crates/erp-trade/src/landed_cost/test_landed_cost_distribution", "title": "test_landed_cost_distribution", "type": "Function", "description": "[test]", "resource": "crates/erp-trade/src/landed_cost.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_landed_cost_distribution() {\n        let values = vec![dec!(60.0), dec!(40.0)];\n        let distributed = distribute_landed_cost(&values, dec!(100.0));\n        assert_eq!(distributed[0], dec!(60.0));\n        assert_eq!(distributed[1], dec!(40.0));\n        let total: Decimal = distributed.iter().sum();\n        assert_eq!(total, dec!(100.0));\n    }", "bundle": "crates"}, {"id": "crates/erp-trade/src/lib", "title": "lib", "type": "Module", "description": "", "resource": "crates/erp-trade/src/lib.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-trade/src/lib/test_compounding_multi_tier_taxes", "title": "test_compounding_multi_tier_taxes", "type": "Function", "description": "[test]", "resource": "crates/erp-trade/src/lib.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_compounding_multi_tier_taxes() {\n        let base_amount = dec!(100.00);\n        let tax_rows = vec![\n            // Tax 1: 10% on Net Total -> 10.00\n            TaxRow {\n                account_head: \"2210 - Output VAT 10%\".into(),\n                rate: dec!(10.0),\n                charge_type: TaxType::OnNetTotal,\n            },\n            // Tax 2: 5% Compounded on previous -> (100 + 10) * 0.05 = 5.50\n            TaxRow {\n                account_head: \"2220 - Surcharge 5%\".into(),\n                rate: dec!(5.0),\n                charge_type: TaxType::CompoundedOnPrevious,\n            },\n        ];\n\n        let result = TaxEngine::calculate_taxes(base_amount, &tax_rows);\n\n        assert_eq!(result.net_total, dec!(100.00));\n        assert_eq!(result.tax_lines.len(), 2);\n        assert_eq!(result.tax_lines[0].tax_amount, dec!(10.00));\n        assert_eq!(result.tax_lines[1].tax_amount, dec!(5.50));\n        assert_eq!(result.total_tax, dec!(15.50));\n        assert_eq!(result.grand_total, dec!(115.50));\n    }", "bundle": "crates"}, {"id": "crates/erp-trade/src/lib/test_pricing_rules_volume_breaks", "title": "test_pricing_rules_volume_breaks", "type": "Function", "description": "[test]", "resource": "crates/erp-trade/src/lib.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_pricing_rules_volume_breaks() {\n        let rules = vec![\n            PricingRule {\n                name: \"Standard Retail\".into(),\n                customer_group: None,\n                item_group: None,\n                min_qty: dec!(1.0),\n                max_qty: Some(dec!(99.0)),\n                priority: 1,\n                discount_percentage: dec!(0.0),\n                discount_amount: dec!(0.0),\n            },\n            PricingRule {\n                name: \"Wholesale Tier 1\".into(),\n                customer_group: None,\n                item_group: None,\n                min_qty: dec!(100.0),\n                max_qty: None,\n                priority: 2,\n                discount_percentage: dec!(10.0),\n                discount_amount: dec!(0.0),\n            },\n        ];\n\n        let base_rate = dec!(50.00);\n\n        // 50 units -> No discount (50.00)\n        let price_50 = PricingEngine::resolve_price(base_rate, dec!(50.0), None, None, &rules);\n        assert_eq!(price_50, dec!(50.00));\n\n        // 150 units -> 10% discount (45.00)\n        let price_150 = PricingEngine::resolve_price(base_rate, dec!(150.0), None, None, &rules);\n        assert_eq!(price_150, dec!(45.00));\n    }", "bundle": "crates"}, {"id": "crates/erp-trade/src/pricing", "title": "pricing", "type": "Module", "description": "", "resource": "crates/erp-trade/src/pricing.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-trade/src/pricing/PricingEngine", "title": "PricingEngine", "type": "Class", "description": "Dynamic Pricing Solver Engine.", "resource": "crates/erp-trade/src/pricing.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct PricingEngine;", "bundle": "crates"}, {"id": "crates/erp-trade/src/pricing/PricingRule", "title": "PricingRule", "type": "Class", "description": "Dynamic Pricing Rule definition with priority-weighted discount matrix (Milestone 2.9).", "resource": "crates/erp-trade/src/pricing.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct PricingRule {\n    /// Rule name / code.\n    pub name: String,\n    /// Target customer group (None = all).\n    pub customer_group: Option<String>,\n    /// Target item group (None = all).\n    pub item_group: Option<String>,\n    /// Minimum qualifying quantity.\n    pub min_qty: Decimal,\n    /// Maximum qualifying quantity.\n    pub max_qty: Option<Decimal>,\n    /// Priority weight (higher priority evaluated first).\n    pub priority: u32,\n    /// Percentage discount (e.g. 10.0 for 10%).\n    pub discount_percentage: Decimal,\n    /// Flat rate discount per unit.\n    pub discount_amount: Decimal,\n}", "bundle": "crates"}, {"id": "crates/erp-trade/src/pricing/resolve_price", "title": "resolve_price", "type": "Function", "description": "Resolves the applicable unit price by matching quantity and priority.", "resource": "crates/erp-trade/src/pricing.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn resolve_price(\n        base_rate: Decimal,\n        qty: Decimal,\n        customer_group: Option<&str>,\n        item_group: Option<&str>,\n        rules: &[PricingRule],\n    ) -> Decimal {\n        let mut applicable_rules: Vec<&PricingRule> = rules\n            .iter()\n            .filter(|r| {\n                if qty < r.min_qty {\n                    return false;\n                }\n                if let Some(max) = r.max_qty {\n                    if qty > max {\n                        return false;\n                    }\n                }\n                if let Some(cg) = &r.customer_group {\n                    if customer_group != Some(cg.as_str()) {\n                        return false;\n                    }\n                }\n                if let Some(ig) = &r.item_group {\n                    if item_group != Some(ig.as_str()) {\n                        return false;\n                    }\n                }\n                true\n            })\n            .collect();\n\n        // Sort by priority descending\n        applicable_rules.sort_by(|a, b| b.priority.cmp(&a.priority));\n\n        if let Some(best_rule) = applicable_rules.first() {\n            let pct_factor = Decimal::ONE - (best_rule.discount_percentage / Decimal::from(100));\n            let discounted = (base_rate * pct_factor) - best_rule.discount_amount;\n            discounted.max(Decimal::ZERO)\n        } else {\n            base_rate\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-trade/src/pricing/resolve_price_1", "title": "resolve_price", "type": "Function", "description": "Resolves the applicable unit price by matching quantity and priority.", "resource": "crates/erp-trade/src/pricing.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn resolve_price(\n        base_rate: Decimal,\n        qty: Decimal,\n        customer_group: Option<&str>,\n        item_group: Option<&str>,\n        rules: &[PricingRule],\n    ) -> Decimal {\n        let mut applicable_rules: Vec<&PricingRule> = rules\n            .iter()\n            .filter(|r| {\n                if qty < r.min_qty {\n                    return false;\n                }\n                if let Some(max) = r.max_qty {\n                    if qty > max {\n                        return false;\n                    }\n                }\n                if let Some(cg) = &r.customer_group {\n                    if customer_group != Some(cg.as_str()) {\n                        return false;\n                    }\n                }\n                if let Some(ig) = &r.item_group {\n                    if item_group != Some(ig.as_str()) {\n                        return false;\n                    }\n                }\n                true\n            })\n            .collect();\n\n        // Sort by priority descending\n        applicable_rules.sort_by(|a, b| b.priority.cmp(&a.priority));\n\n        if let Some(best_rule) = applicable_rules.first() {\n            let pct_factor = Decimal::ONE - (best_rule.discount_percentage / Decimal::from(100));\n            let discounted = (base_rate * pct_factor) - best_rule.discount_amount;\n            discounted.max(Decimal::ZERO)\n        } else {\n            base_rate\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-trade/src/taxes", "title": "taxes", "type": "Module", "description": "", "resource": "crates/erp-trade/src/taxes.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-trade/src/taxes/TaxEngine", "title": "TaxEngine", "type": "Class", "description": "Compounding Multi-Tier Tax Engine (Milestone 2.10).", "resource": "crates/erp-trade/src/taxes.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct TaxEngine;", "bundle": "crates"}, {"id": "crates/erp-trade/src/taxes/TaxLineResult", "title": "TaxLineResult", "type": "Class", "description": "Individual computed tax line output.", "resource": "crates/erp-trade/src/taxes.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct TaxLineResult {\n    /// Target tax account.\n    pub account_head: String,\n    /// Tax rate.\n    pub rate: Decimal,\n    /// Calculated tax amount.\n    pub tax_amount: Decimal,\n    /// Cumulative total including this tax line.\n    pub total: Decimal,\n}", "bundle": "crates"}, {"id": "crates/erp-trade/src/taxes/TaxRow", "title": "TaxRow", "type": "Class", "description": "Tax schedule row template.", "resource": "crates/erp-trade/src/taxes.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct TaxRow {\n    /// Account head to book tax to (e.g. \"2210 - Output VAT\").\n    pub account_head: String,\n    /// Rate in percentage (e.g. 10.0 for 10%).\n    pub rate: Decimal,\n    /// Tax calculation method.\n    pub charge_type: TaxType,\n}", "bundle": "crates"}, {"id": "crates/erp-trade/src/taxes/TaxScheduleResult", "title": "TaxScheduleResult", "type": "Class", "description": "Result of complete multi-tier tax calculation.", "resource": "crates/erp-trade/src/taxes.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct TaxScheduleResult {\n    /// Net taxable base total.\n    pub net_total: Decimal,\n    /// Total calculated taxes across all rows.\n    pub total_tax: Decimal,\n    /// Grand total (Net + Taxes).\n    pub grand_total: Decimal,\n    /// Detailed computed tax lines.\n    pub tax_lines: Vec<TaxLineResult>,\n}", "bundle": "crates"}, {"id": "crates/erp-trade/src/taxes/TaxType", "title": "TaxType", "type": "Class", "description": "Calculation method for a tax row in a multi-tier tax schedule.", "resource": "crates/erp-trade/src/taxes.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum TaxType {\n    /// Applied directly to net line total: $\\text{Tax} = \\text{Net} \\times \\frac{\\text{Rate}}{100}$\n    OnNetTotal,\n    /// Compounded on net plus specific previous tax line rows:\n    /// $\\text{Tax}_k = (\\text{Net} + \\sum_{j < k} \\text{Tax}_j) \\times \\frac{\\text{Rate}}{100}$\n    CompoundedOnPrevious,\n    /// Back-calculated from tax-inclusive net line total.\n    InclusiveInNet,\n}", "bundle": "crates"}, {"id": "crates/erp-trade/src/taxes/calculate_taxes", "title": "calculate_taxes", "type": "Function", "description": "Computes compounding multi-tier taxes across tax schedule rows.", "resource": "crates/erp-trade/src/taxes.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn calculate_taxes(base_net_amount: Decimal, tax_rows: &[TaxRow]) -> TaxScheduleResult {\n        let mut running_tax_total = Decimal::ZERO;\n        let mut tax_lines = Vec::new();\n\n        for row in tax_rows {\n            let row_tax = match row.charge_type {\n                TaxType::OnNetTotal => {\n                    base_net_amount * (row.rate / Decimal::from(100))\n                }\n                TaxType::CompoundedOnPrevious => {\n                    (base_net_amount + running_tax_total) * (row.rate / Decimal::from(100))\n                }\n                TaxType::InclusiveInNet => {\n                    // Tax = Base - (Base / (1 + Rate/100))\n                    let factor = Decimal::ONE + (row.rate / Decimal::from(100));\n                    base_net_amount - (base_net_amount / factor)\n                }\n            };\n\n            running_tax_total += row_tax;\n\n            tax_lines.push(TaxLineResult {\n                account_head: row.account_head.clone(),\n                rate: row.rate,\n                tax_amount: row_tax,\n                total: base_net_amount + running_tax_total,\n            });\n        }\n\n        TaxScheduleResult {\n            net_total: base_net_amount,\n            total_tax: running_tax_total,\n            grand_total: base_net_amount + running_tax_total,\n            tax_lines,\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-trade/src/taxes/calculate_taxes_1", "title": "calculate_taxes", "type": "Function", "description": "Computes compounding multi-tier taxes across tax schedule rows.", "resource": "crates/erp-trade/src/taxes.rs", "tags": ["domain:erp-trade", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn calculate_taxes(base_net_amount: Decimal, tax_rows: &[TaxRow]) -> TaxScheduleResult {\n        let mut running_tax_total = Decimal::ZERO;\n        let mut tax_lines = Vec::new();\n\n        for row in tax_rows {\n            let row_tax = match row.charge_type {\n                TaxType::OnNetTotal => {\n                    base_net_amount * (row.rate / Decimal::from(100))\n                }\n                TaxType::CompoundedOnPrevious => {\n                    (base_net_amount + running_tax_total) * (row.rate / Decimal::from(100))\n                }\n                TaxType::InclusiveInNet => {\n                    // Tax = Base - (Base / (1 + Rate/100))\n                    let factor = Decimal::ONE + (row.rate / Decimal::from(100));\n                    base_net_amount - (base_net_amount / factor)\n                }\n            };\n\n            running_tax_total += row_tax;\n\n            tax_lines.push(TaxLineResult {\n                account_head: row.account_head.clone(),\n                rate: row.rate,\n                tax_amount: row_tax,\n                total: base_net_amount + running_tax_total,\n            });\n        }\n\n        TaxScheduleResult {\n            net_total: base_net_amount,\n            total_tax: running_tax_total,\n            grand_total: base_net_amount + running_tax_total,\n            tax_lines,\n        }\n    }", "bundle": "crates"}, {"id": "crates/frappe-framework/src/lib", "title": "lib", "type": "Module", "description": "", "resource": "crates/frappe-framework/src/lib.rs", "tags": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-framework/src/lib/make_test_schema", "title": "make_test_schema", "type": "Function", "description": "", "resource": "crates/frappe-framework/src/lib.rs", "tags": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn make_test_schema() -> DocTypeSchema {\n        DocTypeSchema {\n            name: \"Sales Invoice\".to_string(),\n            module: \"Accounts\".to_string(),\n            is_single: false,\n            is_submittable: true,\n            track_changes: true,\n            naming_rule: Some(\"ACC-INV-.YYYY.-.#####\".to_string()),\n            fields: vec![\n                DocFieldSchema {\n                    fieldname: \"customer\".to_string(),\n                    fieldtype: FieldType::Data,\n                    label: \"Customer\".to_string(),\n                    reqd: true,\n                    unique: false,\n                    read_only: false,\n                    hidden: false,\n                    in_list_view: true,\n                    options: None,\n                    default_value: None,\n                },\n                DocFieldSchema {\n                    fieldname: \"grand_total\".to_string(),\n                    fieldtype: FieldType::Currency,\n                    label: \"Grand Total\".to_string(),\n                    reqd: true,\n                    unique: false,\n                    read_only: false,\n                    hidden: false,\n                    in_list_view: true,\n                    options: None,\n                    default_value: Some(serde_json::json!(0.0)),\n                },\n            ],\n            permissions: vec![DocPermSchema {\n                role: \"Accounts User\".to_string(),\n                read: true,\n                write: true,\n                create: true,\n                delete: false,\n                submit: true,\n                cancel: true,\n                amend: true,\n                report: true,\n                export: true,\n                permlevel: 0,\n            }],\n        }\n    }", "bundle": "crates"}, {"id": "crates/frappe-framework/src/lib/test_document_lifecycle_state_machine", "title": "test_document_lifecycle_state_machine", "type": "Function", "description": "[test]", "resource": "crates/frappe-framework/src/lib.rs", "tags": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_document_lifecycle_state_machine() {\n        let controller = DocumentController::new();\n        let schema = make_test_schema();\n\n        let mut doc = Document::new(\n            \"Sales Invoice\",\n            serde_json::json!({\n                \"customer\": \"Acme Corp\",\n                \"grand_total\": 500.00\n            }),\n        );\n\n        // 1. Insert -> Draft\n        controller\n            .insert(&mut doc, &schema, None, 2026, 42)\n            .expect(\"Insert failed\");\n        assert_eq!(doc.name, \"ACC-INV-2026-00042\");\n        assert_eq!(doc.docstatus, 0);\n        assert!(doc.is_draft());\n\n        // 2. Submit -> Submitted\n        controller\n            .submit(&mut doc, &schema, None)\n            .expect(\"Submit failed\");\n        assert_eq!(doc.docstatus, 1);\n        assert!(doc.is_submitted());\n\n        // 3. Edit submitted document -> Rejected\n        let update_res = controller.update(\n            &mut doc,\n            &schema,\n            serde_json::json!({ \"grand_total\": 600.00 }),\n            None,\n        );\n        assert_eq!(\n            update_res,\n            Err(DocumentError::CannotEditSubmittedDocument)\n        );\n\n        // 4. Cancel -> Cancelled\n        controller\n            .cancel(&mut doc, &schema, None)\n            .expect(\"Cancel failed\");\n        assert_eq!(doc.docstatus, 2);\n        assert!(doc.is_cancelled());\n    }", "bundle": "crates"}, {"id": "crates/frappe-framework/src/lib/test_rhai_operation_limit_exceeded", "title": "test_rhai_operation_limit_exceeded", "type": "Function", "description": "[test]", "resource": "crates/frappe-framework/src/lib.rs", "tags": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_rhai_operation_limit_exceeded() {\n        let engine = RhaiHookEngine::new();\n        let infinite_loop_script = \"let i = 0; while true { i += 1; }\";\n        let mut doc = serde_json::json!({ \"value\": 10 });\n\n        let res = engine.dispatch_hook(\n            LifecycleEvent::Validate,\n            &mut doc,\n            infinite_loop_script,\n        );\n\n        assert_eq!(res, Err(ScriptError::OperationLimitExceeded));\n    }", "bundle": "crates"}, {"id": "crates/frappe-framework/src/lifecycle", "title": "lifecycle", "type": "Module", "description": "", "resource": "crates/frappe-framework/src/lifecycle.rs", "tags": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-framework/src/lifecycle/Document", "title": "Document", "type": "Class", "description": "In-memory representation of a Frappe document instance.", "resource": "crates/frappe-framework/src/lifecycle.rs", "tags": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct Document {\n    /// Primary key identifier (e.g. \"ACC-INV-202 itn(2, ':');\n                    let code = parts.next().unwrap_or(\"ERR\").trim().to_string();\n                    let msg = parts.next().unwrap_or(&err_str).trim().to_string();\n                    Err(ScriptError::ThrownError(code, msg))\n                } else {\n                    Err(ScriptError::ExecutionFailed(err_str))\n                }\n            }\n        }\n    }", "bundle": "crates"}, {"id": "crates/frappe-framework/src/scripting/new", "title": "new", "type": "Function", "description": "Creates a hardened, sandboxed Rhai script engine.", "resource": "crates/frappe-framework/src/scripting.rs", "tags": ["domain:frappe-framework", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new() -> Self {\n        let mut engine = Engine::new();\n\n        // Architectural constraints from Milestone 1.5\n        engine.set_max_operations(50_000);\n        engine.set_max_call_levels(16);\n        engine.set_max_string_size(64_000);\n        engine.set_max_array_size(10_000);\n\n        // Register logging functions\n        engine.register_fn(\"log_info\", |msg: &str| {\n            tracing::info!(target: \"rhai_script\", \"{}\", msg);\n        });\n        engine.register_fn(\"log_warn\", |msg: &str| {\n            tracing::warn!(target: \"rhai_script\", \"{}\", msg);\n        });\n        engine.register_fn(\"log_error\", |msg: &str| {\n            tracing::error!(target: \"rhai_script\", \"{}\", msg);\n        });\n\n        // Register explicit throw function\n        engine.register_fn(\"throw_error\", |code: &str, msg: &str| -> Result<(), Box<EvalAltResult>> {\n            Err(format!(\"{code}:{msg}\").into())\n        });\n\n        Self { engine }\n    }", "bundle": "crates"}, {"id": "crates/frappe-framework/src/scripting/new_1", "title": "new", "type": "Function", "description": "Creates a hardened, sandboxed Rhai script engine.", "resource": "crates/frappe-framework/src/scripting.rs", "tag
