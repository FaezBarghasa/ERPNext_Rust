<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKF Bundle — Knowledge Visualization</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◇</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#0a0a0f; --surface:#131319; --surface-2:#191922; --surface-3:#1f1f2b;
  --border:#26262f; --border-strong:#34343f;
  --text:#f2f2f5; --text-2:#a3a3b5; --text-3:#6f6f82;
  --accent:#7c6cff; --accent-strong:#9385ff; --accent-soft:rgba(124,108,255,.14);
  --danger:#f87171; --danger-soft:rgba(248,113,113,.12);
  --success:#4ade80; --warning:#fbbf24;
  --brand-400:#a855f7; --brand-500:#8b5cf6; --brand-600:#7c3aed; --brand-800:#5b21b6; --brand-900:#4c1d95;
  --t-class:#a78bfa; --t-function:#38bdf8; --t-module:#fbbf24; --t-dependency:#4ade80;
  --t-table:#fb7185; --t-view:#fb923c; --t-index:#f472b6; --t-method:#c084fc;
  --t-interface:#22d3ee; --t-type:#818cf8; --t-trigger:#f43f5e;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:18px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 8px 32px rgba(0,0,0,.35);
  --shadow-glow:0 0 0 1px var(--border), 0 8px 24px rgba(0,0,0,.35);
  --ease:cubic-bezier(.2,.8,.2,1);

  /* Ambient glow for dark theme */
  --bg-image: none;
}

html[data-theme="light"] {
  --bg:#f7f7fb; --surface:#ffffff; --surface-2:#f4f4f9; --surface-3:#ececf4;
  --border:#e3e3ec; --border-strong:#d3d3e0;
  --text:#131320; --text-2:#5c5c72; --text-3:#8a8aa0;
  --accent:#6d5efc; --accent-strong:#5847e8; --accent-soft:rgba(109,94,252,.10);
  --danger:#dc2626; --danger-soft:rgba(220,38,38,.08);
  --success:#22c55e; --warning:#d97706;
  --brand-400:#a855f7; --brand-500:#8b5cf6; --brand-600:#7c3aed; --brand-800:#5b21b6; --brand-900:#4c1d95;
  --shadow-sm:0 1px 2px rgba(20,20,40,.06);
  --shadow-md:0 8px 24px rgba(20,20,40,.08);
  --shadow-lg:0 8px 32px rgba(20,20,40,.08);
  --shadow-glow:0 0 0 1px var(--border), 0 8px 24px rgba(20,20,40,.08);

  --bg-image: none;
}
html[data-theme="light"] .stat-card {
  background:rgba(255,255,255,.15); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(0,0,0,.08);
}
html[data-theme="light"] .stat-card::after {
  box-shadow:inset 0 1px 1px rgba(255,255,255,1);
}
html[data-theme="light"] .stat-card:hover {
  background:rgba(255,255,255,.9); border-color:rgba(0,0,0,.1);
  box-shadow:0 12px 32px rgba(20,20,40,.1), 0 0 0 1px var(--accent-soft);
}
html[data-theme="light"] .sec pre { background:rgba(0,0,0,.02); }
html[data-theme="light"] .chip { background:rgba(0,0,0,.03); border-color:rgba(0,0,0,.08); }

body {
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--text); height:100vh; overflow:hidden;
  font-size:14px; line-height:1.5;

  background-color:var(--bg);
  background-image:var(--bg-image);
  background-size:cover;

  transition:background-color .18s var(--ease), color .18s var(--ease);
}


code, pre, .mono { font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; }
::selection { background:var(--accent); color:#fff; }
:focus-visible { outline:2px solid var(--accent-strong); outline-offset:2px; border-radius:4px; }
a { color:inherit; }
button, select, input { font:inherit; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:99px; border:2px solid var(--bg); }
::-webkit-scrollbar-track { background:transparent; }

#topbar {
  height:60px; display:flex; align-items:center; justify-content:center;
  position:sticky; top:0; z-index:50; padding:0;
}
#topbar-inner {
  width:92%; max-width:1200px; height:46px;
  display:flex; align-items:center; gap:var(--sp-4); padding:0 16px;
  border-radius:16px;
  background:rgba(255,255,255,.08); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 4px 32px rgba(0,0,0,.3), 0 1px 4px rgba(0,0,0,.15);
  position:relative;
}

html[data-theme="light"] #topbar-inner {
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-color:rgba(0,0,0,.08);
  box-shadow:0 4px 32px rgba(20,20,40,.08), 0 1px 4px rgba(20,20,40,.04);
}
.nav-seg {
  display:flex; border-radius:10px; background:rgba(255,255,255,.06); padding:3px; gap:2px;
}
html[data-theme="light"] .nav-seg { background:rgba(0,0,0,.04); }
.nav-seg-item {
  font-size:13px; font-weight:500; color:var(--text-3); padding:4px 18px;
  border-radius:8px; cursor:pointer; transition:all .2s var(--ease); user-select:none;
  background:transparent; border:none; font-family:inherit;
}
.nav-seg-item:hover { color:var(--text-2); }
.nav-seg-item.active {
  color:var(--text); background:var(--surface);
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
#brand { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.nav-logo-icon { display:flex; align-items:center; justify-content:center; width:30px; height:30px; flex-shrink:0; }
#brand-text .name { font-weight:700; font-size:15px; color:var(--text); white-space:nowrap; }
#topbar-spacer { flex:1; }

#breadcrumb {
  display:flex; align-items:center; gap:6px; padding:var(--sp-3) var(--sp-4);
  margin-bottom:var(--sp-3); margin-top:0;
  background:rgba(255,255,255,.04); border-radius:var(--r-md);
  border:1px solid rgba(255,255,255,.06); font-size:12px;
  position:sticky; top:0; z-index:10;
}
html[data-theme="light"] #breadcrumb {
  background:rgba(0,0,0,.03);
  border-color:rgba(0,0,0,.06);
}
#breadcrumb .crumb {
  cursor:pointer; color:var(--text-3); padding:2px 8px; border-radius:var(--r-sm);
  transition:all .15s var(--ease); font-weight:500;
}
#breadcrumb .crumb:hover { color:var(--accent-strong); background:var(--accent-soft); }
#breadcrumb .sep { color:var(--border-strong); font-size:10px; user-select:none; }
#breadcrumb .current { color:var(--text); background:var(--surface); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.06); }
.icon-btn {
  width:34px; height:34px; border-radius:var(--r-sm); background:transparent; border:1px solid transparent;
  color:var(--text-2); display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
}
.icon-btn:hover { background:var(--surface-2); color:var(--text); border-color:var(--border); }
.icon-btn svg { width:17px; height:17px; }

#layout { display:flex; height:calc(100vh - 60px); }

#sidebar {
  width:300px; border-radius:var(--r-xl);
  display:flex; flex-direction:column; flex:none; overflow:hidden;
  margin:var(--sp-3) 0 var(--sp-3) var(--sp-3);
  background:rgba(19,19,25,.72); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:var(--shadow-md);
  position:relative;
}

html[data-theme="light"] #sidebar {
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-color:rgba(0,0,0,.08);
}
#main { flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
#main.wide { padding:0; }
#browse-layout { display:flex; flex:1; min-height:0; padding:var(--sp-4); gap:0; }
#browse-content {
  flex:1; display:flex; flex-direction:column; min-height:0; overflow:auto;
  padding:var(--sp-4); margin:var(--sp-3) var(--sp-3) var(--sp-3) 0;
  background:rgba(19,19,25,.6); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.06); border-radius:var(--r-xl);
  box-shadow:var(--shadow-md);
}
html[data-theme="light"] #browse-content {
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-color:rgba(0,0,0,.08);
}
#sidebar-resize {
  width:4px; cursor:col-resize; background:var(--border); flex:none;
  transition:background .12s var(--ease); position:relative; z-index:10;
  margin:100px 0;
  border-radius:4px; background-clip:content-box;
  background:linear-gradient(to bottom, transparent 0, var(--border) 20%, var(--border) 80%, transparent 100%);
}
#sidebar-resize:hover, #sidebar-resize.active { background:var(--accent); background-clip:content-box; }
.field-wrap { padding:var(--sp-3) var(--sp-3) 0; }
.search-box { position:relative; }
.search-box svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-3); pointer-events:none; }
#search {
  width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-sm);
  padding:8px 10px 8px 30px; color:var(--text); font-size:13px; outline:none;
  transition:border-color .15s var(--ease), background .15s var(--ease);
}
#search:focus { border-color:var(--accent); background:var(--surface); }
#search-no-results code { font-size:12px; }
#search::placeholder { color:var(--text-3); }
.filter-row { display:flex; flex-direction:column; gap:4px; margin-top:var(--sp-2); }
.filter-row select {
  width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-sm);
  color:var(--text-2); padding:6px 8px; font-size:12px; outline:none; cursor:pointer;
}
.filter-row select:focus { border-color:var(--accent); }
.filter-row select option { background:var(--surface); }



#tree { flex:1; overflow-y:auto; padding:var(--sp-2) var(--sp-2) var(--sp-2); margin-top:var(--sp-2); }
.tree-folder { user-select:none; }
.tree-folder-label {
  display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:var(--r-sm); cursor:pointer;
  font-size:12.5px; font-weight:500; color:var(--text-2); transition:background .12s var(--ease);
}
.tree-folder-label:hover { background:var(--surface-2); color:var(--text); }
.tree-folder-label .caret { width:10px; height:10px; flex:none; transition:transform .15s var(--ease); color:var(--text-3); }
.tree-folder.collapsed > .tree-folder-children { display:none; }
.tree-folder.collapsed > .tree-folder-label .caret { transform:rotate(-90deg); }
.tree-folder-children { padding-left:12px; border-left:1px solid var(--border); margin-left:13px; }
.tree-leaf {
  display:flex; align-items:center; gap:9px; padding:6px 8px 6px 11px; border-radius:var(--r-sm); cursor:pointer;
  font-size:13px; color:var(--text); position:relative; transition:background .12s var(--ease);
}
.tree-leaf:hover { background:var(--surface-2); }
.tree-leaf.active { background:var(--accent-soft); color:var(--accent-strong); font-weight:600; }
.tree-leaf.active::before { content:''; position:absolute; left:-13px; top:0; bottom:0; width:2px; background:var(--accent); border-radius:2px; }
.tree-leaf .dot { width:7px; height:7px; border-radius:50%; flex:none; }
.tree-leaf .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hidden { display:none !important; }
.visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

#main.wide { padding:0; }
.tab-content { display:none; min-height:0; }
#tab-browse.active { display:flex; flex-direction:column; flex:1; overflow:hidden; }
#tab-graph.active { display:flex; flex-direction:column; flex:1; overflow:hidden; }
.fade-in { animation:fadeIn .18s var(--ease); }
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

.tab-content { display:none; }
.tab-content.active { display:block; }

.eyebrow { font-size:11px; font-weight:600; color:var(--accent-strong); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
#landing h1 { font-size:24px; font-weight:700; letter-spacing:-.02em; margin-bottom:8px; }
#landing p.sub { color:var(--text-2); font-size:14px; margin-bottom:var(--sp-6); }
.stat-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:var(--sp-4); margin-bottom:var(--sp-6);
}
.stat-card {
  background:rgba(19,19,25,.6); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.06); border-radius:var(--r-lg);
  padding:var(--sp-5); position:relative;
  transition:all .2s var(--ease);
}
.stat-card::after {
  content:''; position:absolute; inset:0; border-radius:inherit;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.08);
  pointer-events:none;
}
.stat-card:hover {
  border-color:rgba(255,255,255,.12);
  background:rgba(25,25,34,.7);
  box-shadow:0 0 0 1px var(--accent-soft);
}
.stat-card .n { font-size:24px; font-weight:700; letter-spacing:-.03em; }
.stat-card .l { font-size:11px; color:var(--text-3); margin-top:3px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
#landing .domains { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-2); align-items:start; }
#landing .domains { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-2) var(--sp-5); align-items:start; max-height:300px; overflow-y:auto; }
#landing { padding-bottom:100px; }
#landing .domains h3 { font-size:12px; color:var(--text-3); margin-bottom:var(--sp-3); text-transform:uppercase; letter-spacing:.06em; font-weight:600; grid-column:1/-1; }
.domain-row {
  display:flex; align-items:center; padding:8px 12px; border-radius:var(--r-sm); cursor:pointer;
  transition:background .12s var(--ease), border-color .12s var(--ease); border:1px solid transparent;
}
.domain-row:hover { background:var(--surface); border-color:var(--border); }
.domain-row .name { font-size:13px; font-weight:500; }
.domain-row .count { font-size:12px; color:var(--text-3); }
.domain-row .bar-wrap { flex:1; margin:0 var(--sp-4); height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
.domain-row .bar { height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-strong)); border-radius:99px; }

#detail { max-width:1360px; display:flex; flex-direction:column; flex:1; min-height:0; }
.detail-tab-content { display:none; flex:1; min-height:0; overflow:auto; }
.detail-tab-content.active { display:flex; flex-direction:column; }
#detail-header {
  position:sticky; top:0; z-index:9;
  padding:var(--sp-5) var(--sp-5) var(--sp-4);
  margin:calc(-1 * var(--sp-4)) calc(-1 * var(--sp-4)) var(--sp-3);
  border-bottom:1px solid rgba(255,255,255,.06);
  position:relative;
}
html[data-theme="light"] #detail-header {
  border-bottom-color:rgba(0,0,0,.06);
}
#detail-header.hidden { display:none; }
#detail-topbar { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); flex-wrap:wrap; min-height:28px; }
#detail-topbar + #detail-topbar { margin-top:2px; }
#detail-topbar-left { display:flex; flex-direction:column; align-items:flex-start; }
#detail-topbar-right { display:flex; align-items:center; gap:var(--sp-2); flex-shrink:0; }
#detail-topbar .resource { font-size:11px; color:var(--text-3); }
.vs-btn {
  display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:99px; font-size:10.5px; font-weight:700;
  border:1px solid var(--border); cursor:pointer; color:var(--accent-strong); background:var(--accent-soft);
  transition:background .12s var(--ease), border-color .12s var(--ease);
}
.vs-btn:hover { background:var(--accent-strong); color:#fff; border-color:var(--accent-strong); }
#detail .desc { color:var(--text-2); font-size:14px; margin:var(--sp-2) 0 0; max-width:760px; }
.type-badge {
  display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:99px; font-size:11px; font-weight:700;
  text-transform:uppercase; letter-spacing:.04em; margin-bottom:var(--sp-3);
}
.type-badge .dot { width:6px; height:6px; border-radius:50%; }
#detail h2 { font-size:24px; font-weight:700; letter-spacing:-.02em; margin-bottom:6px; }
#detail p.desc { color:var(--text-2); font-size:14.5px; margin:6px 0; max-width:760px; }
#detail p.resource {
  font-size:12px; color:var(--text-3); margin-top:var(--sp-2); display:inline-flex; align-items:center; gap:6px;
  background:var(--surface-2); border:1px solid var(--border); padding:4px 10px; border-radius:var(--r-sm);
}
#detail-meta { display:flex; flex-wrap:wrap; gap:6px; margin:var(--sp-3) 0 var(--sp-5); }
.meta-tag {
  display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:99px;
  font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;
  background:var(--surface-2); border:1px solid var(--border); color:var(--text-2);
}
.meta-tag .label { color:var(--text-3); font-weight:400; text-transform:none; }
.meta-tag-vis { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); }

/* ---- Cosmos Explore Tab ---- */
#graph-main { display:flex; flex:1; min-height:0; gap:var(--sp-3); padding:var(--sp-3); }
#cosmos-stage { position:relative; flex:0 0 70%; border-radius:var(--r-xl); overflow:hidden; background:var(--bg); border:1px solid rgba(255,255,255,.07); }
#cosmos-canvas { position:absolute; inset:0; z-index:9; pointer-events:none; width:100%; height:100%; }
#cluster-labels { position:absolute; inset:0; z-index:15; pointer-events:none; }
#graph-sidebar { flex:0 0 calc(30% - var(--sp-3)); display:flex; flex-direction:column; background:rgba(19,19,25,.72); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,.07); border-radius:var(--r-xl); box-shadow:var(--shadow-md); overflow:hidden; }
html[data-theme="light"] #graph-sidebar { background:rgba(255,255,255,.1); border-color:rgba(0,0,0,.08); }
#gs-header { display:flex; flex-direction:column; justify-content:start; padding:var(--sp-4) var(--sp-4) var(--sp-3); border-bottom:1px solid var(--border); flex:0 0 auto; gap:var(--sp-1); }
#gs-header .top { display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap; }
#gs-title { font-size:13px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#gs-tabs { display:flex; flex:0 0 auto; border-bottom:1px solid var(--border); padding:0 var(--sp-2); gap:0; }
.gs-tab { flex:1; background:transparent; border:none; color:var(--text-3); font-size:12px; font-weight:600; padding:var(--sp-2) var(--sp-2); cursor:pointer; transition:all .12s var(--ease); font-family:inherit; border-bottom:2px solid transparent; }
.gs-tab:hover { color:var(--text-2); }
.gs-tab.active { color:var(--accent-strong); border-bottom-color:var(--accent); }
#gs-body { flex:1; min-height:0; overflow:auto; }
.gs-pane { display:none; padding:var(--sp-4); }
.gs-pane.active { display:block; }
.gs-pane .gs-section { margin-bottom:var(--sp-3); padding-bottom:var(--sp-3); border-bottom:1px solid var(--border); }
.gs-pane .gs-section:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }
.gs-pane .gs-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3); margin-bottom:var(--sp-2); }
.gs-pane .gs-desc { font-size:13px; color:var(--text-2); line-height:1.6; }
.gs-pane .gs-meta { display:flex; flex-wrap:wrap; gap:4px; }
.gs-pane .gs-tag { font-size:10px; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-2); }

}

#cosmos-search::placeholder { color:var(--text-3); }

.dropdown-btn {
  background:transparent; border:1px solid transparent; color:var(--text-2); border-radius:6px;
  padding:5px 10px; font-size:12px; font-weight:500; cursor:pointer; font-family:inherit;
  display:flex; align-items:center; gap:6px; white-space:nowrap; transition:all .15s var(--ease);
}
.dropdown-btn:hover { background:var(--surface-2); }
.dropdown-btn.active { background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent); }
.dropdown-btn .badge { background:var(--accent); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:99px; }
.dropdown-wrapper { position:relative; }
.dropdown-menu {
  position:absolute; top:calc(100% + 6px); left:0; z-index:100; min-width:180px; max-height:300px;
  background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg); overflow:hidden; display:none; flex-direction:column;
}
.dropdown-menu.open { display:flex; }
.dropdown-list { max-height:260px; overflow-y:auto; padding:6px; display:flex; flex-direction:column; gap:2px; }

.dropdown-item {
  display:flex; align-items:center; justify-content:space-between; padding:6px 10px; border-radius:6px;
  color:var(--text); font-size:12px; cursor:pointer; transition:background .1s; user-select:none;

.item-left { display:flex; align-items:center; gap:8px; }
.item-cb {
  width:14px; height:14px; border-radius:4px; border:2px solid var(--border-strong); flex:none;
  display:flex; align-items:center; justify-content:center; transition:all .12s var(--ease);
}
.dropdown-item.on .item-cb { background:var(--accent); border-color:var(--accent); }
.dropdown-item.on .item-cb::after { content:'✓'; color:#fff; font-size:9px; font-weight:700; }
.item-count { font-size:10px; color:var(--text-3); background:var(--surface-2); padding:1px 6px; border-radius:99px; font-weight:600; }
.dropdown-item .dot { width:7px; height:7px; border-radius:50%; flex:none; }

.toolbar-sep { width:1px; align-self:stretch; background:var(--border); margin:2px 0; flex:0 0 auto; }
#status-pill {
  position:absolute; top:16px; left:16px; z-index:20; font-size:11px; color:var(--text-3);
  background:rgba(19,19,25,.72); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08); border-radius:99px; padding:7px 12px; box-shadow:var(--shadow-md);
}

#hover-tag {
  position:absolute; z-index:25; pointer-events:none; font-size:11.5px; font-weight:600;

  padding:5px 10px; border-radius:8px; box-shadow:var(--shadow-md);
  opacity:0; transition:opacity .1s; transform:translate(-50%,-130%);
}
#hover-tag.show { opacity:1; }
#hover-tag .type { color:var(--text-3); font-weight:500; margin-left:5px; }
#cosmos-legend {
  position:absolute; bottom:16px; left:16px; z-index:20; border-radius:12px;
  background:rgba(19,19,25,.72); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08); box-shadow:var(--shadow-md); overflow:hidden;
}
html[data-theme="light"] #cosmos-legend { background:rgba(255,255,255,.75); border-color:rgba(0,0,0,.08); }
#cosmos-legend-head { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 12px; cursor:pointer; }
#cosmos-legend-head span.t { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3); }
#cosmos-legend-head svg { width:12px; height:12px; color:var(--text-3); transition:transform .15s var(--ease); }
#cosmos-legend.collapsed #cosmos-legend-body { display:none; }
#cosmos-legend.collapsed #cosmos-legend-body { display:none; }

#cosmos-legend-body { padding:0 12px 12px; display:flex; flex-direction:column; gap:4px; }
.legend-item { display:flex; align-items:center; gap:8px; padding:3px 6px; border-radius:6px; font-size:11px; font-weight:500; color:var(--text-2); }
.legend-item .dot { width:8px; height:8px; border-radius:50%; flex:none; }
.legend-item .count { color:var(--text-3); margin-left:auto; font-size:10px; font-weight:600; }
#zoomctl {
  position:absolute; bottom:16px; right:16px; z-index:20; display:flex; flex-direction:column; gap:2px;
  border-radius:12px; background:rgba(19,19,25,.72); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08); box-shadow:var(--shadow-md); overflow:hidden;
}
html[data-theme="light"] #zoomctl { background:rgba(255,255,255,.75); border-color:rgba(0,0,0,.08); }
#zoomctl button {

  display:flex; align-items:center; justify-content:center; transition:background .12s var(--ease),color .12s var(--ease);
}
#zoomctl button:hover { background:var(--surface-2); color:var(--text); }
#zoomctl button:not(:last-child) { border-bottom:1px solid var(--border); }
#zoomctl svg { width:16px; height:16px; }
.detail-btn:hover { background:var(--accent); color:#fff; }
.detail-btn svg { width:13px; height:13px; }

/* ---- Parse Tree ---- */
#code-split-parse .parse-node {
  padding:2px 0 2px 20px; cursor:default; white-space:nowrap;
  border-left:1px solid var(--border); margin-left:10px;
}
.parse-node.root { margin-left:0; border-left:none; padding-left:0; }
.parse-node .node-toggle {

  color:var(--text-3); font-size:10px; margin-left:-18px;
}
.parse-node .node-type { color:var(--accent-strong); font-weight:500; }
.parse-node .node-text { color:var(--text-2); }
.parse-node .node-text.str { color:#fbbf24; }
.parse-node .node-text.num { color:#fb923c; }
.parse-node .node-text.kw { color:#f472b6; font-weight:500; }
.parse-node .node-text.id { color:#38bdf8; }
.parse-node.collapsed > .parse-children { display:none; }
.parse-node.collapsed > .node-toggle { transform:rotate(0deg); }
.parse-node:not(.collapsed) > .node-toggle { transform:rotate(90deg); }
.parse-node .parse-range { font-size:10px; color:var(--text-3); margin-left:6px; }
.close-btn {
  width:30px; height:30px; border-radius:var(--r-sm); background:transparent; border:1px solid transparent;

html[data-theme="light"] .token.punctuation,

#detail-tab-bar { display:flex; gap:0; margin:0 0 var(--sp-4); padding:var(--sp-1); background:rgba(255,255,255,.04); border-radius:var(--r-md); border:1px solid rgba(255,255,255,.06); width:fit-content; }

.detail-tab {

#code-split { display:flex; min-height:400px; flex:1; gap:0; border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; }
#code-split-source { flex:1; overflow:auto; padding:var(--sp-4); background:var(--surface); }

#code-split-divider { width:4px; cursor:col-resize; background:var(--border); flex:none; }
#code-split-divider:hover { background:var(--accent); }
#code-split-parse { flex:1; overflow:auto; padding:var(--sp-4); }
.code-placeholder { color:var(--text-3); font-size:13px; text-align:center; padding:var(--sp-8); }

.sec {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  margin-bottom:var(--sp-4); margin-top:var(--sp-4); overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.15);

}
.sec::before { display:none; }
.sec:hover { border-color:var(--border-strong); }
.sec h3 {

  background:transparent; margin:0;
}
.sec pre {

.param-row { display:flex; font-size:12.5px; padding:4px 0; border-bottom:1px solid var(--border); }

.param-default { color:var(--text-3); margin-left:auto; font-size:11px; }
.returns-val { font-size:13px; color:var(--text-2); padding:var(--sp-3); }
.chip-list { display:flex; flex-wrap:wrap; gap:6px; }
.chip {
  display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:var(--r-md);
  font-size:12px; font-family:'JetBrains Mono',ui-monospace,monospace;

}

.chip .dot { width:6px; height:6px; border-radius:50%; flex:none; }
.markdown-body { font-size:13.5px; color:var(--text-2); }

#ego-graph { height:280px; width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md); }

.loading { display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-muted); font-size:13px; gap:8px; color:var(--text-3); }
.spinner { width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.6s linear infinite; }

@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
</style>

"}, {"id": "crates/erp-accounting/src/assets/test_depreciation_zero_loss", "title": "test_depreciation_zero_loss", "type": "Function", "description": "[test]", "resource": "crates/erp-accounting/src/assets.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_depreciation_zero_loss() {\n        let schedule = straight_line_depreciation(dec!(1000.00), dec!(100.00), 3);\n        assert_eq!(schedule.len(), 3);\n        let total: Decimal = schedule.iter().sum();\n        assert_eq!(total, dec!(900.00));\n    }", "bundle": "crates"}, {"id": "crates/erp-accounting/src/coa", "title": "coa", "type": "Module", "description": "", "resource": "crates/erp-accounting/src/coa.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-accounting/src/coa/Account", "title": "Account", "type": "Class", "description": "Chart of Accounts node record.", "resource": "crates/erp-accounting/src/coa.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct Account {\n    /// Unique account name / path (e.g. \"1110 - Bank Account - ACME\").\n    pub name: String,\n    /// Standard account number code.\n    pub account_number: Option<String>,\n    /// Parent group account name in tree.\n    pub parent_account: Option<String>,\n    /// Is this account a non-posting group folder?\n    pub is_group: bool,\n    /// Root GAAP classification.\n    pub root_type: RootType,\n    /// Currency code (e.g. \"USD\", \"EUR\", \"IRR\").\n    pub account_currency: String,\n}", "bundle": "crates"}, {"id": "crates/erp-accounting/src/coa/RootType", "title": "RootType", "type": "Class", "description": "Root account classification according to standard GAAP/IFRS.", "resource": "crates/erp-accounting/src/coa. dit:d(\"0\")},DecLine{account:\"b\".into(),debit:d(\"0\"),credit:d(\"100.10\")}];\n        assert!(verify_balanced_dec(&l));\n    }", "bundle": "crates"}, {"id": "crates/erp-accounting/src/decimal_ledger/no_float_drift", "title": "no_float_drift", "type": "Function", "description": "[test]", "resource": "crates/erp-accounting/src/decimal_ledger.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    #[test] fn no_float_drift() {\n        // 0.1 + 0.2 == 0.3 exactly in Decimal, unlike f64\n        let d = |s: &str| Decimal::from_str(s).unwrap();\n        assert_eq!(d(\"0.1\") + d(\"0.2\"), d(\"0.3\"));\n    }", "bundle": "crates"}, {"id": "crates/erp-accounting/src/decimal_ledger/straight_line_dec", "title": "straight_line_dec", "type": "Function", "description": "Straight-line depreciation in Decimal.", "resource": "crates/erp-accounting/src/decimal_ledger.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn straight_line_dec(cost: Decimal, salvage: Decimal, n: usize) -> Vec<Decimal> {\n    if n == 0 { return vec![]; }\n    let per = (cost - salvage) / Decimal::from(n);\n    let mut v = vec![per; n];\n    let diff = (cost - salvage) - per * Decimal::from(n);\n    if let Some(l) = v.last_mut() { *l += diff; } v\n}", "bundle": "crates"}, {"id": "crates/erp-accounting/src/decimal_ledger/verify_balanced_dec", "title": "verify_balanced_dec", "type": "Function", "description": "[derive(Debug, Clone)] pub struct DecLine { pub account: String, pub debit: Decimal, pub credit: Decimal }", "resource": "crates/erp-accounting/src/decimal_ledger.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn verify_balanced_dec(lines: &[DecLine]) -> bool {\n    lines.iter().fold(Decimal::ZERO, |a, l| a + l.debit - l.credit) == Decimal::ZERO\n}", "bundle": "crates"}, {"id": "crates/erp-accounting/src/ledger", "title": "ledger", "type": "Module", "description": "", "resource": "crates/erp-accounting/src/ledger.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-accounting/src/ledger/AccountingError", "title": "AccountingError", "type": "Class", "description": "Accounting domain errors.", "resource": "crates/erp-accounting/src/ledger.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum AccountingError {\n    /// Transaction debits and credits do not balance to zero.\n    #[error(\"Unbalanced transaction: Total Debit ({total_debit}) != Total Credit ({total_credit})\")]\n    UnbalancedTransaction {\n        total_debit: Decimal,\n        total_credit: Decimal,\n    },\n    /// Attempted to post into a closed fiscal period.\n    #[error(\"Cannot post to closed period on or before {0}\")]\n    PeriodClosed(NaiveDate),\n    /// Account not found.\n    #[error(\"Account not found: {0}\")]\n    AccountNotFound(String),\n    /// Customer credit limit exceeded.\n    #[error(\"Credit limit exceeded: Outstanding ({current}) + New ({new_amount}) > Limit ({limit})\")]\n    CreditLimitExceeded {\n        current: Decimal,\n        new_amount: Decimal,\n        limit: Decimal,\n    },\n    /// Invalid exchange rate.\n    #[error(\"Exchange rate must be positive, got {0}\")]\n    InvalidExchangeRate(Decimal),\n}", "bundle": "crates"}, {"id": "crates/erp-accounting/src/ledger/GlEntry", "title": "GlEntry", "type": "Class", "description": "Immutable General Ledger Entry row.", "resource": "crates/erp-accounting/src/ledger.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct GlEntry {\n    //    pub debit_in_account_currency: Decimal,\n    /// Credit amount in account original currency.\n    pub credit_in_account_currency: Decimal,\n    /// Exchange rate relative to company base currency.\n    pub exchange_rate: Decimal,\n    /// Associated party type (e.g. \"Customer\", \"Supplier\").\n    pub party_type: Option<String>,\n    /// Associated party identifier (e.g. \"CUST-0001\").\n    pub party: Option<String>,\n}", "bundle": "crates"}, {"id": "crates/erp-accounting/src/ledger/LedgerPostingEngine", "title": "LedgerPostingEngine", "type": "Class", "description": "Atomic Ledger Posting Pipeline.", "resource": "crates/erp-accounting/src/ledger.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct LedgerPostingEngine {\n    closing_logs: Vec<PeriodClosingLog>,\n    accounts: HashMap<String, Account>,\n}", "bundle": "crates"}, {"id": "crates/erp-accounting/src/ledger/PeriodClosingLog", "title": "PeriodClosingLog", "type": "Class", "description": "Period closing record sealing fiscal transactions.", "resource": "crates/erp-accounting/src/ledger.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct PeriodClosingLog {\n    /// Company name.\n    pub company: String,\n    /// Fiscal period closing date (all postings on or prior are locked).\n    pub closing_date: NaiveDate,\n}", "bundle": "crates"}, {"id": "crates/erp-accounting/src/ledger/StatementGenerator", "title": "StatementGenerator", "type": "Class", "description": "Real-time Financial Statement Generator (Milestone 2.4).", "resource": "crates/erp-accounting/src/ledger.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct StatementGenerator;", "bundle": "crates"}, {"id": "crates/erp-accounting/src/ledger/TrialBalanceRow", "title" nwrap(),\n                grand_total: dec!(200.00),\n                outstanding_amount: dec!(200.00),\n            },\n        ];\n\n        // Allocate payment of 150\n        let (allocations, unallocated) = ArApEngine::allocate_fifo(&mut invoices, dec!(150.00));\n        assert_eq!(unallocated, dec!(0.00));\n        assert_eq!(allocations.len(), 2);\n        assert_eq!(allocations[0].voucher_no, \"INV-001\");\n        assert_eq!(allocations[0].allocated_amount, dec!(100.00));\n        assert_eq!(allocations[0].remaining_outstanding, dec!(0.00));\n        assert_eq!(allocations[1].voucher_no, \"INV-002\");\n        assert_eq!(allocations[1].allocated_amount, dec!(50.00));\n        assert_eq!(allocations[1].remaining_outstanding, dec!(150.00));\n\n        // Credit limit check\n        let credit_ok = ArApEngine::validate_credit_limit(\n            dec!(150.00),\n            dec!(50.00),\n            dec!(300.00),\n            dec!(1000.00),\n        );\n        assert!(credit_ok.is_ok());\n\n        let credit_breach = ArApEngine::validate_credit_limit(\n            dec!(800.00),\n            dec!(100.00),\n            dec!(300.00),\n            dec!(1000.00),\n        );\n        assert!(matches!(\n            credit_breach,\n            Err(AccountingError::CreditLimitExceeded { .. })\n        ));\n    }", "bundle": "crates"}, {"id": "crates/erp-accounting/src/lib/test_period_closed_rejection", "title": "test_period_closed_rejection", "type": "Function", "description": "[test]", "resource": "crates/erp-accounting/src/lib.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_period_closed_rejection() {\n        let accounts = sample_accounts();\n        let closing_logs = vec![PeriodClosingLog {\n            company: \"Acme Corp\".into(),\n            closing_date: NaiveDate::from_ymd_opt(2026, 8, 31).unwrap(),\n        }];\n\n        let engine = LedgerPostingEngine::new(accounts, closing_logs);\n\n        let closed_entry = JournalEntry {\n            posting_date: NaiveDate::from_ymd_opt(2026, 8, 15).unwrap(), // Inside closed period\n            company: \"Acme Corp\".into(),\n            lines: vec![\n                JournalEntryLine {\n                    account: \"1110 - Bank\".into(),\n                    debit: dec!(50.00),\n                    credit: dec!(0.00),\n                    debit_in_account_currency: dec!(50.00),\n                    credit_in_account_currency: dec!(0.00),\n                    exchange_rate: dec!(1.0),\n                    party_type: None,\n                    party: None,\n                },\n                JournalEntryLine {\n                    account: \"4100 - Sales Revenue\".into(),\n                    debit: dec!(0.00),\n                    credit: dec!(50.00),\n                    debit_in_account_currency: dec!(0.00),\n                    credit_in_account_currency: dec!(50.00),\n                    exchange_rate: dec!(1.0),\n                    party_type: None,\n                    party: None,\n                },\n            ],\n            remarks: \"Backdated transaction\".into(),\n        };\n\n        let res = engine.post_journal_entry(&closed_entry, \"JV-001\");\n        assert!(matches!(res, Err(AccountingError::PeriodClosed(_))));\n    }", "bundle": "crates"}, {"id": "crates/erp-accounting/src/lib/test_unbalanced_journal_entry_rejected", "title": "test_unbalanced_journal_entry_rejected", "type": "Function", "description": "[test]", "resource": "crates/erp-accounting/src/lib.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_unbalanced_journal_entry_rejected() {\n        let entry = JournalEntry {\n            posting_date: NaiveDate::from_ymd_opt(2026, 9, 27).unwrap(),\n            company: \"Acme Corp\".into(),\n            lines: vec![\n                JournalEntryLine {\n                    account: \"1110 - Bank\".into(),\n                    debit: dec!(100.000001),\n                    credit: dec!(0.00),\n                    debit_in_account_currency: dec!(100.000001),\n                    credit_in_account_currency: dec!(0.00),\n                    exchange_rate: dec!(1.0),\n                    party_type: None,\n                    party: None,\n                },\n                JournalEntryLine {\n                    account: \"4100 - Sales Revenue\".into(),\n                    debit: dec!(0.00),\n                    credit: dec!(100.00),\n                    debit_in_account_currency: dec!(0.00),\n                    credit_in_account_currency: dec!(100.00),\n                    exchange_rate: dec!(1.0),\n                    party_type: None,\n                    party: None,\n                },\n            ],\n            remarks: \"Test Imbalance\".into(),\n        };\n\n        let res = entry.validate_balance();\n        assert!(matches!(\n            res,\n            Err(AccountingError::UnbalancedTransaction { .. })\n        ));\n    }", "bundle": "crates"}, {"id": "crates/erp-accounting/src/receivables", "title": "receivables", "type": "Module", "description": "", "resource": "crates/erp-accounting/src/receivables.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-accounting/src/receivables/ArApEngine", "title": "ArApEngine", "type": "Class", "description": "Accounts Receivable / Payable (AR/AP) Engine (Milestone 2.5).", "resource": "crates/erp-accounting/src/receivables.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct ArApEngine;", "bundle": "crates"}, {"id": "crates/erp-accounting/src/receivables/OpenInvoice", "title": "OpenInvoice", "type": "Class", "description": "Unsettled customer sales invoice for payment allocation.", "resource": "crates/erp-accounting/src/receivables.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct OpenInvoice {\n    /// Invoice identifier (e.g. \"ACC-SINV-2026-00001\").\n    pub voucher_no: String,\n    /// Invoice posting date.\n    pub posting_date: NaiveDate,\n    /// Total invoice amount.\n    pub grand_total: Decimal,\n    /// Remaining unpaid balance.\n    pub outstanding_amount: Decimal,\n}", "bundle": "crates"}, {"id": "crates/erp-accounting/src/receivables/PaymentAllocationResult", "title": "PaymentAllocationResult", "type": "Class", "description": "Result of an individual invoice payment allocation.", "resource": "crates/erp-accounting/src/receivables.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct PaymentAllocationResult {\n    /// Allocated invoice identifier.\n    pub voucher_no: String,\n    /// Amount allocated from incoming payment.\n    pub allocated_amount: Decimal,\n    /// Remaining outstanding balance on the invoice after allocation.\n    pub remaining_outstanding: Decimal,\n}", "bundle": "crates"}, {"id": "crates/erp-accounting/src/receivables/allocate_fifo", "title": "allocate_fifo", "type": "Function", "description": "FIFO Payment Allocation: matches incoming payment against oldest open invoices sequentially.", "resource": "crates/erp-accounting/src/receivables.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn allocate_fifo(\n        invoices: &mut [OpenInvoice],\n        mut payment_amount: Decimal,\n    ) -> (Vec<PaymentAllocationResult>, Decimal) {\n        // Sort oldest first\n        invoices.sort_by_key(|inv| inv.posting_date);\n\n        let mut allocations = Vec::new();\n\n        for inv in invoices.iter_mut() {\n            if payment_amount <= Decimal::ZERO {\n                break;\n            }\n\n            if inv.outstanding_amount > Decimal::ZERO {\n                if inv.outstanding_amount <= payment_amount {\n                    let allocated = inv.outstanding_amount;\n                    payment_amount -= allocated;\n                    inv.outstanding_amount = Decimal::ZERO;\n\n                    allocations.push(PaymentAllocationResult {\n                        voucher_no: inv.voucher_no.clone(),\n                        allocated_amount: allocated,\n                        remaining_outstanding: Decimal::ZERO,\n                    });\n                } else {\n                    inv.outstanding_amount -= payment_amount;\n                    allocations.push(PaymentAllocationResult {\n                        voucher_no: inv.voucher_no.clone(),\n                        allocated_amount: payment_amount,\n                        remaining_outstanding: inv.outstanding_amount,\n                    });\n                    payment_amount = Decimal::ZERO;\n                }\n            }\n        }\n\n        (allocations, payment_amount)\n    }", "bundle": "crates"}, {"id": "crates/erp-accounting/src/receivables/allocate_fifo_1", "title": "allocate_fifo", "type": "Function", "description": "FIFO Payment Allocation: matches incoming payment against oldest open invoices sequentially.", "resource": "crates/erp-accounting/src/receivables.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn allocate_fifo(\n        invoices: &mut [OpenInvoice],\n        mut payment_amount: Decimal,\n    ) -> (Vec<PaymentAllocationResult>, Decimal) {\n        // Sort oldest first\n        invoices.sort_by_key(|inv| inv.posting_date);\n\n        let mut allocations = Vec::new();\n\n        for inv in invoices.iter_mut() {\n            if payment_amount <= Decimal::ZERO {\n                break;\n            }\n\n            if inv.outstanding_amount > Decimal::ZERO {\n                if inv.outstanding_amount <= payment_amount {\n                    let allocated = inv.outstanding_amount;\n                    payment_amount -= allocated;\n                    inv.outstanding_amount = Decimal::ZERO;\n\n                    allocations.push(PaymentAllocationResult {\n                        voucher_no: inv.voucher_no.clone(),\n                        allocated_amount: allocated,\n                        remaining_outstanding: Decimal::ZERO,\n                    });\n                } else {\n                    inv.outstanding_amount -= payment_amount;\n                    allocations.push(PaymentAllocationResult {\n                        voucher_no: inv.voucher_no.clone(),\n                        allocated_amount: payment_amount,\n                        remaining_outstanding: inv.outstanding_amount,\n                    });\n                    payment_amount = Decimal::ZERO;\n                }\n            }\n        }\n\n        (allocations, payment_amount)\n    }", "bundle": "crates"}, {"id": "crates/erp-accounting/src/receivables/validate_credit_limit", "title": "validate_credit_limit", "type": "Function", "description": "Validates customer credit limit constraint:", "resource": "crates/erp-accounting/src/receivables.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn validate_credit_limit(\n        current_outstanding: Decimal,\n        unbilled_orders: Decimal,\n        new_invoice_amount: Decimal,\n        credit_limit: Decimal,\n    ) -> Result<(), AccountingError> {\n        let total_exposure = current_outstanding + unbilled_orders + new_invoice_amount;\n        if total_exposure > credit_limit {\n            return Err(AccountingError::CreditLimitExceeded {\n                current: current_outstanding + unbilled_orders,\n                new_amount: new_invoice_amount,\n                limit: credit_limit,\n            });\n        }\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/erp-accounting/src/receivables/validate_credit_limit_1", "title": "validate_credit_limit", "type": "Function", "description": "Validates customer credit limit constraint:", "resource": "crates/erp-accounting/src/receivables.rs", "tags": ["domain:erp-accounting", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn validate_credit_limit(\n        current_outstanding: Decimal,\n        unbilled_orders: Decimal,\n        new_invoice_amount: Decimal,\n        credit_limit: Decimal,\n    ) -> Result<(), AccountingError> {\n        let total_exposure = current_outstanding + unbilled_orders + new_invoice_amount;\n        if total_exposure > credit_limit {\n            return Err(AccountingError::CreditLimitExceeded {\n                current: current_outstanding + unbilled_orders,\n                new_amount: new_invoice_amount,\n                limit: credit_limit,\n            });\n        }\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/lib", "title": "lib", "type": "Module", "description": "", "resource": "crates/erp-cms/src/lib.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-cms/src/lib/test_byte_range_parser", "title": "test_byte_range_parser", "type": "Function", "description": "[test]", "resource": "crates/erp-cms/src/lib.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_byte_range_parser() {\n        let total = 10_000u64;\n\n        // bytes=1000-2000 -> (1000, 2000)\n        let (start, end) = parse_byte_range(\"bytes=1000-2000\", total).unwrap();\n        assert_eq!(start, 1000);\n        assert_eq!(end, 2000);\n\n        // bytes=5000- -> (5000, 9999)\n        let (start, end) = parse_byte_range(\"bytes=5000-\", total).unwrap();\n        assert_eq!(start, 5000);\n        assert_eq!(end, 9999);\n\n        // bytes=-500 -> (9500, 9999)\n        let (start, end) = parse_byte_range(\"bytes=-500\", total).unwrap();\n        assert_eq!(start, 9500);\n        assert_eq!(end, 9999);\n\n        // Unsatisfiable range (start >= total)\n        assert!(parse_byte_range(\"bytes=15000-20000\", total).is_err());\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/lib/test_hls_master_playlist_and_cosine_similarity", "title": "test_hls_master_playlist_and_cosine_similarity", "type": "Function", "description": "[test]", "resource": "crates/erp-cms/src/lib.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_hls_master_playlist_and_cosine_similarity() {\n        let master = HlsPlaylistGenerator::generate_master_playlist(STANDARD_VARIANTS);\n        assert!(master.contains(\"#EXTM3U\"));\n        assert!(master.contains(\"1080p.m3u8\"));\n        assert!(master.contains(\"720p.m3u8\"));\n        assert!(master.contains(\"480p.m3u8\"));\n\n        // Cosine similarity between identical vectors = 1.0\n        let vec_a = vec![1.0, 2.0, 3.0];\n        let sim_identical = SubtitleSearchEngine::cosine_similarity(&vec_a, &vec_a);\n        assert!((sim_identical - 1.0).abs() < 1e-5);\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/lib/test_hmac_signed_token_verification_and_expiry", "title": "test_hmac_signed_token_verification_and_expiry", "type": "Function", "description": "[test]", "resource": "crates/erp-cms/src/lib.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_hmac_signed_token_verification_and_expiry() {\n        let secret = b\"super-secret-key-123456\";\n        let signer = HmacStreamingSigner::new(secret);\n        let media_id = \"video-lesson-42\";\n        let expiry = 2_000_000_000u64;\n\n        let token = signer.generate_token(media_id, expiry);\n\n        // Valid token\n        assert!(signer\n            .verify_token(media_id, expiry, 1_900_000_000, &token)\n            .is_ok());\n\n        // Forged token\n        assert!(signer\n            .verify_token(media_id, expiry, 1_900_000_000, \"forged_hex_token\")\n            .is_err());\n\n        // Expired token (current > expiry)\n        let exp_err = signer.verify_token(media_id, expiry, 2_000_000_001, &token);\n        assert!(matches!(exp_err, Err(StreamingError::TokenExpired { .. })));\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/lib/test_svod_concurrency_limiter", "title": "test_svod_concurrency_limiter", "type": "Function", "description": "[test]", "resource": "crates/erp-cms/src/lib.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_svod_concurrency_limiter() {\n        let manager = SvodPlaybackManager::new();\n\n        // 1-stream allowance\n        assert!(manager\n            .start_playback(\"user_1\", \"session_1\".into(), true, 1)\n            .is_ok());\n\n        // Attempt second concurrent stream -> Breaches limit\n        let second_stream = manager.start_playback(\"user_1\", \"session_2\".into(), true, 1);\n        assert!(matches!(\n            second_stream,\n            Err(StreamingError::StreamLimitExceeded { .. })\n        ));\n\n        // End first stream -> Second stream now succeeds\n        manager.end_playback(\"user_1\", \"session_1\");\n        assert!(manager\n            .start_playback(\"user_1\", \"session_2\".into(), true, 1)\n            .is_ok());\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/print", "title": "print", "type": "Module", "description": "", "resource": "crates/erp-cms/src/print.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-cms/src/print/render_invoice_html", "title": "render_invoice_html", "type": "Function", "description": "Lightweight HTML invoice template renderer.", "resource": "crates/erp-cms/src/print.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn render_invoice_html(invoice_no: &str, total_amount: &str, currency: &str) -> String {\n    format!(\n        r#\"<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Invoice {invoice_no}</title>\n<style>\nbody {{ font-family: sans-serif; margin: 40px; color: #333; }}\n.header {{ text-align: center; border-bottom: 2px solid #ddd; padding-bottom: 20px; }}\n.details {{ margin-top: 30px; font-size: 16px; }}\n.total {{ margin-top: 30px; font-size: 20px; font-weight: bold; color: #111; }}\n</style>\n</head>\n<body>\n<div class=\"header\">\n  <h1>COMMERCIAL INVOICE</h1>\n  <p>Invoice #: <strong>{invoice_no}</strong></p>\n</div>\n<div class=\"details\">\n  <p>Thank you for your business.</p>\n</div>\n<div class=\"total\">\n  <p>Grand Total: {currency} {total_amount}</p>\n</div>\n</body>\n</html>\"#\n    )\n}", "bundle": "crates"}, {"id": "crates/erp-cms/src/print/test_render_invoice_html", "title": "test_render_invoice_html", "type": "Function", "description": "[test]", "resource": "crates/erp-cms/src/print.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_render_invoice_html() {\n        let html = render_invoice_html(\"ACC-INV-2026-00001\", \"1,250.00\", \"USD\");\n        assert!(html.contains(\"ACC-INV-2026-00001\"));\n        assert!(html.contains(\"USD 1,250.00\"));\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/security", "title": "security", "type": "Module", "description": "", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/HmacStreamingSigner", "title": "HmacStreamingSigner", "type": "Class", "description": "Signed HMAC-SHA256 Token Generator & Validator (Milestone 5.4).", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct HmacStreamingSigner {\n    secret_key: Vec<u8>,\n}", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/StreamingError", "title": "StreamingError", "type": "Class", "description": "Streaming and CMS security errors.", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum StreamingError {\n    /// Invalid HTTP Byte Range header format.\n    #[error(\"Invalid Range header: {0}\")]\n    InvalidRangeHeader(String),\n    /// Range requested is unsatisfiable.\n    #[error(\"Range not satisfiable: start {start}, end {end}, total {total}\")]\n    RangeNotSatisfiable { start: u64, end: u64, total: u64 },\n    /// Invalid HMAC access signature.\n    #[error(\"Invalid or forged HMAC streaming token\")]\n    InvalidSignature,\n    /// Token expired.\n    #[error(\"Streaming token has expired (expiry {expiry_timestamp}, current {current_timestamp})\")]\n    TokenExpired {\n        expiry_timestamp: u64,\n        current_timestamp: u64,\n    },\n    /// SVoD Subscription inactive.\n    #[error(\"Active SVoD subscription required for media playback\")]\n    SubscriptionRequired,\n    /// Maximum concurrent playback streams reached.\n    #[error(\"Stream limit exceeded: maximum {max_streams} concurrent streams allowed\")]\n    StreamLimitExceeded { max_streams: usize },\n}", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/SvodPlaybackManager", "title": "SvodPlaybackManager", "type": "Class", "description": "SVoD Subscription Gating & Real-Time Playback Concurrency Limiter (Milestone 5.5).", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct SvodPlaybackManager {\n    /// User ID -> List of active streaming session tokens.\n    active_sessions: Arc<RwLock<HashMap<String, Vec<String>>>>,\n}", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/encode", "title": "encode", "type": "Function", "description": "", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn encode(data: impl AsRef<[u8]>) -> String {\n        data.as_ref()\n            .iter()\n            .map(|b| format!(\"{b:02x}\"))\n            .collect()\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/end_playback", "title": "end_playback", "type": "Function", "description": "Ends an active playback session.", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn end_playback(&self, user_id: &str, session_id: &str) {\n        if let Ok(mut lock) = self.active_sessions.write() {\n            if let Some(sessions) = lock.get_mut(user_id) {\n                sessions.retain(|s| s != session_id);\n            }\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/end_playback_1", "title": "end_playback", "type": "Function", "description": "Ends an active playback session.", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn end_playback(&self, user_id: &str, session_id: &str) {\n        if let Ok(mut lock) = self.active_sessions.write() {\n            if let Some(sessions) = lock.get_mut(user_id) {\n                sessions.retain(|s| s != session_id);\n            }\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/generate_token", "title": "generate_token", "type": "Function", "description": "Generates a signed token string: `hex(hmac(media_id || expiry))`.", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn generate_token(&self, media_id: &str, expiry_timestamp: u64) -> String {\n        let mut mac = HmacSha256::new_from_slice(&self.secret_key)\n            .expect(\"HMAC can take key of any size\");\n        let payload = format!(\"{media_id}:{expiry_timestamp}\");\n        mac.update(payload.as_bytes());\n        let result = mac.finalize();\n        hex::encode(result.into_bytes())\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/generate_token_1", "title": "generate_token", "type": "Function", "description": "Generates a signed token string: `hex(hmac(media_id || expiry))`.", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn generate_token(&self, media_id: &str, expiry_timestamp: u64) -> String {\n        let mut mac = HmacSha256::new_from_slice(&self.secret_key)\n            .expect(\"HMAC can take key of any size\");\n        let payload = format!(\"{media_id}:{expiry_timestamp}\");\n        mac.update(payload.as_bytes());\n        let result = mac.finalize();\n        hex::encode(result.into_bytes())\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/new", "title": "new", "type": "Function", "description": "Creates a new signer with the specified secret key.", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new(secret_key: &[u8]) -> Self {\n        Self {\n            secret_key: secret_key.to_vec(),\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/new_1", "title": "new", "type": "Function", "description": "Creates a new signer with the specified secret key.", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new(secret_key: &[u8]) -> Self {\n        Self {\n            secret_key: secret_key.to_vec(),\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/new_2", "title": "new", "type": "Function", "description": "Creates a new playback manager.", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new() -> Self {\n        Self::default()\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/new_3", "title": "new", "type": "Function", "description": "Creates a new playback manager.", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new() -> Self {\n        Self::default()\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/parse_byte_range", "title": "parse_byte_range", "type": "Function", "description": "HTTP 206 Byte Range Parser (Milestone 5.4).", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn parse_byte_range(range_header: &str, total_size: u64) -> Result<(u64, u64), StreamingError> {\n    let trimmed = range_header.trim();\n    if !trimmed.starts_with(\"bytes=\") {\n        return Err(StreamingError::InvalidRangeHeader(range_header.to_string()));\n    }\n\n    let range_str = &trimmed[6..];\n    let mut parts = range_str.split('-');\n\n    let start_str = parts\n        .next()\n        .ok_or_else(|| StreamingError::InvalidRangeHeader(range_header.to_string()))?;\n    let end_str = parts.next().unwrap_or(\"\");\n\n    let (start, end) = if start_str.is_empty() {\n        if end_str.is_empty() {\n            return Err(StreamingError::InvalidRangeHeader(range_header.to_string()));\n        }\n        let suffix_len: u64 = end_str\n            .parse()\n            .map_err(|_| StreamingError::InvalidRangeHeader(range_header.to_string()))?;\n        let s = total_size.saturating_sub(suffix_len);\n        let e = total_size.saturating_sub(1);\n        (s, e)\n    } else {\n        let s: u64 = start_str\n            .parse()\n            .map_err(|_| StreamingError::InvalidRangeHeader(range_header.to_string()))?;\n        let e: u64 = if end_str.is_empty() {\n            total_size.saturating_sub(1)\n        } else {\n            end_str\n                .parse()\n                .map_err(|_| StreamingError::InvalidRangeHeader(range_header.to_string()))?\n        };\n        (s, e)\n    };\n\n    if start > end || start >= total_size {\n        return Err(StreamingError::RangeNotSatisfiable {\n            start,\n            end,\n            total: total_size,\n        });\n    }\n\n    let clamped_end = end.min(total_size.saturating_sub(1));\n    Ok((start, clamped_end))\n}", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/start_playback", "title": "start_playback", "type": "Function", "description": "Starts a playback session if subscription is active and concurrency limit is not breached.", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn start_playback(\n        &self,\n        user_id: &str,\n        session_id: String,\n        is_subscription_active: bool,\n        max_concurrent_streams: usize,\n    ) -> Result<(), StreamingError> {\n        if !is_subscription_active {\n            return Err(StreamingError::SubscriptionRequired);\n        }\n\n        let mut lock = self\n            .active_sessions\n            .write()\n            .map_err(|_| StreamingError::SubscriptionRequired)?;\n\n        let sessions = lock.entry(user_id.to_string()).or_default();\n        if sessions.len() >= max_concurrent_streams {\n            return Err(StreamingError::StreamLimitExceeded {\n                max_streams: max_concurrent_streams,\n            });\n        }\n\n        sessions.push(session_id);\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/start_playback_1", "title": "start_playback", "type": "Function", "description": "Starts a playback session if subscription is active and concurrency limit is not breached.", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn start_playback(\n        &self,\n        user_id: &str,\n        session_id: String,\n        is_subscription_active: bool,\n        max_concurrent_streams: usize,\n    ) -> Result<(), StreamingError> {\n        if !is_subscription_active {\n            return Err(StreamingError::SubscriptionRequired);\n        }\n\n        let mut lock = self\n            .active_sessions\n            .write()\n            .map_err(|_| StreamingError::SubscriptionRequired)?;\n\n        let sessions = lock.entry(user_id.to_string()).or_default();\n        if sessions.len() >= max_concurrent_streams {\n            return Err(StreamingError::StreamLimitExceeded {\n                max_streams: max_concurrent_streams,\n            });\n        }\n\n        sessions.push(session_id);\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/verify_token", "title": "verify_token", "type": "Function", "description": "Validates an incoming signed token against media ID and current timestamp.", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn verify_token(\n        &self,\n        media_id: &str,\n        expiry_timestamp: u64,\n        current_timestamp: u64,\n        provided_token: &str,\n    ) -> Result<(), StreamingError> {\n        if current_timestamp > expiry_timestamp {\n            return Err(StreamingError::TokenExpired {\n                expiry_timestamp,\n                current_timestamp,\n            });\n        }\n\n        let expected_token = self.generate_token(media_id, expiry_timestamp);\n        if expected_token != provided_token {\n            return Err(StreamingError::InvalidSignature);\n        }\n\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/security/verify_token_1", "title": "verify_token", "type": "Function", "description": "Validates an incoming signed token against media ID and current timestamp.", "resource": "crates/erp-cms/src/security.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn verify_token(\n        &self,\n        media_id: &str,\n        expiry_timestamp: u64,\n        current_timestamp: u64,\n        provided_token: &str,\n    ) -> Result<(), StreamingError> {\n        if current_timestamp > expiry_timestamp {\n            return Err(StreamingError::TokenExpired {\n                expiry_timestamp,\n                current_timestamp,\n            });\n        }\n\n        let expected_token = self.generate_token(media_id, expiry_timestamp);\n        if expected_token != provided_token {\n            return Err(StreamingError::InvalidSignature);\n        }\n\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/subtitles", "title": "subtitles", "type": "Module", "description": "", "resource": "crates/erp-cms/src/subtitles.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-cms/src/subtitles/SubtitleSearchEngine", "title": "SubtitleSearchEngine", "type": "Class", "description": "SurrealDB v3 Vector Index DDL and Semantic Subtitle Search (Milestone 5.3).", "resource": "crates/erp-cms/src/subtitles.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct SubtitleSearchEngine;", "bundle": "crates"}, {"id": "crates/erp-cms/src/subtitles/SubtitleSegment", "title": "SubtitleSegment", "type": "Class", "description": "Timestamped subtitle phrase segment.", "resource": "crates/erp-cms/src/subtitles.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct SubtitleSegment {\n    pub start_mark: f64,\n    pub end_mark: f64,\n    pub phrase: String,\n    pub embedding: Vec<f32>,\n}", "bundle": "crates"}, {"id": "crates/erp-cms/src/subtitles/compile_vector_index_ddl", "title": "compile_vector_index_ddl", "type": "Function", "description": "Emits SurrealDB v3 HNSW Vector Index DDL statements.", "resource": "crates/erp-cms/src/subtitles.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn compile_vector_index_ddl() -> Vec<String> {\n        vec![\n            \"DEFINE TABLE media_transcripts SCHEMAFULL;\".to_string(),\n            \"DEFINE FIELD video_id ON TABLE media_transcripts TYPE record<media>;\".to_string(),\n            \"DEFINE FIELD start_mark ON TABLE media_transcripts TYPE number;\".to_string(),\n            \"DEFINE FIELD end_mark ON TABLE media_transcripts TYPE number;\".to_string(),\n            \"DEFINE FIELD phrase ON TABLE media_transcripts TYPE string;\".to_string(),\n            \"DEFINE FIELD embedding ON TABLE media_transcripts TYPE array<number, 1536>;\".to_string(),\n            \"DEFINE INDEX idx_transcripts_vector ON TABLE media_transcripts FIELDS embedding TYPE HNSW DISTANCE COSINE DIMENSION 1536;\".to_string(),\n        ]\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/subtitles/compile_vector_index_ddl_1", "title": "compile_vector_index_ddl", "type": "Function", "description": "Emits SurrealDB v3 HNSW Vector Index DDL statements.", "resource": "crates/erp-cms/src/subtitles.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn compile_vector_index_ddl() -> Vec<String> {\n        vec![\n            \"DEFINE TABLE media_transcripts SCHEMAFULL;\".to_string(),\n            \"DEFINE FIELD video_id ON TABLE media_transcripts TYPE record<media>;\".to_string(),\n            \"DEFINE FIELD start_mark ON TABLE media_transcripts TYPE number;\".to_string(),\n            \"DEFINE FIELD end_mark ON TABLE media_transcripts TYPE number;\".to_string(),\n            \"DEFINE FIELD phrase ON TABLE media_transcripts TYPE string;\".to_string(),\n            \"DEFINE FIELD embedding ON TABLE media_transcripts TYPE array<number, 1536>;\".to_string(),\n            \"DEFINE INDEX idx_transcripts_vector ON TABLE media_transcripts FIELDS embedding TYPE HNSW DISTANCE COSINE DIMENSION 1536;\".to_string(),\n        ]\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/subtitles/cosine_similarity", "title": "cosine_similarity", "type": "Function", "description": "Computes cosine similarity between two vector embeddings: $\\frac{A \\cdot B}{\\|A\\| \\|B\\|}$.", "resource": "crates/erp-cms/src/subtitles.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn cosine_similarity(a: &[f32], b: &[f32]) -> f32 {\n        if a.len() != b.len() || a.is_empty() {\n            return 0.0;\n        }\n\n        let mut dot_product = 0.0;\n        let mut norm_a = 0.0;\n        let mut norm_b = 0.0;\n\n        for (x, y) in a.iter().zip(b.iter()) {\n            dot_product += x * y;\n            norm_a += x * x;\n            norm_b += y * y;\n        }\n\n        if norm_a == 0.0 || norm_b == 0.0 {\n            0.0\n        } else {\n            dot_product / (norm_a.sqrt() * norm_b.sqrt())\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/subtitles/cosine_similarity_1", "title": "cosine_similarity", "type": "Function", "description": "Computes cosine similarity between two vector embeddings: $\\frac{A \\cdot B}{\\|A\\| \\|B\\|}$.", "resource": "crates/erp-cms/src/subtitles.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn cosine_similarity(a: &[f32], b: &[f32]) -> f32 {\n        if a.len() != b.len() || a.is_empty() {\n            return 0.0;\n        }\n\n        let mut dot_product = 0.0;\n        let mut norm_a = 0.0;\n        let mut norm_b = 0.0;\n\n        for (x, y) in a.iter().zip(b.iter()) {\n            dot_product += x * y;\n            norm_a += x * x;\n            norm_b += y * y;\n        }\n\n        if norm_a == 0.0 || norm_b == 0.0 {\n            0.0\n        } else {\n            dot_product / (norm_a.sqrt() * norm_b.sqrt())\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/transcoder", "title": "transcoder", "type": "Module", "description": "", "resource": "crates/erp-cms/src/transcoder.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-cms/src/transcoder/HlsPlaylistGenerator", "title": "HlsPlaylistGenerator", "type": "Class", "description": "HLS Adaptive Bitrate (ABR) Playlist Generator (Milestone 5.2).", "resource": "crates/erp-cms/src/transcoder.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct HlsPlaylistGenerator;", "bundle": "crates"}, {"id": "crates/erp-cms/src/transcoder/VideoVariant", "title": "VideoVariant", "type": "Class", "description": "Adaptive Bitrate (ABR) Video Variant profile.", "resource": "crates/erp-cms/src/transcoder.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct VideoVariant {\n    pub name: &'static str,\n    pub width: u32,\n    pub height: u32,\n    pub bandwidth: u64,\n}", "bundle": "crates"}, {"id": "crates/erp-cms/src/transcoder/generate_master_playlist", "title": "generate_master_playlist", "type": "Function", "description": "Generates valid master.m3u8 playlist indexing all variants.", "resource": "crates/erp-cms/src/transcoder.rs", "tags": ["domain:erp-cms", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn generate_master_playlist(variants: &[VideoVariant]) -> String {\n        let mut lines = vec![\n            \"#EXTM3U\".to_string(),\n            \"#EXT-X-VERSION:3\".to_string(),\n        ];\n\n        for v in variants {\n            lines.push(format!(\n                \"#EXT-X-STREAM-INF:BANDWIDTH={},RESOLUTION={}x{}\",\n                v.bandwidth, v.width, v.height\n            ));\n            lines.push(format!(\"{}.m3u8\", v.name));\n        }\n\n        lines.join(\"\\n\")\n    }", "bundle": "crates"}, {"id": "crates/erp-cms/src/transcoder/generate_master_playlist_1", "title": "generate_master_playlist", "type": "Function", "description": "Generates valid master.m3u8 playlist indexing all variants.", "resource": "crates
