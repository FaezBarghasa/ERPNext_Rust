 assert!(lead.transition_to(LeadStatus::Converted).is_ok());\n        assert_eq!(lead.status, LeadStatus::Converted);\n\n        // Converted cannot go to Replied\n        assert!(matches!(\n            lead.transition_to(LeadStatus::Replied),\n            Err(CrmError::InvalidTransition { .. })\n        ));\n    }", "bundle": "crates"}, {"id": "crates/erp-crm/src/lib/test_quotation_conversion_and_price_locking", "title": "test_quotation_conversion_and_price_locking", "type": "Function", "description": "[test]", "resource": "crates/erp-crm/src/lib.rs", "tags": ["domain:erp-crm", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_quotation_conversion_and_price_locking() {\n        let mut quote = Quotation {\n            name: \"QTN-2026-001\".into(),\n            party_name: \"Acme Corp\".into(),\n            valid_till: NaiveDate::from_ymd_opt(2026, 12, 31).unwrap(),\n            items: vec![QuotationItem {\n                item_code: \"PRODUCT-A\".into(),\n                qty: dec!(5.0),\n                rate: dec!(100.00),\n                amount: dec!(500.00),\n            }],\n            net_total: dec!(500.00),\n            status: QuotationStatus::Submitted,\n        };\n\n        let as_of = NaiveDate::from_ymd_opt(2026, 10, 1).unwrap();\n        let sales_order = CrmPipeline::convert_to_sales_order(&mut quote, as_of, \"SO-2026-001\")\n            .expect(\"Conversion failed\");\n\n        assert_eq!(sales_order.customer, \"Acme Corp\");\n        assert_eq!(sales_order.quotation_ref, \"QTN-2026-001\");\n        assert_eq!(sales_order.net_total, dec!(500.00));\n        assert_eq!(quote.status, QuotationStatus::Ordered);\n\n        // Test expired quote conversion rejection\n        let mut expired_quote = Quotation {\n            name: \"QTN-2026-EXP\".into(),\n            party_name: \"Beta Corp\".into(),\n            valid_till: NaiveDate::from_ymd_opt(2026, 5, 1).unwrap(),\n            items: vec![],\n            net_total: dec!(0.0),\n            status: QuotationStatus::Submitted,\n        };\n        let late_date = NaiveDate::from_ymd_opt(2026, 10, 1).unwrap();\n        let err = CrmPipeline::convert_to_sales_order(&mut expired_quote, late_date, \"SO-EXP\");\n        assert!(matches!(err, Err(CrmError::QuotationExpired { .. })));\n    }", "bundle": "crates"}, {"id": "crates/erp-crm/src/pipeline", "title": "pipeline", "type": "Module", "description": "", "resource": "crates/erp-crm/src/pipeline.rs", "tags": ["domain:erp-crm", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-crm/src/pipeline/CrmError", "title": "CrmError", "type": "Class", "description": "CRM domain errors.", "resource": "crates/erp-crm/src/pipeline.rs", "tags": ["domain:erp-crm", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum CrmError {\n    /// Invalid state machine transition.\n    #[error(\"Invalid CRM stage transition from {from:?} to {to:?}\")]\n    InvalidTransition {\n        from: LeadStatus,\n        to: LeadStatus,\n    },\n    /// Quotation has expired.\n    #[error(\"Quotation '{name}' has expired on {valid_till}\")]\n    QuotationExpired {\n        name: String,\n        valid_till: NaiveDate,\n    },\n    /// Quotation is not approved.\n    #[error(\"Quotation '{name}' must be in Submitted state to convert to Sales Order\")]\n    QuotationNotSubmitted {\n        name: String,\n    },\n}", "bundle": "crates"}, {"id": "crates/erp-crm/src/pipeline/CrmPipeline", "title": "CrmPipeline", "type": "Class", "description": "CRM Pipeline Coordinator (Milestone 3.9).", "resource": "crates/erp-crm/src/pipeline.rs", "tags": ["domain:erp-crm", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct CrmPipeline;", "bundle": "crates"}, {"id": "crates/erp-crm/src/pipeline/Lead", "title": tion_to(self, target: LeadStatus) -> bool {\n        match (self, target) {\n            (LeadStatus::Open, LeadStatus::Replied | LeadStatus::Opportunity | LeadStatus::Lost) => true,\n            (LeadStatus::Replied, LeadStatus::Opportunity | LeadStatus::Lost) => true,\n            (LeadStatus::Opportunity, LeadStatus::Converted | LeadStatus::Lost) => true,\n            (LeadStatus::Lost, LeadStatus::Open) => true,\n            _ => false,\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-crm/src/pipeline/convert_to_sales_order", "title": "convert_to_sales_order", "type": "Function", "description": "Converts an approved Quotation into a confirmed SalesOrder, preserving locked pricing.", "resource": "crates/erp-crm/src/pipeline.rs", "tags": ["domain:erp-crm", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn convert_to_sales_order(\n        quotation: &mut Quotation,\n        as_of_date: NaiveDate,\n        sales_order_id: &str,\n    ) -> Result<SalesOrder, CrmError> {\n        if quotation.status != QuotationStatus::Submitted {\n            return Err(CrmError::QuotationNotSubmitted {\n                name: quotation.name.clone(),\n            });\n        }\n\n        if as_of_date > quotation.valid_till {\n            return Err(CrmError::QuotationExpired {\n                name: quotation.name.clone(),\n                valid_till: quotation.valid_till,\n            });\n        }\n\n        quotation.status = QuotationStatus::Ordered;\n\n        Ok(SalesOrder {\n            name: sales_order_id.to_string(),\n            customer: quotation.party_name.clone(),\n            quotation_ref: quotation.name.clone(),\n            items: quotation.items.clone(),\n            net_total: quotation.net_total,\n            posting_date: as_of_date,\n        })\n    }", "bundle": "crates"}, {"id": "crates/erp-crm/src/pipeline/convert_to_sales_order_1", "title": "convert_to_sales_order", "type": "Function", "description": "Converts an approved Quotation into a confirmed SalesOrder, preserving locked pricing.", "resource": "crates/erp-crm/src/pipeline.rs", "tags": ["domain:erp-crm", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn convert_to_sales_order(\n        quotation: &mut Quotation,\n        as_of_date: NaiveDate,\n        sales_order_id: &str,\n    ) -> Result<SalesOrder, CrmError> {\n        if quotation.status != QuotationStatus::Submitted {\n            return Err(CrmError::QuotationNotSubmitted {\n                name: quotation.name.clone(),\n            });\n        }\n\n        if as_of_date > quotation.valid_till {\n            return Err(CrmError::QuotationExpired {\n                name: quotation.name.clone(),\n                valid_till: quotation.valid_till,\n            });\n        }\n\n        quotation.status = QuotationStatus::Ordered;\n\n        Ok(SalesOrder {\n            name: sales_order_id.to_string(),\n            customer: quotation.party_name.clone(),\n            quotation_ref: quotation.name.clone(),\n            items: quotation.items.clone(),\n            net_total: quotation.net_total,\n            posting_date: as_of_date,\n        })\n    }", "bundle": "crates"}, {"id": "crates/erp-crm/src/pipeline/transition_to", "title": "transition_to", "type": "Function", "description": "Mutates lead state.", "resource": "crates/erp-crm/src/pipeline.rs", "tags": ["domain:erp-crm", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn transition_to(&mut self, next_status: LeadStatus) -> Result<(), CrmError> {\n        if self.status.can_transition_to(next_status) {\n            self.status = next_status;\n            Ok(())\n        } else {\n            Err(CrmError::InvalidTransition {\n                from: self.status,\n                to: next_status,\n            })\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-crm/src/pipeline/transition_to_1", "title": "transition_to", "type": "Function", "description": "Mutates lead state.", "resource": "crates/erp-crm/src/pipeline.rs", "tags": ["domain:erp-crm", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn transition_to(&mut self, next_status: LeadStatus) -> Result<(), CrmError> {\n        if self.status.can_transition_to(next_status) {\n            self.status = next_status;\n            Ok(())\n        } else {\n            Err(CrmError::InvalidTransition {\n                from: self.status,\n                to: next_status,\n            })\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-crm/src/scoring", "title": "scoring", "type": "Module", "description": "", "resource": "crates/erp-crm/src/scoring.rs", "tags": ["domain:erp-crm", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-crm/src/scoring/calculate_lead_score", "title": "calculate_lead_score", "type": "Function", "description": "Computes weighted lead priority score (0..100) based on deal size and engagement.", "resource": "crates/erp-crm/src/scoring.rs", "tags": ["domain:erp-crm", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn calculate_lead_score(\n    engagement_count: u32,\n    estimated_deal_value: Decimal,\n    source_weight: Decimal,\n) -> Decimal {\n    let engagement_score = Decimal::from(engagement_count.min(10)) * Decimal::from(5);\n    let value_score = (estimated_deal_value / Decimal::from(1000)).min(Decimal::from(30));\n    let source_score = source_weight.min(Decimal::from(20));\n\n    let total = engagement_score + value_score + source_score;\n    total.min(Decimal::from(100))\n}", "bundle": "crates"}, {"id": "crates/erp-crm/src/scoring/test_lead_score_bounds", "title": "test_lead_score_bounds", "type": "Function", "description": "[test]", "resource": "crates/erp-crm/src/scoring.rs", "tags": ["domain:erp-crm", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_lead_score_bounds() {\n        let score = calculate_lead_score(5, dec!(20000.0), dec!(10.0));\n        assert!(score >= dec!(0.0) && score <= dec!(100.0));\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/attendance", "title": "attendance", "type": "Module", "description": "", "resource": "crates/erp-hr/src/attendance.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-hr/src/attendance/AttendanceReconciler", "title": "AttendanceReconciler", "type": "Class", "description": "Shift Reconciliation Engine (Milestone 3.5).", "resource": "crates/erp-hr/src/attendance.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct AttendanceReconciler;", "bundle": "crates"}, {"id": "crates/erp-hr/src/attendance/AttendanceStatus", "title": "AttendanceStatus", "type": "Class", "description": "Reconciled daily attendance status.", "resource": "crates/erp-hr/src/attendance.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum AttendanceStatus {\n    Present,\n    LateEntry,\n    EarlyExit,\n    HalfDay,\n    Absent,\n}", "bundle": "crates"}, {"id": "crates/erp-hr/src/attendance/BiometricIngestionGateway", "title": "BiometricIngestionGateway", "type": "Class", "description": "High-throughput Biometric Ingestion Gateway (Milestone 3.5).", "resource": "crates/erp-hr/src/attendance.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct BiometricIngestionGateway {\n    sender: mpsc::Sender<BiometricPunch>,\n}", "bundle": "crates"}, {"id": "crates/erp-hr/src/attendance/BiometricPunch", "title": "BiometricPunch", "type": "Class", "description": "Raw biometric timestamp check-in / check-out punch log.", "resource": "crates/erp-hr/src/attendance.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct BiometricPunch {\n    /// Employee identifier.\n    pub employee_id: String,\n    /// Device identifier.\n    pub device_id: String,\n    /// Timestamp of punch.\n    pub timestamp_date: NaiveDate,\n    /// Exact punch time.\n    pub punch_time: NaiveTime,\n}", "bundle": "crates"}, {"id": "crates/erp-hr/src/attendance/HrError", "title": "HrError", "type": "Class", "description": "HR & Attendance errors.", "resource": "crates/erp-hr/src/attendance.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum HrError {\n    /// Ingestion buffer full.\n    #[error(\"Biometric ingestion queue channel full\")]\n    IngestionQueueFull,\n    /// Insufficient remaining leave balance.\n    #[error(\"Insufficient leave balance for {leave_type}: requested {requested}, available {available}\")]\n    InsufficientLeaveBalance {\n        leave_type: String,\n        requested: rust_decimal::Decimal,\n        available: rust_decimal::Decimal,\n    },\n    /// Overlapping leave application.\n    #[error(\"Overlapping leave application exists between {from_date} and {to_date}\")]\n    OverlappingLeave {\n        from_date: NaiveDate,\n        to_date: NaiveDate,\n    },\n    /// Employee calculation failed.\n    #[error(\"Salary calculation failed for employee '{0}': {1}\")]\n    SalaryCalculationError(String, String),\n}", "bundle": "crates"}, {"id": "crates/erp-hr/src/attendance/ShiftType", "title": "ShiftType", "type": "Class", "description": "Shift specification with grace period margins.", "resource": "crates/erp-hr/src/attendance.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct ShiftType {\n    /// Shift name (e.g. \"General Morning\").\n    pub name: String,\n    /// Shift start time.\n    pub start_time: NaiveTime,\n    /// Shift end time.\n    pub end_time: NaiveTime,\n    /// Late entry grace period in minutes.\n    pub late_entry_grace_mins: u32,\n    /// Early exit grace period in minutes.\n    pub early_exit_grace_mins: u32,\n}", "bundle": "crates"}, {"id": "crates/erp-hr/src/attendance/ingest_punch", "title": "ingest_punch", "type": "Function", "description": "Ingests an incoming punch event without blocking server request threads.", "resource": "crates/erp-hr/src/attendance.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn ingest_punch(&self, punch: BiometricPunch) -> Result<(), HrError> {\n        self.sender\n            .try_send(punch)\n            .map_err(|_| HrError::IngestionQueueFull)\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/attendance/ingest_punch_1", "title": "ingest_punch", "type": "Function", "description": "Ingests an incoming punch event without blocking server request threads.", "resource": "crates/erp-hr/src/attendance.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn ingest_punch(&self, punch: BiometricPunch) -> Result<(), HrError> {\n        self.sender\n            .try_send(punch)\n            .map_err(|_| HrError::IngestionQueueFull)\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/attendance/new", "title": "new", "type": "Function", "description": "Creates a bounded 10,000 capacity ingestion gateway.", "resource": "crates/erp-hr/src/attendance.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new(capacity: usize) -> (Self, mpsc::Receiver<BiometricPunch>) {\n        let (sender, receiver) = mpsc::channel(capacity);\n        (Self { sender }, receiver)\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/attendance/new_1", "title": "new", "type": "Function", "description": "Creates a bounded 10,000 capacity ingestion gateway.", "resource": "crates/erp-hr/src/attendance.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new(capacity: usize) -> (Self, mpsc::Receiver<BiometricPunch>) {\n        let (sender, receiver) = mpsc::channel(capacity);\n        (Self { sender }, receiver)\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/attendance/reconcile_shift", "title": "reconcile_shift", "type": "Function", "description": "Reconciles daily check-in and check-out against shift boundaries.", "resource": "crates/erp-hr/src/attendance.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn reconcile_shift(\n        shift: &ShiftType,\n        check_in: Option<NaiveTime>,\n        check_out: Option<NaiveTime>,\n    ) -> AttendanceStatus {\n        let (in_time, out_time) = match (check_in, check_out) {\n            (Some(i), Some(o)) => (i, o),\n            (Some(_), None) | (None, Some(_)) => return AttendanceStatus::HalfDay,\n            (None, None) => return AttendanceStatus::Absent,\n        };\n\n        let shift_duration_mins = (shift.end_time - shift.start_time).num_minutes();\n        let worked_mins = (out_time - in_time).num_minutes();\n\n        if worked_mins < shift_duration_mins / 2 {\n            return AttendanceStatus::HalfDay;\n        }\n\n        let is_late = (in_time - shift.start_time).num_minutes() > shift.late_entry_grace_mins as i64;\n        let is_early_exit = (shift.end_time - out_time).num_minutes() > shift.early_exit_grace_mins as i64;\n\n        if is_late && is_early_exit {\n            AttendanceStatus::HalfDay\n        } else if is_late {\n            AttendanceStatus::LateEntry\n        } else if is_early_exit {\n            AttendanceStatus::EarlyExit\n        } else {\n            AttendanceStatus::Present\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/attendance/reconcile_shift_1", "title": "reconcile_shift", "type": "Function", "description": "Reconciles daily check-in and check-out against shift boundaries.", "resource": "crates/erp-hr/src/attendance.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn reconcile_shift(\n        shift: &ShiftType,\n        check_in: Option<NaiveTime>,\n        check_out: Option<NaiveTime>,\n    ) -> AttendanceStatus {\n        let (in_time, out_time) = match (check_in, check_out) {\n            (Some(i), Some(o)) => (i, o),\n            (Some(_), None) | (None, Some(_)) => return AttendanceStatus::HalfDay,\n            (None, None) => return AttendanceStatus::Absent,\n        };\n\n        let shift_duration_mins = (shift.end_time - shift.start_time).num_minutes();\n        let worked_mins = (out_time - in_time).num_minutes();\n\n        if worked_mins < shift_duration_mins / 2 {\n            return AttendanceStatus::HalfDay;\n        }\n\n        let is_late = (in_time - shift.start_time).num_minutes() > shift.late_entry_grace_mins as i64;\n        let is_early_exit = (shift.end_time - out_time).num_minutes() > shift.early_exit_grace_mins as i64;\n\n        if is_late && is_early_exit {\n            AttendanceStatus::HalfDay\n        } else if is_late {\n            AttendanceStatus::LateEntry\n        } else if is_early_exit {\n            AttendanceStatus::EarlyExit\n        } else {\n            AttendanceStatus::Present\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/lib", "title": "lib", "type": "Module", "description": "", "resource": "crates/erp-hr/src/lib.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-hr/src/lib/test_leave_allocation_and_overlap_detection", "title": "test_leave_allocation_and_overlap_detection", "type": "Function", "description": "[test]", "resource": "crates/erp-hr/src/lib.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_leave_allocation_and_overlap_detection() {\n        let app1 = LeaveApplication {\n            employee_id: \"EMP-001\".into(),\n            leave_type: \"Annual Leave\".into(),\n            from_date: NaiveDate::from_ymd_opt(2026, 10, 1).unwrap(),\n            to_date: NaiveDate::from_ymd_opt(2026, 10, 5).unwrap(),\n            total_days: dec!(5.0),\n        };\n\n        // Available balance: 10 days -> Deduct 5 days -> Remaining: 5 days\n        let rem1 = LeaveEngine::validate_and_deduct_leave(&app1, dec!(10.0), &[])\n            .expect(\"Leave validation failed\");\n        assert_eq!(rem1, dec!(5.0));\n\n        // Attempt requesting 6 days with only 5 available -> Insufficient balance error\n        let app2 = LeaveApplication {\n            employee_id: \"EMP-001\".into(),\n            leave_type: \"Annual Leave\".into(),\n            from_date: NaiveDate::from_ymd_opt(2026, 10, 10).unwrap(),\n            to_date: NaiveDate::from_ymd_opt(2026, 10, 15).unwrap(),\n            total_days: dec!(6.0),\n        };\n        let err = LeaveEngine::validate_and_deduct_leave(&app2, dec!(5.0), &[app1.clone()]);\n        assert!(matches!(err, Err(HrError::InsufficientLeaveBalance { .. })));\n\n        // Attempt requesting overlapping leave (Oct 3 to Oct 7) -> Overlap error\n        let app_overlap = LeaveApplication {\n            employee_id: \"EMP-001\".into(),\n            leave_type: \"Casual Leave\".into(),\n            from_date: NaiveDate::from_ymd_opt(2026, 10, 3).unwrap(),\n            to_date: NaiveDate::from_ymd_opt(2026, 10, 7).unwrap(),\n            total_days: dec!(5.0),\n        };\n        let overlap_err = LeaveEngine::validate_and_deduct_leave(&app_overlap, dec!(20.0), &[app1]);\n        assert!(matches!(overlap_err, Err(HrError::OverlappingLeave { .. })));\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/lib/test_salary_calculation_and_concurrent_payroll", "title": "test_salary_calculation_and_concurrent_payroll", "type": "Function", "description": "[tokio::test]", "resource": "crates/erp-hr/src/lib.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    async fn test_salary_calculation_and_concurrent_payroll() {\n        let structure = SalaryStructure {\n            base_salary: dec!(4000.00),\n            hra_percentage: dec!(20.0),        // 20% of basic\n            standard_deduction: dec!(100.00),\n            tax_withholding_rate: dec!(10.0),  // 10% of gross\n        };\n\n        let date = NaiveDate::from_ymd_opt(2026, 9, 30).unwrap();\n\n        // 15 attended days out of 20 -> Basic = 3000.00, HRA = 600.00 -> Gross = 3600.00\n        // Tax (10%) = 360.00 + Std Ded = 100.00 -> Total Ded = 460.00 -> Net = 3140.00\n        let slip = SalaryCalculator::calculate_slip(\n            \"EMP-001\",\n            &structure,\n            dec!(15.0),\n            dec!(20.0),\n            dec!(0.0),\n            date,\n            \"SLIP-001\",\n        )\n        .expect(\"Salary calculation failed\");\n\n        assert_eq!(slip.earned_basic, dec!(3000.00));\n        assert_eq!(slip.earned_hra, dec!(600.00));\n        assert_eq!(slip.gross_salary, dec!(3600.00));\n        assert_eq!(slip.tax_deducted, dec!(360.00));\n        assert_eq!(slip.net_salary, dec!(3140.00));\n\n        // Concurrent payroll batch test across multiple employees\n        let employees = vec![\n            (\"EMP-001\".into(), structure.clone(), dec!(20.0), dec!(20.0), dec!(0.0)),\n            (\"EMP-002\".into(), structure.clone(), dec!(18.0), dec!(20.0), dec!(5.0)),\n            (\"EMP-003\".into(), structure.clone(), dec!(20.0), dec!(20.0), dec!(0.0)),\n        ];\n\n        let (slips, failed) = EnterprisePayrollCoordinator::process_batch_payroll(employees, date).await;\n        assert_eq!(failed.len(), 0);\n        assert_eq!(slips.len(), 3);\n\n        // General Ledger Journal Entry verification\n        let gl_config = PayrollGlAccounts {\n            salary_expense_account: \"5110 - Salary Expense\".into(),\n            payroll_payable_account: \"2110 - Payroll Payable\".into(),\n            taxes_withheld_account: \"2230 - Taxes Withheld Payable\".into(),\n            company: \"Acme Corp\".into(),\n        };\n\n        let jv = EnterprisePayrollCoordinator::create_payroll_journal_entry(&slips, &gl_config, date);\n        assert!(jv.validate_balance().is_ok());\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/lib/test_shift_reconciliation", "title": "test_shift_reconciliation", "type": "Function", "description": "[test]", "resource": "crates/erp-hr/src/lib.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_shift_reconciliation() {\n        let shift = ShiftType {\n            name: \"Standard 9-5\".into(),\n            start_time: NaiveTime::from_hms_opt(9, 0, 0).unwrap(),\n            end_time: NaiveTime::from_hms_opt(17, 0, 0).unwrap(),\n            late_entry_grace_mins: 15,\n            early_exit_grace_mins: 15,\n        };\n\n        // On time: 9:05 in, 17:00 out -> Present\n        let status1 = AttendanceReconciler::reconcile_shift(\n            &shift,\n            Some(NaiveTime::from_hms_opt(9, 5, 0).unwrap()),\n            Some(NaiveTime::from_hms_opt(17, 0, 0).unwrap()),\n        );\n        assert_eq!(status1, AttendanceStatus::Present);\n\n        // Late: 9:30 in, 17:00 out -> LateEntry\n        let status2 = AttendanceReconciler::reconcile_shift(\n            &shift,\n            Some(NaiveTime::from_hms_opt(9, 30, 0).unwrap()),\n            Some(NaiveTime::from_hms_opt(17, 0, 0).unwrap()),\n        );\n        assert_eq!(status2, AttendanceStatus::LateEntry);\n\n        // Early Exit: 9:00 in, 16:30 out -> EarlyExit\n        let status3 = AttendanceReconciler::reconcile_shift(\n            &shift,\n            Some(NaiveTime::from_hms_opt(9, 0, 0).unwrap()),\n            Some(NaiveTime::from_hms_opt(16, 30, 0).unwrap()),\n        );\n        assert_eq!(status3, AttendanceStatus::EarlyExit);\n\n        // Half day: worked only 3 hours (9:00 to 12:00) -> HalfDay\n        let status4 = AttendanceReconciler::reconcile_shift(\n            &shift,\n            Some(NaiveTime::from_hms_opt(9, 0, 0).unwrap()),\n            Some(NaiveTime::from_hms_opt(12, 0, 0).unwrap()),\n        );\n        assert_eq!(status4, AttendanceStatus::HalfDay);\n\n        // Absent: No punch -> Absent\n        let status5 = AttendanceReconciler::reconcile_shift(&shift, None, None);\n        assert_eq!(status5, AttendanceStatus::Absent);\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/payroll", "title": "payroll", "type": "Module", "description": "", "resource": "crates/erp-hr/src/payroll.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-hr/src/payroll/EnterprisePayrollCoordinator", "title": "EnterprisePayrollCoordinator", "type": "Class", "description": "Concurrent Enterprise Payroll Coordinator (Milestone 3.7).", "resource": "crates/erp-hr/src/payroll.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct EnterprisePayrollCoordinator;", "bundle": "crates"}, {"id": "crates/erp-hr/src/payroll/LeaveApplication", "title": "LeaveA anch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct SalarySlip {\n    /// Slip document ID.\n    pub name: String,\n    /// Employee identifier.\n    pub employee_id: String,\n    /// Posting date / pay period end.\n    pub posting_date: NaiveDate,\n    /// Attended working days.\n    pub attended_days: Decimal,\n    /// Total standard working days in month.\n    pub total_working_days: Decimal,\n    /// Earned basic salary.\n    pub earned_basic: Decimal,\n    /// Earned HRA.\n    pub earned_hra: Decimal,\n    /// Overtime earnings.\n    pub overtime_amount: Decimal,\n    /// Gross earnings.\n    pub gross_salary: Decimal,\n    /// Income tax deducted.\n    pub tax_deducted: Decimal,\n    /// Other deductions (e.g. standard deduction, provident fund).\n    pub other_deductions: Decimal,\n    /// Total deductions.\n    pub total_deductions: Decimal,\n    /// Net take-home pay.\n    pub net_salary: Decimal,\n}", "bundle": "crates"}, {"id": "crates/erp-hr/src/payroll/SalaryStructure", "title": "SalaryStructure", "type": "Class", "description": "Employee salary structure configuration.", "resource": "crates/erp-hr/src/payroll.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct SalaryStructure {\n    /// Monthly base salary.\n    pub base_salary: Decimal,\n    /// House Rent Allowance percentage of basic (e.g. 20.0 for 20%).\n    pub hra_percentage: Decimal,\n    /// Standard statutory deduction.\n    pub standard_deduction: Decimal,\n    /// Income tax withholding percentage (e.g. 10.0 for 10%).\n    pub tax_withholding_rate: Decimal,\n}", "bundle": "crates"}, {"id": "crates/erp-hr/src/payroll/calculate_slip", "title": "calculate_slip", "type": "Function", "description": "Computes individual salary slip based on attendance and salary structure.", "resource": "crates/erp-hr/src/payroll.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn calculate_slip(\n        employee_id: &str,\n        structure: &SalaryStructure,\n        attended_days: Decimal,\n        total_working_days: Decimal,\n        overtime_hours: Decimal,\n        posting_date: NaiveDate,\n        slip_id: &str,\n    ) -> Result<SalarySlip, HrError> {\n        if total_working_days <= Decimal::ZERO {\n            return Err(HrError::SalaryCalculationError(\n                employee_id.to_string(),\n                \"Total working days must be positive\".to_string(),\n            ));\n        }\n\n        let attendance_ratio = (attended_days / total_working_days).min(Decimal::ONE);\n        let earned_basic = structure.base_salary * attendance_ratio;\n        let earned_hra = earned_basic * (structure.hra_percentage / Decimal::from(100));\n\n        // Overtime rate: 1.5x hourly rate (8-hour day)\n        let hourly_rate = (structure.base_salary / total_working_days) / Decimal::from(8);\n        let overtime_amount = overtime_hours * hourly_rate * Decimal::from_str_exact(\"1.5\").unwrap();\n\n        let gross_salary = earned_basic + earned_hra + overtime_amount;\n        let tax_deducted = gross_salary * (structure.tax_withholding_rate / Decimal::from(100));\n        let other_deductions = structure.standard_deduction;\n        let total_deductions = tax_deducted + other_deductions;\n        let net_salary = gross_salary - total_deductions;\n\n        Ok(SalarySlip {\n            name: slip_id.to_string(),\n            employee_id: employee_id.to_string(),\n            posting_date,\n            attended_days,\n            total_working_days,\n            earned_basic,\n            earned_hra,\n            overtime_amount,\n            gross_salary,\n            tax_deducted,\n            other_deductions,\n            total_deductions,\n            net_salary,\n        })\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/payroll/calculate_slip_1", "title": "calculate_slip", "type": "Function", "description": "Computes individual salary slip based on attendance and salary structure.", "resource": "crates/erp-hr/src/payroll.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn calculate_slip(\n        employee_id: &str,\n        structure: &SalaryStructure,\n        attended_days: Decimal,\n        total_working_days: Decimal,\n        overtime_hours: Decimal,\n        posting_date: NaiveDate,\n        slip_id: &str,\n    ) -> Result<SalarySlip, HrError> {\n        if total_working_days <= Decimal::ZERO {\n            return Err(HrError::SalaryCalculationError(\n                employee_id.to_string(),\n                \"Total working days must be positive\".to_string(),\n            ));\n        }\n\n        let attendance_ratio = (attended_days / total_working_days).min(Decimal::ONE);\n        let earned_basic = structure.base_salary * attendance_ratio;\n        let earned_hra = earned_basic * (structure.hra_percentage / Decimal::from(100));\n\n        // Overtime rate: 1.5x hourly rate (8-hour day)\n        let hourly_rate = (structure.base_salary / total_working_days) / Decimal::from(8);\n        let overtime_amount = overtime_hours * hourly_rate * Decimal::from_str_exact(\"1.5\").unwrap();\n\n        let gross_salary = earned_basic + earned_hra + overtime_amount;\n        let tax_deducted = gross_salary * (structure.tax_withholding_rate / Decimal::from(100));\n        let other_deductions = structure.standard_deduction;\n        let total_deductions = tax_deducted + other_deductions;\n        let net_salary = gross_salary - total_deductions;\n\n        Ok(SalarySlip {\n            name: slip_id.to_string(),\n            employee_id: employee_id.to_string(),\n            posting_date,\n            attended_days,\n            total_working_days,\n            earned_basic,\n            earned_hra,\n            overtime_amount,\n            gross_salary,\n            tax_deducted,\n            other_deductions,\n            total_deductions,\n            net_salary,\n        })\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/payroll/create_payroll_journal_entry", "title": "create_payroll_journal_entry", "type": "Function", "description": "Generates batch General Ledger journal entry for submitted payroll.", "resource": "crates/erp-hr/src/payroll.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn create_payroll_journal_entry(\n        slips: &[SalarySlip],\n        gl_config: &PayrollGlAccounts,\n        posting_date: NaiveDate,\n    ) -> JournalEntry {\n        let total_gross: Decimal = slips.iter().map(|s| s.gross_salary).sum();\n        let total_net: Decimal = slips.iter().map(|s| s.net_salary).sum();\n        let total_tax: Decimal = slips.iter().map(|s| s.tax_deducted + s.other_deductions).sum();\n\n        let lines = vec![\n            JournalEntryLine {\n                account: gl_config.salary_expense_account.clone(),\n                debit: total_gross,\n                credit: Decimal::ZERO,\n                debit_in_account_currency: total_gross,\n                credit_in_account_currency: Decimal::ZERO,\n                exchange_rate: Decimal::ONE,\n                party_type: None,\n                party: None,\n            },\n            JournalEntryLine {\n                account: gl_config.payroll_payable_account.clone(),\n                debit: Decimal::ZERO,\n                credit: total_net,\n                debit_in_account_currency: Decimal::ZERO,\n                credit_in_account_currency: total_net,\n                exchange_rate: Decimal::ONE,\n                party_type: None,\n                party: None,\n            },\n            JournalEntryLine {\n                account: gl_config.taxes_withheld_account.clone(),\n                debit: Decimal::ZERO,\n                credit: total_tax,\n                debit_in_account_currency: Decimal::ZERO,\n                credit_in_account_currency: total_tax,\n                exchange_rate: Decimal::ONE,\n                party_type: None,\n                party: None,\n            },\n        ];\n\n        JournalEntry {\n            posting_date,\n            company: gl_config.company.clone(),\n            lines,\n            remarks: format!(\"Batch Payroll for {} employees\", slips.len()),\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/payroll/create_payroll_journal_entry_1", "title": "create_payroll_journal_entry", "type": "Function", "description": "Generates batch General Ledger journal entry for submitted payroll.", "resource": "crates/erp-hr/src/payroll.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn create_payroll_journal_entry(\n        slips: &[SalarySlip],\n        gl_config: &PayrollGlAccounts,\n        posting_date: NaiveDate,\n    ) -> JournalEntry {\n        let total_gross: Decimal = slips.iter().map(|s| s.gross_salary).sum();\n        let total_net: Decimal = slips.iter().map(|s| s.net_salary).sum();\n        let total_tax: Decimal = slips.iter().map(|s| s.tax_deducted + s.other_deductions).sum();\n\n        let lines = vec![\n            JournalEntryLine {\n                account: gl_config.salary_expense_account.clone(),\n                debit: total_gross,\n                credit: Decimal::ZERO,\n                debit_in_account_currency: total_gross,\n                credit_in_account_currency: Decimal::ZERO,\n                exchange_rate: Decimal::ONE,\n                party_type: None,\n                party: None,\n            },\n            JournalEntryLine {\n                account: gl_config.payroll_payable_account.clone(),\n                debit: Decimal::ZERO,\n                credit: total_net,\n                debit_in_account_currency: Decimal::ZERO,\n                credit_in_account_currency: total_net,\n                exchange_rate: Decimal::ONE,\n                party_type: None,\n                party: None,\n            },\n            JournalEntryLine {\n                account: gl_config.taxes_withheld_account.clone(),\n                debit: Decimal::ZERO,\n                credit: total_tax,\n                debit_in_account_currency: Decimal::ZERO,\n                credit_in_account_currency: total_tax,\n                exchange_rate: Decimal::ONE,\n                party_type: None,\n                party: None,\n            },\n        ];\n\n        JournalEntry {\n            posting_date,\n            company: gl_config.company.clone(),\n            lines,\n            remarks: format!(\"Batch Payroll for {} employees\", slips.len()),\n        }\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/payroll/process_batch_payroll", "title": "process_batch_payroll", "type": "Function", "description": "Runs concurrent payroll calculation across workforce using Tokio JoinSet with error isolation.", "resource": "crates/erp-hr/src/payroll.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub async fn process_batch_payroll(\n        employees: Vec<(String, SalaryStructure, Decimal, Decimal, Decimal)>,\n        posting_date: NaiveDate,\n    ) -> (Vec<SalarySlip>, Vec<(String, String)>) {\n        let mut join_set = JoinSet::new();\n\n        for (emp_id, struct_cfg, attended, total_days, ot_hours) in employees {\n            join_set.spawn(async move {\n                let res = std::panic::catch_unwind(AssertUnwindSafe(|| {\n                    SalaryCalculator::calculate_slip(\n                        &emp_id,\n                        &struct_cfg,\n                        attended,\n                        total_days,\n                        ot_hours,\n                        posting_date,\n                        &format!(\"SLIP-{emp_id}\"),\n                    )\n                }));\n\n                match res {\n                    Ok(Ok(slip)) => Ok(slip),\n                    Ok(Err(e)) => Err((emp_id, e.to_string())),\n                    Err(_) => Err((emp_id, \"Thread panic in calculation\".to_string())),\n                }\n            });\n        }\n\n        let mut successful_slips = Vec::new();\n        let mut failed_records = Vec::new();\n\n        while let Some(res) = join_set.join_next().await {\n            if let Ok(outcome) = res {\n                match outcome {\n                    Ok(slip) => successful_slips.push(slip),\n                    Err(failure) => failed_records.push(failure),\n                }\n            }\n        }\n\n        (successful_slips, failed_records)\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/payroll/process_batch_payroll_1", "title": "process_batch_payroll", "type": "Function", "description": "Runs concurrent payroll calculation across workforce using Tokio JoinSet with error isolation.", "resource": "crates/erp-hr/src/payroll.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub async fn process_batch_payroll(\n        employees: Vec<(String, SalaryStructure, Decimal, Decimal, Decimal)>,\n        posting_date: NaiveDate,\n    ) -> (Vec<SalarySlip>, Vec<(String, String)>) {\n        let mut join_set = JoinSet::new();\n\n        for (emp_id, struct_cfg, attended, total_days, ot_hours) in employees {\n            join_set.spawn(async move {\n                let res = std::panic::catch_unwind(AssertUnwindSafe(|| {\n                    SalaryCalculator::calculate_slip(\n                        &emp_id,\n                        &struct_cfg,\n                        attended,\n                        total_days,\n                        ot_hours,\n                        posting_date,\n                        &format!(\"SLIP-{emp_id}\"),\n                    )\n                }));\n\n                match res {\n                    Ok(Ok(slip)) => Ok(slip),\n                    Ok(Err(e)) => Err((emp_id, e.to_string())),\n                    Err(_) => Err((emp_id, \"Thread panic in calculation\".to_string())),\n                }\n            });\n        }\n\n        let mut successful_slips = Vec::new();\n        let mut failed_records = Vec::new();\n\n        while let Some(res) = join_set.join_next().await {\n            if let Ok(outcome) = res {\n                match outcome {\n                    Ok(slip) => successful_slips.push(slip),\n                    Err(failure) => failed_records.push(failure),\n                }\n            }\n        }\n\n        (successful_slips, failed_records)\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/payroll/validate_and_deduct_leave", "title": "validate_and_deduct_leave", "type": "Function", "description": "Validates leave application against remaining balance and existing leaves.", "resource": "crates/erp-hr/src/payroll.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn validate_and_deduct_leave(\n        application: &LeaveApplication,\n        available_balance: Decimal,\n        existing_leaves: &[LeaveApplication],\n    ) -> Result<Decimal, HrError> {\n        if application.total_days > available_balance {\n            return Err(HrError::InsufficientLeaveBalance {\n                leave_type: application.leave_type.clone(),\n                requested: application.total_days,\n                available: available_balance,\n            });\n        }\n\n        for existing in existing_leaves {\n            if existing.employee_id == application.employee_id {\n                // Check overlap: max(from1, from2) <= min(to1, to2)\n                if application.from_date.max(existing.from_date)\n                    <= application.to_date.min(existing.to_date)\n                {\n                    return Err(HrError::OverlappingLeave {\n                        from_date: existing.from_date,\n                        to_date: existing.to_date,\n                    });\n                }\n            }\n        }\n\n        Ok(available_balance - application.total_days)\n    }", "bundle": "crates"}, {"id": "crates/erp-hr/src/payroll/validate_and_deduct_leave_1", "title": "validate_and_deduct_leave", "type": "Function", "description": "Validates leave application against remaining balance and existing leaves.", "resource": "crates/erp-hr/src/payroll.rs", "tags": ["domain:erp-hr", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn validate_and_deduct_leave(\n        application: &LeaveApplication,\n        available_balance: Decimal,\n        existing_leaves: &[LeaveApplication],\n    ) -> Result<Decimal, HrError> {\n        if application.total_days > available_balance {\n            return Err(HrError::InsufficientLeaveBalance {\n                leave_type: application.leave_type.clone(),\n                requested: application.total_days,\n                available: available_balance,\n            });\n        }\n\n        for existing in existing_leaves {\n            if existing.employee_id == application.employee_id {\n                // Check overlap: max(from1, from2) <= min(to1, to2)\n                if application.from_date.max(existing.from_date)\n                    <= application.to_date.min(existing.to_date)\n                {\n                    return Err(HrError::OverlappingLeave {\n                        from_date: existing.from_date,\n                        to_date: existing.to_date,\n                    });\n                }\n            }\n        }\n\n        Ok(available_balance - application.total_days)\n    }", "bundle": "crates"}, {"id": "crates/erp-inventory/src/batches", able", "type": "Function", "description": "Validates whether the batch is active and unexpired as of a given posting date.", "resource": "crates/erp-inventory/src/batches.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn validate_usable(&self, as_of: NaiveDate) -> Result<(), InventoryError> {\n        if let Some(exp) = self.expiry_date {\n            if as_of > exp {\n                return Err(InventoryError::BatchExpired {\n                    batch_id: self.batch_id.clone(),\n                    expiry_date: exp,\n                });\n            }\n        }\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/erp-inventory/src/batches/validate_usable_1", "title": "validate_usable", "type": "Function", "description": "Validates whether the batch is active and unexpired as of a given posting date.", "resource": "crates/erp-inventory/src/batches.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn validate_usable(&self, as_of: NaiveDate) -> Result<(), InventoryError> {\n        if let Some(exp) = self.expiry_date {\n            if as_of > exp {\n                return Err(InventoryError::BatchExpired {\n                    batch_id: self.batch_id.clone(),\n                    expiry_date: exp,\n                });\n            }\n        }\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/erp-inventory/src/fifo", "title": "fifo", "type": "Module", "description": "", "resource": "crates/erp-inventory/src/fifo.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-inventory/src/fifo/FifoBatchItem", "title": "FifoBatchItem", "type": "Class", "description": "An individual FIFO inventory batch layer.", "resource": "crates/erp-inventory/src/fifo.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct FifoBatchItem {\n    /// Available batch quantity.\n    pub qty: Decimal,\n    /// Unit valuation rate in base currency.\n    pub rate: Decimal,\n}", "bundle": "crates"}, {"id": "crates/erp-inventory/src/fifo/InventoryError", "title": "InventoryError", "type": "Class", "description": "Inventory domain errors.", "resource": "crates/erp-inventory/src/fifo.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum InventoryError {\n    /// Insufficient available stock in FIFO queue.\n    #[error(\"Insufficient stock: requested {requested}, available {available}\")]\n    InsufficientStock {\n        requested: Decimal,\n        available: Decimal,\n    },\n    /// Serial number location mismatch.\n    #[error(\"Serial number '{serial_no}' not found in warehouse '{expected_warehouse}', located in '{actual_warehouse}'\")]\n    SerialNotInWarehouse {\n        serial_no: String,\n        expected_warehouse: String,\n        actual_warehouse: String,\n    },\n    /// Expired material batch.\n    #[error(\"Batch '{batch_id}' has expired on {expiry_date}\")]\n    BatchExpired {\n        batch_id: String,\n        expiry_date: NaiveDate,\n    },\n    /// Quantity must be positive.\n    #[error(\"Quantity must be positive, got {0}\")]\n    InvalidQuantity(Decimal),\n    /// Item not found.\n    #[error(\"Item not found: {0}\")]\n    ItemNotFound(String),\n}", "bundle": "crates"}, {"id": "crates/erp-inventory/src/fifo/StockLedgerEntry", "title": "StockLedgerEntry", "type": "Class", "description": "Immutable Stock Ledger Entry (SLE) recording physical inventory movement.", "resource": "crates/erp-inventory/src/fifo.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct StockLedgerEntry {\n    /// Primary key identifier.\n    pub name: String,\n    /// Item code.\n    pub item_code: String,\n    /// Warehouse identifier.\n    pub warehouse: String,\n    /// Change in physical quantity (positive for incoming receipt, negative for dispatch).\n    pub actual_qty: Decimal,\n    /// Incoming valuation rate.\n    pub incoming_rate: Decimal,\n    /// Cumulative valuation rate after this transaction.\n    pub valuation_rate: Decimal,\n    /// Net change in total monetary stock value.\n    pub stock_value_difference: Decimal,\n    /// Posting date.\n    pub posting_date: NaiveDate,\n    /// Originating document type.\n    pub voucher_type: String,\n    /// Originating document number.\n    pub voucher_no: String,\n}", "bundle": "crates"}, {"id": "crates/erp-inventory/src/fifo/add_fifo_layer", "title": "add_fifo_layer", "type": "Function", "description": "Adds incoming receipt batch layer to FIFO queue.", "resource": "crates/erp-inventory/src/fifo.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn add_fifo_layer(queue: &mut Vec<FifoBatchItem>, qty: Decimal, rate: Decimal) {\n    if qty > Decimal::ZERO {\n        queue.push(FifoBatchItem { qty, rate });\n    }\n}", "bundle": "crates"}, {"id": "crates/erp-inventory/src/fifo/consume_fifo", "title": "consume_fifo", "type": "Function", "description": "Consumes quantities from a FIFO batch queue sequentially, calculating exact COGS.", "resource": "crates/erp-inventory/src/fifo.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn consume_fifo(\n    queue: &mut Vec<FifoBatchItem>,\n    mut qty_to_remove: Decimal,\n) -> Result<Decimal, InventoryError> {\n    if qty_to_remove <= Decimal::ZERO {\n        return Err(InventoryError::InvalidQuantity(qty_to_remove));\n    }\n\n    let available: Decimal = queue.iter().map(|b| b.qty).sum();\n    if available < qty_to_remove {\n        return Err(InventoryError::InsufficientStock {\n            requested: qty_to_remove,\n            available,\n        });\n    }\n\n    let mut total_cost = Decimal::ZERO;\n\n    while qty_to_remove > Decimal::ZERO {\n        let oldest = queue.first_mut().ok_or(InventoryError::InsufficientStock {\n            requested: qty_to_remove,\n            available: Decimal::ZERO,\n        })?;\n\n        if oldest.qty <= qty_to_remove {\n            qty_to_remove -= oldest.qty;\n            total_cost += oldest.qty * oldest.rate;\n            queue.remove(0);\n        } else {\n            oldest.qty -= qty_to_remove;\n            total_cost += qty_to_remove * oldest.rate;\n            qty_to_remove = Decimal::ZERO;\n        }\n    }\n\n    Ok(total_cost)\n}", "bundle": "crates"}, {"id": "crates/erp-inventory/src/lib", "title": "lib", "type": "Module", "description": "", "resource": "crates/erp-inventory/src/lib.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-inventory/src/lib/test_fifo_multi_batch_consumption", "title": "test_fifo_multi_batch_consumption", "type": "Function", "description": "[test]", "resource": "crates/erp-inventory/src/lib.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_fifo_multi_batch_consumption() {\n        let mut queue = vec![\n            FifoBatchItem {\n                qty: dec!(10.0),\n                rate: dec!(10.0),\n            }, // Cost = 100\n            FifoBatchItem {\n                qty: dec!(10.0),\n                rate: dec!(20.0),\n            }, // Cost = 200\n        ];\n\n        // Dispatch 15 units\n        let cogs = consume_fifo(&mut queue, dec!(15.0)).expect(\"FIFO consume failed\");\n\n        // 10 units @ 10 = 100, 5 units @ 20 = 100 -> Total = 200\n        assert_eq!(cogs, dec!(200.0));\n        assert_eq!(queue.len(), 1);\n        assert_eq!(queue[0].qty, dec!(5.0));\n        assert_eq!(queue[0].rate, dec!(20.0));\n\n        // Attempt consuming more than remaining (5 left, request 6)\n        let err = consume_fifo(&mut queue, dec!(6.0));\n        assert!(matches!(err, Err(InventoryError::InsufficientStock { .. })));\n    }", "bundle": "crates"}, {"id": "crates/erp-inventory/src/lib/test_serial_and_batch_validation", "title": "test_serial_and_batch_validation", "type": "Function", "description": "[test]", "resource": "crates/erp-inventory/src/lib.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_serial_and_batch_validation() {\n        let serial = SerialNo {\n            serial_no: \"SN-98765\".into(),\n            item_code: \"LAPTOP-01\".into(),\n            warehouse: \"Warehouse A\".into(),\n            status: SerialStatus::Active,\n        };\n\n        assert!(serial.validate_dispatch_from(\"Warehouse A\").is_ok());\n        assert!(matches!(\n            serial.validate_dispatch_from(\"Warehouse B\"),\n            Err(InventoryError::SerialNotInWarehouse { .. })\n        ));\n\n        let batch = Batch {\n            batch_id: \"BATCH-2026-01\".into(),\n            item_code: \"CHEMICAL-X\".into(),\n            mfg_date: NaiveDate::from_ymd_opt(2026, 1, 1).unwrap(),\n            expiry_date: Some(NaiveDate::from_ymd_opt(2026, 6, 1).unwrap()),\n            remaining_qty: dec!(50.0),\n        };\n\n        let valid_date = NaiveDate::from_ymd_opt(2026, 5, 1).unwrap();\n        assert!(batch.validate_usable(valid_date).is_ok());\n\n        let expired_date = NaiveDate::from_ymd_opt(2026, 7, 1).unwrap();\n        assert!(matches!(\n            batch.validate_usable(expired_date),\n            Err(InventoryError::BatchExpired { .. })\n        ));\n    }", "bundle": "crates"}, {"id": "crates/erp-inventory/src/lib/test_warehouse_gl_sync_and_journal_balance", "title": "test_warehouse_gl_sync_and_journal_balance", "type": "Function", "description": "[test]", "resource": "crates/erp-inventory/src/lib.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_warehouse_gl_sync_and_journal_balance() {\n        let wh = Warehouse {\n            name: \"Main Stores - ACME\".into(),\n            stock_in_hand_account: \"1300 - Stock In Hand\".into(),\n            stock_received_but_not_billed_account: \"2100 - Stock Received But Not Billed\".into(),\n            default_cogs_account: \"5100 - Cost of Goods Sold\".into(),\n            company: \"Acme Corp\".into(),\n        };\n\n        let date = NaiveDate::from_ymd_opt(2026, 9, 27).unwrap();\n\n        // 1. Purchase Receipt GL Entries\n        let pr_entries = create_purchase_receipt_gl_entries(&wh, dec!(500.0), date, \"PR-001\");\n        let pr_jv = gl_entries_to_journal_entry(&pr_entries, date, &wh.company, \"Receipt PR-001\");\n        assert!(pr_jv.validate_balance().is_ok());\n\n        // 2. Delivery Note GL Entries\n        let dn_entries = create_delivery_note_gl_entries(&wh, dec!(200.0), date, \"DN-001\");\n        let dn_jv = gl_entries_to_journal_entry(&dn_entries, date, &wh.company, \"Delivery DN-001\");\n        assert!(dn_jv.validate_balance().is_ok());\n    }", "bundle": "crates"}, {"id": "crates/erp-inventory/src/warehouse", "title": "warehouse", "type": "Module", "description": "", "resource": "crates/erp-inventory/src/warehouse.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-inventory/src/warehouse/Warehouse", "title": "Warehouse", "type": "Class", "description": "Warehouse master record with linked General Ledger accounts.", "resource": "crates/erp-inventory/src/warehouse.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct Warehouse {\n    /// Warehouse identifier (e.g. \"Finished Goods - ACME\").\n    pub name: String,\n    /// Linked balance sheet asset account for inventory on-hand.\n    pub stock_in_hand_account: String,\n    /// Linked liability account for goods received but pending invoice.\n    pub stock_received_but_not_billed_account: String,\n    /// Linked expense account for cost of goods sold.\n    pub default_cogs_account: String,\n    /// Company identifier.\n    pub company: String,\n}", "bundle": "crates"}, {"id": "crates/erp-inventory/src/warehouse/create_delivery_note_gl_entries", "title": "create_delivery_note_gl_entries", "type": "Function", "description": "Generates balancing GL entries for a Delivery Note submission (Milestone 2.7).", "resource": "crates/erp-inventory/src/warehouse.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn create_delivery_note_gl_entries(\n    warehouse: &Warehouse,\n    cogs_amount: Decimal,\n    posting_date: NaiveDate,\n    voucher_no: &str,\n) -> Vec<GlEntry> {\n    vec![\n        GlEntry {\n            name: format!(\"{voucher_no}-1\"),\n            posting_date,\n            account: warehouse.default_cogs_account.clone(),\n            debit: cogs_amount,\n            credit: Decimal::ZERO,\n            voucher_type: \"Delivery Note\".to_string(),\n            voucher_no: voucher_no.to_string(),\n            party_type: None,\n            party: None,\n            company: warehouse.company.clone(),\n        },\n        GlEntry {\n            name: format!(\"{voucher_no}-2\"),\n            posting_date,\n            account: warehouse.stock_in_hand_account.clone(),\n            debit: Decimal::ZERO,\n            credit: cogs_amount,\n            voucher_type: \"Delivery Note\".to_string(),\n            voucher_no: voucher_no.to_string(),\n            party_type: None,\n            party: None,\n            company: warehouse.company.clone(),\n        },\n    ]\n}", "bundle": "crates"}, {"id": "crates/erp-inventory/src/warehouse/create_purchase_receipt_gl_entries", "title": "create_purchase_receipt_gl_entries", "type": "Function", "description": "Generates balancing GL entries for a Purchase Receipt submission (Milestone 2.7).", "resource": "crates/erp-inventory/src/warehouse.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn create_purchase_receipt_gl_entries(\n    warehouse: &Warehouse,\n    total_valuation_amount: Decimal,\n    posting_date: NaiveDate,\n    voucher_no: &str,\n) -> Vec<GlEntry> {\n    vec![\n        GlEntry {\n            name: format!(\"{voucher_no}-1\"),\n            posting_date,\n            account: warehouse.stock_in_hand_account.clone(),\n            debit: total_valuation_amount,\n            credit: Decimal::ZERO,\n            voucher_type: \"Purchase Receipt\".to_string(),\n            voucher_no: voucher_no.to_string(),\n            party_type: None,\n            party: None,\n            company: warehouse.company.clone(),\n        },\n        GlEntry {\n            name: format!(\"{voucher_no}-2\"),\n            posting_date,\n            account: warehouse.stock_received_but_not_billed_account.clone(),\n            debit: Decimal::ZERO,\n            credit: total_valuation_amount,\n            voucher_type: \"Purchase Receipt\".to_string(),\n            voucher_no: voucher_no.to_string(),\n            party_type: None,\n            party: None,\n            company: warehouse.company.clone(),\n        },\n    ]\n}", "bundle": "crates"}, {"id": "crates/erp-inventory/src/warehouse/gl_entries_to_journal_entry", "title": "gl_entries_to_journal_entry", "type": "Function", "description": "Helper converting GL entries into a validated JournalEntry document.", "resource": "crates/erp-inventory/src/warehouse.rs", "tags": ["domain:erp-inventory", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "pub fn gl_entries_to_journal_entry(\n    entries: &[GlEntry],\n    posting_date: NaiveDate,\n    company: &str,\n    remarks: &str,\n) -> JournalEntry {\n    let lines = entries\n        .iter()\n        .map(|e| JournalEntryLine {\n            account: e.account.clone(),\n            debit: e.debit,\n            credit: e.credit,\n            debit_in_account_currency: e.debit,\n            credit_in_account_currency: e.credit,\n            exchange_rate: Decimal::ONE,\n            party_type: e.party_type.clone(),\n            party: e.party.clone(),\n        })\n        .collect();\n\n    JournalEntry {\n        posting_date,\n        company: company.to_string(),\n        lines,\n        remarks: remarks.to_string(),\n    }\n}", "bundle": "crates"}, {"id": "crates/erp-learning/src/lib", "title": "lib", "type": "Module", "description": "", "resource": "crates/erp-learning/src/lib.rs", "tags": ["domain:erp-learning", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-learning/src/lib/test_lms_progress_and_certificate_issuance", "title": "test_lms_progress_and_certificate_issuance", "type": "Function", "description": "[test]", "resource": "crates/erp-learning/src/lib.rs", "tags": ["domain:erp-learning", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_lms_progress_and_certificate_issuance() {\n        let course = Course {\n            id: \"RUST-101\".into(),\n            title: \"Rust Systems Engineering\".into(),\n            description: \"Deep dive into memory safety and systems\".into(),\n            passing_threshold: 80,\n            modules: vec![\n                CourseModule {\n                    id: \"MOD-1\".into(),\n                    title: \"Ownership\".into(),\n                    lessons: vec![\n                        Lesson {\n                            id: \"LES-1\".into(),\n                            title: \"Move Semantics\".into(),\n                            content_markdown: \"Markdown content\".into(),\n                            video_url: None,\n                        },\n                        Lesson {\n                            id: \"LES-2\".into(),\n                            title: \"Borrowing\".into(),\n                            content_markdown: \"Markdown content\".into(),\n                            video_url: None,\n                        },\n                    ],\n                },\n                CourseModule {\n                    id: \"MOD-2\".into(),\n                    title: \"Lifetimes\".into(),\n                    lessons: vec![\n                        Lesson {\n                            id: \"LES-3\".into(),\n                            title: \"Explicit Lifetimes\".into(),\n                            content_markdown: \"Markdown content\".into(),\n                            video_url: None,\n                        },\n                        Lesson {\n                            id: \"LES-4\".into(),\n                            title: \"Subtyping\".into(),\n                            content_markdown: \"Markdown content\".into(),\n                            video_url: None,\n                        },\n                    ],\n                },\n            ],\n        };\n\n        assert_eq!(course.total_lesson_count(), 4);\n\n        let mut tracker = StudentProgressTracker::new();\n\n        // Complete 3 out of 4 lessons -> 75%\n        tracker.complete_lesson(\"LES-1\");\n        tracker.complete_lesson(\"LES-2\");\n        tracker.complete_lesson(\"LES-3\");\n        assert_eq!(tracker.calculate_progress_percentage(&course), 75);\n\n        let date = NaiveDate::from_ymd_opt(2026, 9, 27).unwrap();\n\n        // Attempt cert at 75% -> Fails\n        let cert_early = tracker.evaluate_and_issue_certificate(\"STU-42\", &course, 95, date);\n        assert!(cert_early.is_err());\n\n        // Complete 4th lesson -> 100%\n        tracker.complete_lesson(\"LES-4\");\n        assert_eq!(tracker.calculate_progress_percentage(&course), 100);\n\n        // Assessment score 70% (< 80% passing threshold) -> Fails\n        let cert_failed_score = tracker.evaluate_and_issue_certificate(\"STU-42\", &course, 70, date);\n        assert!(matches!(\n            cert_failed_score,\n            Err(LmsError::AssessmentFailed { score: 70, passing_threshold: 80 })\n        ));\n\n        // Assessment score 90% -> Certificate issued successfully\n        let cert = tracker\n            .evaluate_and_issue_certificate(\"STU-42\", &course, 90, date)\n            .expect(\"Certificate issuance failed\");\n\n        assert_eq!(cert.student_id, \"STU-42\");\n        assert_eq!(cert.course_id, \"RUST-101\");\n        assert_eq!(cert.final_grade_score, 90);\n    }", "bundle": "crates"}, {"id": "crates/erp-learning/src/lms", "title": "lms", "type": "Module", "description": "", "resource": "crates/erp-learning/src/lms.rs", "tags": ["domain:erp-learning", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/erp-learning/src/lms/Certificate", "title": "Certificate", "type": "Class", "description": "Verified completion certificate (Milestone 4.7).", "resource": "crates/erp-learning/src/lms.rs", "tags": ["domain:erp-learning", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct Certificate {\n    pub certificate_no: String,\n    pub student_id: String,\n    pub course_id: String,\n    pub issue_date: NaiveDate,\n    pub final_grade_score: u32,\n}", "bundle": "crates"}, {"id": "crates/erp-learning/src/lms/ re: assessment_score,\n                passing_threshold: course.passing_threshold,\n            });\n        }\n\n        Ok(Certificate {\n            certificate_no: format!(\"CERT-{}-{}-{}\", course.id, student_id, issue_date.format(\"%Y%m%d\")),\n            student_id: student_id.to_string(),\n            course_id: course.id.clone(),\n            issue_date,\n            final_grade_score: assessment_score,\n        })\n    }", "bundle": "crates"}, {"id": "crates/erp-learning/src/lms/new", "title": "new", "type": "Function", "description": "Creates a new progress tracker.", "resource": "crates/erp-learning/src/lms.rs", "tags": ["domain:erp-learning", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new() -> Self {\n        Self::default()\n    }", "bundle": "crates"}, {"id": "crates/erp-learning/src/lms/new_1", "title": "new", "type": "Function", "description": "Creates a new progress tracker.", "resource": "crates/erp-learning/src/lms.rs", "tags": ["domain:erp-learning", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new() -> Self {\n        Self::default()\n    }", "bundle": "crates"}, {"id": "crates/erp-learning/src/lms/total_lesson_count", "title": "total_lesson_count", "type": "Function", "description": "Returns total lesson count across all modules.", "resource": "crates/erp-learning/src/lms.rs", "tags": ["domain:erp-learning", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn total_lesson_count(&self) -> usize {\n        self.modules.iter().map(|m| m.lessons.len()).sum()\n    }", "bundle": "crates"}, {"id": "crates/erp-learning/src/lms/total_lesson_count_1", "title": "total_lesson_count", "type": "Function", "description": "Returns total lesson count across all modules.", "resource": "crates/erp-learning/src/lms.rs", "tags": ["domain:erp-learning", "git:branch:main" ng errors.", "resource": "crates/erp-lending/src/amortization.rs", "tags": ["domain:erp-lending", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum LendingError {\n    /// Zero or invalid loan duration.\n    #[error(\"Loan tenure must be greater than zero\")]\n    InvalidTenure,\n    /// Invalid principal amount.\n    #[error(\"Principal amount must be positive, got {0}\")]\n    InvalidPrincipal(Decimal),\n}", "bundle": "crates"}, {"id": "crates/erp-lending/src/amortization/LoanGlEngine", "title": "LoanGlEngine", "type": "Class", "description": "Loan Servicing & General Ledger Posting Integration (Milestone 4.5).", "resource": "crates/erp-lending/src/amortization.rs", "tags": ["domain:erp-lending", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct LoanGlEngine;", "bundle": "crates"}, {"id": "crates/erp-lending/src/amortization/calculate_pmt", "title": "calculate_pmt", "type": "Function", "description": "Computes the fixed monthly installment PMT using exact fixed-point decimal math.", "resource": "crates/erp-lending/src/amortization.rs", "tags": ["domain:erp-lending", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn calculate_pmt(principal: Decimal, annual_interest_rate: Decimal, total_periods: usize) -> Decimal {\n        if total_periods == 0 || principal <= Decimal::ZERO {\n            return Decimal::ZERO;\n        }\n\n        let r = (annual_interest_rate / dec!(100.0)) / dec!(12.0);\n        if r == Decimal::ZERO {\n            return (principal / Decimal::from(total_periods)).round_dp(2);\n        }\n\n        // Compute (1 + r)^n using Decimal power approximation or f64 bridge for pow\n        use rust_decimal::MathematicalOps;\n        let one_plus_r = Decimal::ONE + r;\n        let factor = one_plus_r.powi(total_periods as i64);\n\n        let pmt = principal * (r * factor) / (factor - Decimal::ONE);\n        pmt.round_dp(2)\n    }", "bundle": "crates"}, {"id": "crates/erp-lending/src/amortization/calculate_pmt_1", "title": "calculate_pmt", "type": "Function", "description": "Computes the fixed monthly installment PMT using exact fixed-point decimal math.", "resource": "crates/erp-lending/src/amortization.rs", "tags": ["domain:erp-lending", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn calculate_pmt(principal: Decimal, annual_interest_rate: Decimal, total_periods: usize) -> Decimal {\n        if total_periods == 0 || principal <= Decimal::ZERO {\n            return Decimal::ZERO;\n        }\n\n        let r = (annual_interest_rate / dec!(100.0)) / dec!(12.0);\n        if r == Decimal::ZERO {\n            return (principal / Decimal::from(total_periods)).round_dp(2);\n        }\n\n        // Compute (1 + r)^n using Decimal power approximation or f64 bridge for pow\n        use rust_decimal::MathematicalOps;\n        let one_plus_r = Decimal::ONE + r;\n        let factor = one_plus_r.powi(total_periods as i64);\n\n        let pmt = principal * (r * factor) / (factor - Decimal::ONE);\n        pmt.round_dp(2)\n    }", "bundle": "crates"}, {"id": "crates/erp-lending/src/amortization/create_interest_accrual_gl_entries", "title": "create_interest_accrual_gl_entries", "type": "Function", "description": "Generates GL entries for monthly interest accrual:", "resource": "crates/erp-lending/src/amortization.rs", "tags": ["domain:erp-lending", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn create_interest_accrual_gl_entries(\n        interest_receivable_account: &str,\n        interest_income_account: &str,\n        interest_amount: Decimal,\n        posting_date: NaiveDate,\n        voucher_no: &str,\n        company: &str,\n    ) -> Vec<GlEntry> {\n        vec![\n            GlEntry {\n                name: format!(\"{vouc
