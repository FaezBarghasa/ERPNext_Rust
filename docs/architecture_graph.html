arts a periodic background worker for evicting idle tenant connections.", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn spawn_maintenance_worker(self: Arc<Self>, heartbeat: Duration) {\n        tokio::spawn(async move {\n            let mut interval = tokio::time::interval(heartbeat);\n            loop {\n                interval.tick().await;\n                self.evict_idle_pools().await;\n            }\n        });\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/spawn_maintenance_worker_1", "title": "spawn_maintenance_worker", "type": "Function", "description": "Starts a periodic background worker for evicting idle tenant connections.", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn spawn_maintenance_worker(self: Arc<Self>, heartbeat: Duration) {\n        tokio::spawn(async move {\n            let mut interval = tokio::time::interval(heartbeat);\n            loop {\n                interval.tick().await;\n                self.evict_idle_pools().await;\n            }\n        });\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/status_code", "title": "status_code", "type": "Function", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn status_code(&self) -> StatusCode {\n        match self {\n            Self::TenantUnresolved | Self::InvalidTenantIdentifier => StatusCode::BAD_REQUEST,\n            Self::AuthenticationFailed(_) => StatusCode::UNAUTHORIZED,\n            Self::PoolAcquisitionTimeout => StatusCode::GATEWAY_TIMEOUT,\n            Self::ConnectionFailed(_) | Self::NamespaceInitializationFailed(_) => {\n                StatusCode::INTERNAL_SERVER_ERROR\n            }\n        }\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/status_code_1", "title": "status_code", "type": "Function", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn status_code(&self) -> StatusCode {\n        match self {\n            Self::TenantUnresolved | Self::InvalidTenantIdentifier => StatusCode::BAD_REQUEST,\n            Self::AuthenticationFailed(_) => StatusCode::UNAUTHORIZED,\n            Self::PoolAcquisitionTimeout => StatusCode::GATEWAY_TIMEOUT,\n            Self::ConnectionFailed(_) | Self::NamespaceInitializationFailed(_) => {\n                StatusCode::INTERNAL_SERVER_ERROR\n            }\n        }\n    }", "bundle": "crates"}, {"id": "crates/frappe-net/src/tenant/validate_and_create_tenant_id", "title": "validate_and_create_tenant_id", "type": "Function", "description": "", "resource": "crates/frappe-net/src/tenant.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "fn validate_and_create_tenant_id(tenant_str: &str) -> Result<TenantId, TenantError> {\n    let sanitized = tenant_str.trim().to_lowercase();\n    if sanitized.is_empty() || sanitized.len() > 63 {\n        return Err(TenantError::InvalidTenantIdentifier);\n    }\n    if !sanitized.chars().all(|c| c.is_ascii_alphanumeric() || c == '-') {\n        return Err(TenantError::InvalidTenantIdentifier);\n    }\n    Ok(TenantId(sanitized))\n}", "bundle": "crates"}, {"id": "crates/frappe-net/tests/tenant_isolation_tests", "title": "tenant_isolation_tests", "type": "Module", "description": "", "resource": "crates/frappe-net/tests/tenant_isolation_tests.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-net/tests/tenant_isolation_tests/test_tenant_database_isolation", "title": "test_tenant_database_isolation", "type": "Function", "description": "[tokio::test]", "resource": "crates/frappe-net/tests/tenant_isolation_tests.rs", "tags": ["domain:frappe-net", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "async fn test_tenant_database_isolation() {\n    let pool_mgr = ConnectionPoolManager::new(Duration::from_secs(60));\n\n    let tenant_a = TenantId(\"alpha-corp\".to_string());\n    let tenant_b = TenantId(\"beta-industries\".to_string());\n\n    // 1. Provision separate tenants\n    let client_a = provision_tenant(&pool_mgr, &tenant_a.0)\n        .await\n        .expect(\"Provision A failed\");\n    let client_b = provision_tenant(&pool_mgr, &tenant_b.0)\n        .await\n        .expect(\"Provision B failed\");\n\n    // 2. Insert records with identical IDs on same table name in both tenants\n    client_a\n        .query(\"CREATE customer:acme SET name = 'Customer in Alpha Corp', balance = 1000;\")\n        .await\n        .unwrap()\n        .check()\n        .unwrap();\n\n    client_b\n        .query(\"CREATE customer:acme SET name = 'Customer in Beta Corp', balance = 2000;\")\n        .await\n        .unwrap()\n        .check()\n        .unwrap();\n\n    // 3. Query tenant A and assert tenant B data is not visible\n    let mut res_a = client_a\n        .query(\"SELECT * FROM customer:acme;\")\n        .await\n        .unwrap()\n        .check()\n        .unwrap();\n    let rows_a: Option<serde_json::Value> = res_a.take(0).unwrap();\n    let row_a = rows_a.expect(\"Customer in A not found\");\n    assert_eq!(row_a[\"name\"], \"Customer in Alpha Corp\");\n    assert_eq!(row_a[\"balance\"], 1000);\n\n    // 4. Query tenant B and assert tenant A data is not visible\n    let mut res_b = client_b\n        .query(\"SELECT * FROM customer:acme;\")\n        .await\n        .unwrap()\n        .check()\n        .unwrap();\n    let rows_b: Option<serde_json::Value> = res_b.take(0).unwrap();\n    let row_b = rows_b.expect(\"Customer in B not found\");\n    assert_eq!(row_b[\"name\"], \"Customer in Beta Corp\");\n    assert_eq!(row_b[\"balance\"], 2000);\n}", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive", "title": "drive", "type": "Module", "description": "", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/DeduplicatedStorage", "title": "DeduplicatedStorage", "type": "Class", "description": "Content-Addressable Storage (CAS) with SHA-256 deduplication and bounded-memory streaming.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct DeduplicatedStorage {\n    /// Raw payload storage: SHA-256 -> Binary data.\n    payloads: Arc<RwLock<HashMap<String, Vec<u8>>>>,\n    /// File metadata storage: File ID -> DriveFile.\n    files: Arc<RwLock<HashMap<String, DriveFile>>>,\n    /// Folder metadata storage: Folder ID -> DriveFolder.\n    folders: Arc<RwLock<HashMap<String, DriveFolder>>>,\n}", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/DriveFile", "title": "DriveFile", "type": "Class", "description": "Metadata record for virtual drive files.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct DriveFile {\n    /// File identifier.\n    pub id: String,\n    /// File name.\n    pub file_name: String,\n    /// Parent folder ID.\n    pub folder_id: Option<String>,\n    /// Content SHA-256 hash (points to CAS payload).\n    pub content_hash: String,\n    /// Total file size in bytes.\n    pub file_size: u64,\n    /// MIME type.\n    pub mime_type: String,\n    /// Owner user ID.\n    pub owner: String,\n}", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/DriveFolder", "title": "DriveFolder", "type": "Class", "description": "Metadata record for virtual drive folders.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct DriveFolder {\n    /// Folder identifier.\n    pub id: String,\n    /// Folder name.\n    pub name: String,\n    /// Parent folder ID (None for root).\n    pub parent_id: Option<String>,\n    /// Owner user ID.\n    pub owner: String,\n    /// Is this folder publicly accessible?\n    pub is_public: bool,\n}", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/StorageError", "title": "StorageError", "type": "Class", "description": "Storage errors.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub enum StorageError {\n    /// File not found.\n    #[error(\"File not found: {0}\")]\n    FileNotFound(String),\n    /// Folder not found.\n    #[error(\"Folder not found: {0}\")]\n    FolderNotFound(String),\n    /// Permission denied.\n    #[error(\"Permission denied for path: {0}\")]\n    PermissionDenied(String),\n    /// Upload error.\n    #[error(\"Upload failed: {0}\")]\n    UploadFailed(String),\n}", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/create_folder", "title": "create_folder", "type": "Function", "description": "Creates a virtual drive folder.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn create_folder(&self, folder: DriveFolder) -> Result<(), StorageError> {\n        let mut folders = self\n            .folders\n            .write()\n            .map_err(|e| StorageError::UploadFailed(e.to_string()))?;\n        folders.insert(folder.id.clone(), folder);\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/create_folder_1", "title": "create_folder", "type": "Function", "description": "Creates a virtual drive folder.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn create_folder(&self, folder: DriveFolder) -> Result<(), StorageError> {\n        let mut folders = self\n            .folders\n            .write()\n            .map_err(|e| StorageError::UploadFailed(e.to_string()))?;\n        folders.insert(folder.id.clone(), folder);\n        Ok(())\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/get_folder", "title": "get_folder", "type": "Function", "description": "Retrieves a virtual drive folder by ID.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn get_folder(&self, folder_id: &str) -> Option<DriveFolder> {\n        self.folders.read().ok()?.get(folder_id).cloned()\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/get_folder_1", "title": "get_folder", "type": "Function", "description": "Retrieves a virtual drive folder by ID.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn get_folder(&self, folder_id: &str) -> Option<DriveFolder> {\n        self.folders.read().ok()?.get(folder_id).cloned()\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/new", "title": "new", "type": "Function", "description": "Creates a new storage instance.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new() -> Self {\n        Self::default()\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/new_1", "title": "new", "type": "Function", "description": "Creates a new storage instance.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn new() -> Self {\n        Self::default()\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/physical_payload_count", "title": "physical_payload_count", "type": "Function", "description": "Returns the number of distinct physical binary payloads stored in memory.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn physical_payload_count(&self) -> usize {\n        self.payloads.read().map(|p| p.len()).unwrap_or(0)\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/physical_payload_count_1", "title": "physical_payload_count", "type": "Function", "description": "Returns the number of distinct physical binary payloads stored in memory.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn physical_payload_count(&self) -> usize {\n        self.payloads.read().map(|p| p.len()).unwrap_or(0)\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/read_file", "title": "read_file", "type": "Function", "description": "Retrieves file bytes by file ID.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn read_file(&self, file_id: &str) -> Result<Vec<u8>, StorageError> {\n        let files = self\n            .files\n            .read()\n            .map_err(|e| StorageError::FileNotFound(e.to_string()))?;\n        let file = files\n            .get(file_id)\n            .ok_or_else(|| StorageError::FileNotFound(file_id.to_string()))?;\n\n        let payloads = self\n            .payloads\n            .read()\n            .map_err(|e| StorageError::FileNotFound(e.to_string()))?;\n        let data = payloads\n            .get(&file.content_hash)\n            .ok_or_else(|| StorageError::FileNotFound(file.content_hash.clone()))?;\n\n        Ok(data.clone())\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/read_file_1", "title": "read_file", "type": "Function", "description": "Retrieves file bytes by file ID.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn read_file(&self, file_id: &str) -> Result<Vec<u8>, StorageError> {\n        let files = self\n            .files\n            .read()\n            .map_err(|e| StorageError::FileNotFound(e.to_string()))?;\n        let file = files\n            .get(file_id)\n            .ok_or_else(|| StorageError::FileNotFound(file_id.to_string()))?;\n\n        let payloads = self\n            .payloads\n            .read()\n            .map_err(|e| StorageError::FileNotFound(e.to_string()))?;\n        let data = payloads\n            .get(&file.content_hash)\n            .ok_or_else(|| StorageError::FileNotFound(file.content_hash.clone()))?;\n\n        Ok(data.clone())\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/store_file", "title": "store_file", "type": "Function", "description": "Stores a binary payload, deduplicating based on SHA-256 content hash.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn store_file(\n        &self,\n        file_id: String,\n        file_name: String,\n        folder_id: Option<String>,\n        mime_type: String,\n        owner: String,\n        data: &[u8],\n    ) -> Result<(DriveFile, bool), StorageError> {\n        let mut hasher = Sha256::new();\n        hasher.update(data);\n        let content_hash = format!(\"{:x}\", hasher.finalize());\n\n        let mut payloads = self\n            .payloads\n            .write()\n            .map_err(|e| StorageError::UploadFailed(e.to_string()))?;\n\n        let is_duplicate = payloads.contains_key(&content_hash);\n        if !is_duplicate {\n            payloads.insert(content_hash.clone(), data.to_vec());\n        }\n\n        let drive_file = DriveFile {\n            id: file_id.clone(),\n            file_name,\n            folder_id,\n            content_hash,\n            file_size: data.len() as u64,\n            mime_type,\n            owner,\n        };\n\n        let mut files = self\n            .files\n            .write()\n            .map_err(|e| StorageError::UploadFailed(e.to_string()))?;\n        files.insert(file_id, drive_file.clone());\n\n        Ok((drive_file, is_duplicate))\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/drive/store_file_1", "title": "store_file", "type": "Function", "description": "Stores a binary payload, deduplicating based on SHA-256 content hash.", "resource": "crates/frappe-storage/src/drive.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn store_file(\n        &self,\n        file_id: String,\n        file_name: String,\n        folder_id: Option<String>,\n        mime_type: String,\n        owner: String,\n        data: &[u8],\n    ) -> Result<(DriveFile, bool), StorageError> {\n        let mut hasher = Sha256::new();\n        hasher.update(data);\n        let content_hash = format!(\"{:x}\", hasher.finalize());\n\n        let mut payloads = self\n            .payloads\n            .write()\n            .map_err(|e| StorageError::UploadFailed(e.to_string()))?;\n\n        let is_duplicate = payloads.contains_key(&content_hash);\n        if !is_duplicate {\n            payloads.insert(content_hash.clone(), data.to_vec());\n        }\n\n        let drive_file = DriveFile {\n            id: file_id.clone(),\n            file_name,\n            folder_id,\n            content_hash,\n            file_size: data.len() as u64,\n            mime_type,\n            owner,\n        };\n\n        let mut files = self\n            .files\n            .write()\n            .map_err(|e| StorageError::UploadFailed(e.to_string()))?;\n        files.insert(file_id, drive_file.clone());\n\n        Ok((drive_file, is_duplicate))\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/lib", "title": "lib", "type": "Module", "description": "Tenant context, queue states, CAS deduplication, and SurrealDB storage backend.", "resource": "crates/frappe-storage/src/lib.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Module"], "code": "", "bundle": "crates"}, {"id": "crates/frappe-storage/src/lib/LiveDiff", "title": "LiveDiff", "type": "Class", "description": "Live-query mutation diff pushed over WebSocket.", "resource": "crates/frappe-storage/src/lib.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Class"], "code": "pub struct LiveDiff {\n    pub table: String,\n    pub id: String,\n    pub op: String,\n    pub payload_json: String,\n}", "bundle": "crates"}, {"id": "crates/frap /src/lib.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn from_headers(headers: &HashMap<String, String>, host: &str) -> Option<Self> {\n        let site = headers\n            .get(\"X-Frappe-Site-Name\")\n            .cloned()\n            .or_else(|| host.split('.').next().map(ToString::to_string))\n            .filter(|s| !s.is_empty())?;\n        Some(Self {\n            tenant_id: format!(\"tenant_{}\", site.replace('-', \"_\")),\n            site_name: site,\n            user_id: \"guest\".into(),\n            roles: vec![\"Guest\".into()],\n        })\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/lib/from_headers_1", "title": "from_headers", "type": "Function", "description": "Resolves tenant context from HTTP headers.", "resource": "crates/frappe-storage/src/lib.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn from_headers(headers: &HashMap<String, String>, host: &str) -> Option<Self> {\n        let site = headers\n            .get(\"X-Frappe-Site-Name\")\n            .cloned()\n            .or_else(|| host.split('.').next().map(ToString::to_string))\n            .filter(|s| !s.is_empty())?;\n        Some(Self {\n            tenant_id: format!(\"tenant_{}\", site.replace('-', \"_\")),\n            site_name: site,\n            user_id: \"guest\".into(),\n            roles: vec![\"Guest\".into()],\n        })\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/lib/get", "title": "get", "type": "Function", "description": "[must_use]", "resource": "crates/frappe-storage/src/lib.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn get(&self, site: &str) -> Option<TenantContext> {\n        self.inner.read().ok()?.get(site).cloned()\n     }\n}", "bundle": "crates"}, {"id": "crates/frappe-storage/src/lib/surreal_use", "title": "surreal_use", "type": "Function", "description": "Generates SurrealQL USE statement.", "resource": "crates/frappe-storage/src/lib.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn surreal_use(&self) -> String {\n        format!(\"USE NS {} DB {};\", self.tenant_id, self.site_name)\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/lib/surreal_use_1", "title": "surreal_use", "type": "Function", "description": "Generates SurrealQL USE statement.", "resource": "crates/frappe-storage/src/lib.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn surreal_use(&self) -> String {\n        format!(\"USE NS {} DB {};\", self.tenant_id, self.site_name)\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/lib/test_deduplication_storage", "title": "test_deduplication_storage", "type": "Function", "description": "[test]", "resource": "crates/frappe-storage/src/lib.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    fn test_deduplication_storage() {\n        let storage = DeduplicatedStorage::new();\n        let payload = b\"Hello, World! Common invoice template bytes\";\n\n        let (file1, is_dup1) = storage\n            .store_file(\n                \"file_1\".into(),\n                \"invoice_template.html\".into(),\n                None,\n                \"text/html\".into(),\n                \"admin\".into(),\n                payload,\n            )\n            .unwrap();\n        assert!(!is_dup1);\n        assert_eq!(storage.physical_payload_count(), 1);\n\n        let (file2, is_dup2) = storage\n            .store_file(\n                \"file_2\".into(),\n                \"duplicate_invoice.html\".into(),\n                None,\n                \"text/html\".into(),\n                \"user2\".into(),\n                payload,\n            )\n            .unwrap();\n        assert!(is_dup2);\n        assert_eq!(storage.physical_payload_count(), 1);\n        assert_eq!(file1.content_hash, file2.content_hash);\n\n        let retrieved = storage.read_file(\"file_2\").unwrap();\n        assert_eq!(retrieved, payload);\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/lib/to_frame", "title": "to_frame", "type": "Function", "description": "[must_use]", "resource": "crates/frappe-storage/src/lib.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn to_frame(&self) -> String {\n        format!(\"{}:{}:{}:{}\", self.table, self.id, self.op, self.payload_json)\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/lib/to_frame_1", "title": "to_frame", "type": "Function", "description": "[must_use]", "resource": "crates/frappe-storage/src/lib.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn to_frame(&self) -> String {\n        format!(\"{}:{}:{}:{}\", self.table, self.id, self.op, self.payload_json)\n    }", "bundle": "crates"}, {"id": "crates/frappe-storage/src/lib/transition", "title": "transition", "type": "Function", "description": "", "resource": "crates/frappe-storage/src/lib.rs", "tags": ["domain:frappe-storage", "git:branch:main", "git:repo:ERPNext_Rust", "lang:rust", "module:crates", "type:Function"], "code": "    pub fn transition(&mut self, to: TaskState) -> bool {\n        let ok = matches!(\n            (self.state, to),\n            (TaskState::Queued, TaskState::Processing)\n                | (TaskState::Processing, TaskState::Completed)\n                | (TaskState::Processing, TaskState::Failed)\n var __nodeById = {};
var __adj = {};

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function qs(id) { return document.getElementById(id); }

// ---- Data Layer ----
async function api(path) { var r = await fetch(path); return r.json(); }

function buildStaticIndex(data) {
  (data.nodes || []).forEach(function(n) { __nodeById[n.id] = n; });
  (data.nodes || []).forEach(function(n) { __adj[n.id] = new Set(); });
  (data.links || []).forEach(function(l) {
    if (__adj[l.source]) __adj[l.source].add(l.target);
    if (__adj[l.target]) __adj[l.target].add(l.source);
  });
}

async function getData() {
  if (!DYNAMIC && BUNDLE_DATA && BUNDLE_DATA.nodes) {
    if (Object.keys(__nodeById).length === 0) buildStaticIndex(BUNDLE_DATA);
    return { type: 'static', data: BUNDLE_DATA, nodeById: __nodeById, adj: __adj };
  }
  if (DYNAMIC) return { type: 'dynamic' };
  return null;
}

async function searchConcepts(q, typeFilter, langFilter, limit) {
  limit = limit || 200;
  if (DYNAMIC) {
    var url = '/api/search?q=' + encodeURIComponent(q) + '&type=' + encodeURIComponent(typeFilter) + '&limit=' + limit;
    if (langFilter) url += '&tag=' + encodeURIComponent('lang:' + langFilter);
    return await api(url);
  }
  if (!BUNDLE_DATA || !BUNDLE_DATA.nodes) return [];
  var res = BUNDLE_DATA.nodes;
  if (q) {
    var tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
    res = res.filter(function(n) {
      var text = (n.title + ' ' + (n.id || '') + ' ' + (n.description || '')).toLowerCase();
      return tokens.every(function(t) { return text.includes(t); });
    });
  }
  if (typeFilter) res = res.filter(function(n) { return n.type === typeFilter; });
  if (langFilter) res = res.filter(function(n) { return (n.tags || []).indexOf('lang:' + langFilter) >= 0; });
  return res.map(function(n) { return { concept_id: n.id, title: n.title, type: n.type, resource: n.resource, description: n.description, tags: n.tags || [] }; });
}

async function getConcept(id) {
  if (DYNAMIC) return await api('/api/concept/' + encodeURIComponent(id));
  return __nodeById[id] || null;
}

async function getInfo() {
  if (DYNAMIC) return await api('/api/info');
  if (!BUNDLE_DATA || !BUNDLE_DATA.nodes) return { total: 0, types: {}, languages: {} };
  var types = {}, langs = {};
  BUNDLE_DATA.nodes.forEach(function(n) {
    types[n.type] = (types[n.type] || 0) + 1;
    (n.tags || []).forEach(function(t) {
      if (t.indexOf('lang:') === 0 && t !== 'lang:manifest') langs[t.slice(5)] = (langs[t.slice(5)] || 0) + 1;
    });
  });
  return { total: BUNDLE_DATA.total_concepts || BUNDLE_DATA.nodes.length, types: types, languages: langs, name: BUNDLE_DATA.bundle_name || 'okf_bundle' };
}

async function getTypes() {
  if (DYNAMIC) return await api('/api/types');
  if (!BUNDLE_DATA || !BUNDLE_DATA.nodes) return [];
  var counts = {};
  BUNDLE_DATA.nodes.forEach(function(n) { counts[n.type] = (counts[n.type] || 0) + 1; });
  return Object.keys(counts).sort().map(function(k) { return { type: k, count: counts[k] }; });
}

async function getLanguages() {
  if (DYNAMIC) return await api('/api/languages');
  if (!BUNDLE_DATA || !BUNDLE_DATA.nodes) return [];
  var counts = {};
  BUNDLE_DATA.nodes.forEach(function(n) {
    (n.tags || []).forEach(function(t) {
      if (t.indexOf('lang:') === 0 && t !== 'lang:manifest') counts[t.slice(5)] = (counts[t.slice(5)] || 0) + 1;
    });
  });
  return Object.keys(counts).sort().map(function(k) { return { language: k, count: counts[k] }; });
}

async function getGraph(maxNodes) {
  if (DYNAMIC) return await api('/api/graph?max_nodes=' + (maxNodes || 120));
  if (!BUNDLE_DATA) return { nodes: [], edges: [] };
  var nodes = (BUNDLE_DATA.nodes || []).slice(0, maxNodes || 120).map(function(n) {
    return { id: n.id, label: n.title, title: n.type + ': ' + n.title, group: n.type };
  });
  return { nodes: nodes, edges: (BUNDLE_DATA.links || []).slice(0, 300), total: BUNDLE_DATA.nodes.length, shown: nodes.length };
}

function getEgoElements(conceptId, concept) {
  if (!DYNAMIC && __nodeById[conceptId]) {
    var neighbors = Array.from(__adj[conceptId] || []);
    var nodes = [{ data: { id: conceptId, label: __nodeById[conceptId].title, type: __nodeById[conceptId].type } }];
    neighbors.forEach(function(nid) {
      var n = __nodeById[nid];
      if (n) nodes.push({ data: { id: nid, label: n.title, type: n.type } });
    });
    var edges = [];
    (BUNDLE_DATA.links || []).forEach(function(l) {
      if (l.source === conceptId || l.target === conceptId)
        edges.push({ data: { source: l.source, target: l.target } });
    });
    return { elements: { nodes: nodes, edges: edges } };
  }
  var els = [];
  var added = {};
  els.push({ data: { id: conceptId, label: concept.title, type: concept.type } });
  added[conceptId] = true;
  function addRel(items, dir) {
    (items || []).forEach(function(r) {
      if (!added[r.concept_id]) {
        els.push({ data: { id: r.concept_id, label: r.title, type: 'Unknown' } });
        added[r.concept_id] = true;
      }
      if (dir === 'in') els.push({ data: { source: r.concept_id, target: conceptId } });
      else els.push({ data: { source: conceptId, target: r.concept_id } });
    });
  }
  addRel(concept.related, 'out');
  addRel(concept.calls, 'out');
  addRel(concept.called_by, 'in');
  addRel(concept.used_by, 'in');
  return { elements: els };
}

// ---- Init ----
async function init() {
  if (!DYNAMIC && BUNDLE_DATA && BUNDLE_DATA.nodes) buildStaticIndex(BUNDLE_DATA);

  await getInfo();

  var types = await getTypes();
  var sel = qs('type-filter');
  types.forEach(function(t) {
    var o = document.createElement('option');
    o.value = t.type; o.textContent = t.type + ' (' + t.count + ')';
    sel.appendChild(o);
  });

  var langs = await getLanguages();
  var lsel = qs('lang-filter');
  langs.forEach(function(l) {
    var o = document.createElement('option');
    o.value = l.language; o.textContent = l.language + ' (' + l.count + ')';
    lsel.appendChild(o);
  });

  await doSearch();

  // Populate bundle dropdown with counts from search results
  var bundleCounts = {};
  currentResults.forEach(function(c) {
    var seg = (c.concept_id || '').split('/')[0];
    if (seg) bundleCounts[seg] = (bundleCounts[seg] || 0) + 1;
  });
  // Also add explicitly listed bundles (static)
  if (!DYNAMIC && BUNDLE_DATA && BUNDLE_DATA.bundles) {
    BUNDLE_DATA.bundles.forEach(function(b) {
      if (!bundleCounts[b]) bundleCounts[b] = 0;
    });
  }
  var bsel = qs('bundle-select');
  Object.keys(bundleCounts).sort().forEach(function(b) {
    var o = document.createElement('option');
    o.value = b; o.textContent = b + ' (' + bundleCounts[b] + ')';
    bsel.appendChild(o);
  });
  bsel.addEventListener('change', doSearch);

  // Activate default tab (Explore)
  switchTab('graph', document.querySelector('.nav-seg-item.active'));

  // Pre-load cosmos in background (dynamic mode)
  if (DYNAMIC) loadCosmosExplore();
}
document.addEventListener('DOMContentLoaded', init);

// ---- Search ----
var currentResults = [];

async function doSearch() {
  var q = qs('search').value;
  var t = qs('type-filter').value;
  var l = qs('lang-filter').value;
  var b = qs('bundle-select').value;
  currentResults = await searchConcepts(q, t, l, DYNAMIC ? 999999 : 0);
  if (b) currentResults = currentResults.filter(function(c) { return c.concept_id && c.concept_id.indexOf(b + '/') === 0; });
  renderTree(currentResults);
  if (qs('detail').classList.contains('hidden')) {
    if (DYNAMIC) {
      var infoData = await api('/api/info');
      renderLandingStats(currentResults, infoData.total);
    } else {
      renderLandingStats(currentResults);
    }
  }
  var noRes = qs('search-no-results');
  if (!DYNAMIC && currentResults.length === 0 && (q || t || l || b)) {
    if (!noRes) { noRes = document.createElement('div'); noRes.id = 'search-no-results'; var bc = qs('browse-content'); if (bc) bc.appendChild(noRes); else qs('main').appendChild(noRes); }
    noRes.innerHTML = '<div style="padding:16px 24px;margin:8px 16px;text-align:center;color:var(--text-3);font-size:13px;line-height:1.6;background:var(--surface-2);border-radius:var(--r-md);border:1px solid var(--border)">No concepts match — only <span class="n" id="status-n2">0</span> of <span id="status-of2"></span> concepts loaded in this view.<br>Run <code style="background:var(--surface);padding:2px 6px;border-radius:4px">okf dashboard</code> for full-bundle search across all concepts.</div>';
    var sn = qs('status-n'); var so = qs('status-of');
    if (sn) qs('status-n2').textContent = sn.textContent;
    if (so) qs('status-of2').textContent = so.textContent;
  } else if (noRes) { noRes.remove(); }
}
qs('search').addEventListener('input', doSearch);
qs('type-filter').addEventListener('change', doSearch);
qs('lang-filter').addEventListener('change', doSearch);

// ---- Tree ----
function renderTree(results) {
  var root = { __children: {}, __concepts: [] };
  results.forEach(function(c) {
    var id = c.concept_id || c.id;
    if (!id) return;
    var parts = id.split('/');
    var folderParts = parts.slice(0, -1);
    var cur = root;
    folderParts.forEach(function(f) {
      cur.__children[f] = cur.__children[f] || { __children: {}, __concepts: [] };
      cur = cur.__children[f];
    });
    cur.__concepts = cur.__concepts || [];
    cur.__concepts.push(c);
  });

  var tree = qs('tree');
  tree.innerHTML = '';
  tree.appendChild(renderFolder(root, ''));
}

function renderFolder(node, path) {
  var wrap = document.createElement('div');
  wrap.className = 'tree-folder';
  var children = node.__children || {};
  var concepts = node.__concepts || [];
  var folderNames = Object.keys(children).sort();

  if (path) {
    var label = document.createElement('div');
    label.className = 'tree-folder-label';
    label.tabIndex = 0;

function renderLandingStats(nodes, totalOverride) {
  var types = {}, doms = {}, total = totalOverride || nodes.length;
  nodes.forEach(function(n) {
    types[n.type] = (types[n.type] || 0) + 1;
    var parts = (n.concept_id || n.id || '').split('/');
    var dom = parts.length > 1 ? parts[0] : '(root)';
    doms[dom] = (doms[dom] || 0) + 1;
  });
  var maxDom = Math.max.apply(null, Object.keys(doms).map(function(k) { return doms[k]; })) || 1;
  var sorted = Object.keys(types).sort(function(a, b) { return types[b] - types[a]; });

  var statHtml = '<div class="stat-grid">';
  sorted.forEach(function(t) {
    var color = TYPE_COLORS[t] || '#888';
    statHtml += '<div class="stat-card"><div class="n" style="color:' + color + '">' + types[t] + '</div><div class="l">' + esc(t) + '</div></div>';
  });
  statHtml += '</div>';

  var domHtml = '';
  if (Object.keys(doms).length) {
    domHtml = '<div class="domains"><h3>Domains</h3>';
    var domKeys = Object.keys(doms).sort(function(a, b) { return doms[b] - doms[a]; });
    var totalDomains = domKeys.length;
    if (totalDomains > 12) domKeys = domKeys.slice(0, 12);
    domKeys.forEach(function(d) {
      var pct = Math.round((doms[d] / maxDom) * 100);
      domHtml += '<div class="domain-row" tabindex="0" role="button" onclick="filterToDomain(\'' + d.replace(/'/g,"\\'") + '\')"><span class="name">' + esc(d) + '</span><div class="bar-wrap"><div class="bar" style="width:' + pct + '%"></div></div><span class="count">' + doms[d] + '</span></div>';
    });
    if (totalDomains > 12) domHtml += '<div class="domain-row" style="cursor:default;opacity:.5"><span class="name">+' + (totalDomains - 12) + ' more</span></div>';
    domHtml += '</div>';
  }

  var b = qs('bundle-select').value;
  var label = b || 'All Bundles';
  var heading = total + ' concepts' + (b ? ' in ' + b : '');
  var nDomains = Object.keys(doms).length;
  qs('landing').innerHTML = '<div class="eyebrow">' + esc(label) + '</div><h1>' + esc(heading) + '</h1><p class="sub">' + total + ' concepts across ' + nDomains + ' domains.</p>' + statHtml + domHtml;
}

function _parseRel(text) {
  if (!text) return [];
  if (Array.isArray(text)) return text;
  var out = [];
  text.split('\n').forEach(function(line) {
    var m = line.match(/\[([^\]]+)\]\(([^)]+)\.md\)/);
    if (m) out.push({ title: m[1], concept_id: m[2] });
  });
  return out;
}

function _parseRelationships(text, type) {
  if (!text) return [];
  var out = [];
  text.split('\n').forEach(function(line) {
    if (line.indexOf('|') !== 0) return;
    var cells = line.split('|').filter(function(c) { return c.trim(); });
    if (cells.length < 2) return;
    var relType = cells[0].trim().toLowerCase();
    if (relType !== type && relType !== type.replace('_', ' ')) return;
    var m = cells[1].match(/\[([^\]]+)\]\(([^)]+)\)/);
    if (m) out.push({ title: m[1], concept_id: m[2].replace(/\.md$/, '') });
  });
  return out;
}

function _parseBullets(text) {
  if (!text) return [];
  if (Array.isArray(text)) return text;
  return text.split('\n').filter(function(l) { return l.trim().indexOf('- ') === 0; }).map(function(l) { return l.trim().slice(2).replace(/`+/g, '').trim(); });
}

var _tsInitialized = false;

  go:'go', java:'java', cpp:'cpp', c:'c', php:'php',
  // kt: kotlin, cs: csharp, scala, dart, jl: julia, sql — no WASM builds on npm
};
var _tsWasmUrls = {
  python:'https://cdn.jsdelivr.net/npm/tree-sitter-python@0.20.4/tree-sitter-python.wasm',
  javascript:'https://cdn.jsdelivr.net/npm/tree-sitter-javascript@0.20.4/tree-sitter-javascript.wasm',
  typescript:'https://cdn.jsdelivr.net/npm/tree-sitter-typescript@0.20.5/tree-sitter-typescript.wasm',
  ruby:'https://cdn.jsdelivr.net/npm/tree-sitter-ruby@0.20.1/tree-sitter-ruby.wasm',
  rust:'https://cdn.jsdelivr.net/npm/tree-sitter-rust@0.20.4/tree-sitter-rust.wasm',
  go:'https://cdn.jsdelivr.net/npm/tree-sitter-go@0.20.0/tree-sitter-go.wasm',
  java:'https://cdn.jsdelivr.net/npm/tree-sitter-java@0.20.2/tree-sitter-java.wasm',
  cpp:'https://cdn.jsdelivr.net/npm/tree-sitter-cpp@0.20.5/tree-sitter-cpp.wasm',
  c:'https://cdn.jsdelivr.net/npm/tree-sitter-c@0.20.8/tree-sitter-c.wasm',

};

async function getTsParser(langName) {
  if (_tsParsers[langName]) return _tsParsers[langName];
  if (!_tsInitialized) {
    await TreeSitter.init({
      locateFile: function(p) { return 'https://cdn.jsdelivr.net/npm/web-tree-sitter@0.20.8/' + p; }
    });
    _tsInitialized = true;
  }
  var url = _tsWasmUrls[langName];
  if (!url) return null;
  try {
    var lang = await TreeSitter.Language.load(url);
    var parser = new TreeSitter();
    parser.setLanguage(lang);
    _tsParsers[langName] = parser;
    return parser;
  } catch(e) {
    console.warn('Failed to load WASM parser for ' + langName + ': ' + e.message);
    return null;
  }
}

function _tsNodeName(n) {
  return n.type;
}

function _tsNodeText(n, src) {
  try { return src.slice(n.startIndex, n.endIndex); } catch(e) { return ''; }
}

function _renderTsTree(node, src, depth, isLast) {
  var nn = _tsNodeName(node);
  var txt = _tsNodeText(node, src).replace(/\s+/g, ' ').trim();
  if (txt.length > 60) txt = txt.slice(0, 60) + '…';
  var prefix = '';
  for (var i = 0; i < depth; i++) prefix += '  ';
  var hasChildren = node.childCount > 0;
  var line = '';
  if (hasChildren) {
    line += '<div class="parse-node' + (depth === 0 ? ' root' : '') + '" data-depth="' + depth + '">';
    line += '<span class="node-toggle" onclick="toggleParseNode(this)">▶</span>';
    line += '<span class="node-type">' + nn + '</span>';
    if (txt && nn !== 'program' && nn !== 'module' && nn !== 'block' && nn !== 'statement_block' && nn !== 'body' && nn !== 'declaration') {
      line += ' <span class="node-text">' + esc(txt) + '</span>';
    }
    line += '<span class="parse-range">[' + node.startIndex + '-' + node.endIndex + ']</span>';
    line += '<div class="parse-children">';
    for (var j = 0; j < node.childCount; j++) {
      line += _renderTsTree(node.child(j), src, depth + 1, j === node.childCount - 1);
    }
    line += '</div></div>';
  } else {
    var cls = 'node-text';
    if (/^['"]/.test(txt)) cls += ' str';
    else if (/^\d/.test(txt)) cls += ' num';
    else if (/^(return|if|else|for|while|def|class|import|from|let|const|var|function|fn|pub|use|mod|struct|enum|trait|impl|interface|package|val|var|fun)$/.test(txt)) cls += ' kw';

          if (!_cosmosActiveBundles.has(nb)) nVisible = false;
        }
        if (_cosmosMatchSet !== null && !_cosmosMatchSet.has(ni)) nVisible = false;
        if (!nVisible) continue;
        cx += ps[ni].x; cy += ps[ni].y; count++;
      }
    }
    if (count === 0) { els[di].style.display = 'none'; continue; }
    els[di].style.display = '';
    cx /= count; cy /= count;
    var sx = cx * view.k + view.x;
    var sy = cy * view.k + view.y;
    els[di].style.left = sx + 'px';
    els[di].style.top = (sy - 40) + 'px';
  }
}

// ---- Graph Sidebar ----
var _gsIdx = null;
async function graphSidebarOpen(idx) {
  _gsIdx = idx;
  var n = _cosmosNodes[idx];
  if (!n) return;
  // In dynamic mode, fetch full concept details from API
  if (DYNAMIC && (!n.description || !n.sections)) {
    try {
      var full = await getConcept(n.id || n.concept_id);
      if (full) {
        n.description = full.description || n.description;
        n.sections = full.sections || {};
        n.code = full.code || n.code;
        n.resource = full.resource || n.resource;
        n.tags = full.tags || n.tags || [];
      }
    } catch(e) {}
  }
  // Hide default
  var def = qs('gs-details-default');
  if (def) def.style.display = 'none';
  // Description in header
  var hd = qs('gs-header-desc');
  if (hd) { hd.style.display = n.description ? 'block' : 'none'; hd.textContent = n.description || ''; }
  var col = TYPE_COLORS[n.type] || '#888';
  // Badge in header
  var hb = qs('gs-header-badge');
  if (hb) { hb.style.display = 'inline-flex'; hb.innerHTML = '<span class="dot" style="width:6px;height:6px;border-radius:50%;background:' + col + ';flex:none"></span>' + esc(n.type); hb.style.background = col + '22'; hb.style.color = col; hb.style.border = '1px solid ' + col + '44'; }
  qs('gs-title').textContent = n.title || '';

  // Build details body: Signature → Relationships → Resource → Tags → Docstring
  var detailsHtml = '';
  var rsrc = n.resource || '';
  // 1. Signature (with syntax highlight)
  if (n.sections && n.sections.signature) {
    var sigText = n.sections.signature.replace(/```\w*\n?/g, '').trim();
    var sigLang = (n.sections.signature.match(/```(\w+)/) || [])[1] || '';
    if (!sigLang && rsrc) {
      var extMap = {js:'javascript',ts:'typescript',py:'python',rb:'ruby',rs:'rust',go:'go',java:'java',kt:'kotlin',cs:'csharp',cpp:'cpp',c:'c',sql:'sql',sh:'bash',yaml:'yaml',json:'json',html:'html',css:'css'};
      sigLang = extMap[(rsrc || '').split('.').pop()] || '';
    }
    detailsHtml += '<div class="gs-section"><div class="gs-label">Signature</div><pre class="gs-code' + (sigLang ? ' language-' + sigLang : '') + '"><code' + (sigLang ? ' class="language-' + sigLang + '"' : '') + '>' + esc(sigText) + '</code></pre></div>';
  }
  // 2. Relationships
  var sid = n.id || n.concept_id;
  var relsHtml = '';
  if (sid) {
    var calls = [], calledBy = [];
    _cosmosEdges.forEach(function(l) {
      if (l.source === sid) { var tn = _cosmosNodes.find(function(x) { return (x.id || x.concept_id) === l.target; }); if (tn) calls.push({ title: tn.title, id: tn.id || tn.concept_id, type: tn.type, rel: l.type }); }
      if (l.target === sid) { var sn = _cosmosNodes.find(function(x) { return (x.id || x.concept_id) === l.source; }); if (sn) calledBy.push({ title: sn.title, id: sn.id || sn.concept_id, type: sn.type, rel: l.type }); }
    });
    var relTypes = { 'related': 'relates to', 'calls': 'calls', 'called_by': 'called by', 'imports': 'imports' };
    var anyRel = false;
    [['Outgoing', calls], ['Incoming', calledBy]].forEach(function(pair) {
      var label = pair[0], items = pair[1];
      if (!items.length) return;
      anyRel = true;
      relsHtml += '<div class="gs-section"><div class="gs-label">' + label + '</div>';
      items.forEach(function(r) {
        var rc = TYPE_COLORS[r.type || ''] || '#888';
        var verb = relTypes[r.rel] || r.rel || '';
        relsHtml += '<span class="gs-chip" onclick="graphSidebarJump(\'' + r.id.replace(/'/g,"\\'") + '\')"><span class="dot" style="background:' + rc + '"></span>' + esc(r.title) + '<span style="font-size:9px;color:var(--text-3);margin-left:4px">' + esc(verb) + '</span></span>';
      });
      relsHtml += '</div>';
    });
    if (!anyRel) relsHtml = '<div class="gs-section"><div class="gs-desc" style="color:var(--text-3)">No relationships.</div></div>';
  }
  if (relsHtml) detailsHtml += relsHtml;
  // 3. Resource
  if (rsrc) detailsHtml += '<div class="gs-section"><div class="gs-label">Resource</div><div style="font-size:12px;color:var(--text-3);font-family:JetBrains Mono,monospace">' + esc(rsrc) + '</div></div>';
  // 4. Tags
  var tagsHtml = (n.tags || []).map(function(t) { return '<span class="gs-tag">' + esc(t) + '</span>'; }).join('');
  if (tagsHtml) detailsHtml += '<div class="gs-section"><div class="gs-label">Tags</div><div class="gs-meta">' + tagsHtml + '</div></div>';
  // 5. Docstring (as markdown code block, matching Browse tab style)
  if (n.sections && n.sections.docstring) {
    var md = n.sections.docstring.slice(0, 400).trim();
    detailsHtml += '<div class="gs-section"><div class="gs-label">Docstring</div><pre class="gs-code"><code class="language-md">' + esc(md) + '</code></pre></div>';
  }
  // Set details content atomically
  var detailsBody = qs('gs-details-body');
  if (detailsBody) detailsBody.innerHTML = detailsHtml;
  // Highlight signature code if Prism is available
  if (window.Prism) {
    var sigCode = detailsBody && detailsBody.querySelector('pre.gs-code code');
    if (sigCode) Prism.highlightElement(sigCode);
  }

  // Source
  var src = n.code || n.body || n.source || '';
  var ext = (rsrc || '').split('.').pop();
  if (src) {
    qs('gs-source-content').textContent = src;
    var langMap = {js:'javascript',ts:'typescript',py:'python',rb:'ruby',rs:'rust',go:'go',java:'java',kt:'kotlin',cs:'csharp',cpp:'cpp',c:'c',sql:'sql',sh:'bash',yaml:'yaml',json:'json',html:'html',css:'css'};
    var lang = langMap[ext] || '';
    if (lang && window.Prism) {
      qs('gs-source-content').className = 'gs-code language-' + lang;
      Prism.highlightElement(qs('gs-source-content'));
    }
  } else {
    qs('gs-source-content').textContent = 'No source code available for this concept.';
  }

  // Stay on current tab — don't switch to details
  var curTab = document.querySelector('.gs-tab.active');
  if (curTab) gsSwitchTab(curTab.dataset.gs, curTab);
  else gsSwitchTab('details', document.querySelector('.gs-tab'));
}
function graphSidebarClose() {
  _gsIdx = null;
  _cosmosClickedIdx = null;
  var def = qs('gs-details-default');
  if (def) def.style.display = '';
  var body = qs('gs-details-body');
  if (body) body.innerHTML = '';
  qs('gs-title').textContent = 'Concept Details';
  var hb = qs('gs-header-badge');
  if (hb) hb.style.display = 'none';
  var hd = qs('gs-header-desc');
  if (hd) hd.style.display = 'none';
}
function graphSidebarJump(id) {
  var idx = _cosmosNodes.findIndex(function(n) { return (n.id || n.concept_id) === id; });
  if (idx >= 0) {
    _cosmosClickedIdx = idx;
    graphSidebarOpen(idx);
  }
}
function gsSwitchTab(name, btn) {
  document.querySelectorAll('.gs-tab').forEach(function(t) { t.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.gs-pane').forEach(function(p) { p.classList.remove('active'); });
  var pane = qs('gs-' + name);
  if (pane) pane.classList.add('active');
}

async function loadCosmosExplore() {
  if (_cosmosLoaded) return;
  if (_cosmosLoading) return;
  _cosmosLoading = true;
  var loadingEl = qs('cosmos-loading');

  // Dynamic mode: fetch graph + bundle info
  var _cosmosFullTypeCounts = {};
  var _cosmosBundleNames = {};
  if (DYNAMIC) {
    try {
      var gmn = parseInt((qs('graph-max-nodes') || {}).textContent, 10) || 2000;
      var [gd, infoData] = await Promise.all([
        api('/api/graph?max_nodes=' + gmn),
        api('/api/info')
      ]);
      _cosmosNodes = (gd.nodes || []).map(function(n) { return { id: n.id, title: n.label || n.title, type: n.group || n.type, resource: n.resource || '', tags: n.tags || [] }; });
      _cosmosEdges = (gd.edges || []).map(function(e) { return { source: e.from || e.source, target: e.to || e.target, type: e.type || 'related' }; });
      _cosmosFullTypeCounts = infoData.types || {};
      _cosmosFullBundleNames = infoData.name || '';
    } catch(e) {
      _cosmosNodes = []; _cosmosEdges = [];
    }
    _cosmosN = _cosmosNodes.length;
    // Build domain map from fetched nodes
    var doms = {};
    _cosmosNodes.forEach(function(n) {
      var parts = (n.id || '').split('/');
      var d = parts[0] || 'root';
      if (!doms[d]) doms[d] = [];
      doms[d].push(n);
    });
    _cosmosDomainNames = Object.keys(doms).sort();
  } else {
    var deg = _cosmosInitData();
    _cosmosN = _cosmosNodes.length;
  }

  _cosmosPointColors = new Float32Array(_cosmosN * 4);
  _cosmosNodes.forEach(function(n, i) {
    var c = TYPE_COLORS[n.type] || '#888';
    var rgb = _cosmosHexToRgb(c);
    _cosmosPointColors[i*4] = rgb[0]; _cosmosPointColors[i*4+1] = rgb[1];
    _cosmosPointColors[i*4+2] = rgb[2]; _cosmosPointColors[i*4+3] = 0.92;
  });

  qs('status-n').textContent = _cosmosN;
  qs('status-of').textContent = '';
  if (DYNAMIC && _cosmosFullTypeCounts) {
    var fullTotal = 0; for (var k in _cosmosFullTypeCounts) fullTotal += _cosmosFullTypeCounts[k];
    if (fullTotal > _cosmosN) qs('status-of').textContent = ' of ' + fullTotal;
  } else if (BUNDLE_DATA && BUNDLE_DATA.total_concepts > _cosmosN) {
    qs('status-of').textContent = ' of ' + BUNDLE_DATA.total_concepts;
  }
  qs('status-e').textContent = _cosmosEdges.length;

  var legendBody = qs('cosmos-legend-body');
  legendBody.innerHTML = '';
  var typeCounts = {};
  _cosmosNodes.forEach(function(n) { typeCounts[n.type] = (typeCounts[n.type] || 0) + 1; });
  Object.keys(TYPE_COLORS).forEach(function(t) {
    var row = document.createElement('div');
    row.className = 'legend-item';
    var cnt = typeCounts[t] || 0;
    var full = DYNAMIC && _cosmosFullTypeCounts ? _cosmosFullTypeCounts[t] || 0 : cnt;
    var label = DYNAMIC ? cnt + ' / ' + full : '' + cnt;
    row.innerHTML = '<span class="dot" style="background:' + TYPE_COLORS[t] + '"></span><span>' + t + '</span><span class="count">' + label + '</span>';
    row.title = cnt + ' visible of ' + full + ' total';
    legendBody.appendChild(row);
  });

  _cosmosActiveTypes = new Set(Object.keys(TYPE_COLORS));
  
  // Type dropdown
  var typeList = qs('type-list');
  typeList.innerHTML = '';
  Object.keys(TYPE_COLORS).forEach(function(t) {
    var cnt = typeCounts[t] || 0;
    var full = DYNAMIC && _cosmosFullTypeCounts ? _cosmosFullTypeCounts[t] || 0 : cnt;
    var label = DYNAMIC ? cnt + ' / ' + full : '' + cnt;
    var item = document.createElement('div');
    item.className = 'dropdown-item on';
    item.innerHTML = '<div class="item-left"><span class="dot" style="background:' + TYPE_COLORS[t] + '"></span><span class="item-cb"></span><span>' + t + '</span></div><span class="item-count">' + label + '</span>';
    item.title = cnt + ' visible of ' + full + ' total';
    item.onclick = function() {
      if (_cosmosActiveTypes.has(t)) { _cosmosActiveTypes.delete(t); item.classList.remove('on'); }
      else { _cosmosActiveTypes.add(t); item.classList.add('on'); }
      _cosmosFilterChanged();
    };
    typeList.appendChild(item);
  });

  // Bundle dropdown
  var bundleNames = {};
  _cosmosNodes.forEach(function(n) { var b = (n.id || n.concept_id || '').split('/')[0] || 'root'; bundleNames[b] = (bundleNames[b] || 0) + 1; });
  var bundleKeys = Object.keys(bundleNames).sort();
  _cosmosActiveBundles = new Set(bundleKeys);
  var bundleList = qs('bundle-list');
  bundleList.innerHTML = '';
  bundleKeys.forEach(function(b) {
    var item = document.createElement('div');
    item.className = 'dropdown-item on';
    item.innerHTML = '<div class="item-left"><span class="item-cb"></span><span>' + esc(b) + '</span></div><span class="item-count">' + bundleNames[b] + '</span>';
    item.onclick = function() {
      if (_cosmosActiveBundles.has(b)) { _cosmosActiveBundles.delete(b); item.classList.remove('on'); }
      else { _cosmosActiveBundles.add(b); item.classList.add('on'); }
      _cosmosFilterChanged();
      updateBundleBadge();
    };
    bundleList.appendChild(item);
  });
  updateBundleBadge();

  var labelRoot = qs('cluster-labels');

  var labelRoot = qs('cluster-labels');
  labelRoot.innerHTML = '';
  _cosmosDomainNames.forEach(function(d) {
    var el = document.createElement('div');
    el.className = 'cluster-label'; el.textContent = d;
    labelRoot.appendChild(el);
  });

  _canvas2DSwitch();
  loadingEl.classList.add('hide');
  _cosmosLoaded = true;
  _cosmosLoading = false;

  // Populate default sidebar stats
  var statsHtml = '';
  var typeCounts = {};
  _cosmosNodes.forEach(function(n) { typeCounts[n.type] = (typeCounts[n.type] || 0) + 1; });
  Object.keys(typeCounts).sort().forEach(function(t) {
    var c = TYPE_COLORS[t] || '#888';
    statsHtml += '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px;min-width:70px"><div style="font-size:16px;font-weight:700;color:' + c + '">' + typeCounts[t] + '</div><div style="font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-top:2px">' + t + '</div></div>';
  });
  var defStats = qs('gs-default-stats');
  if (defStats) defStats.innerHTML = statsHtml;
}

var _cosmosSearchTimer;
(function() {
  var searchEl = qs('cosmos-search');
  if (!searchEl) return;
  searchEl.addEventListener('input', function(e) {
    clearTimeout(_cosmosSearchTimer);
    var q = e.target.value.trim().toLowerCase();

      _cosmosMatchSet = q ? new Set(_cosmosNodes.map(function(n,i){ return [n,i]; }).filter(function(p){ return (p[0].title||'').toLowerCase().includes(q); }).map(function(p){ return p[1]; })) : null;
      _cosmosFilterChanged();

  });
})();

var _cosmosHoverEl = qs('hover-tag');

function _cosmosHideHoverTag() { _cosmosHoverEl.classList.remove('show'); }

function cosmosZoom(f) {}
function cosmosTogglePhysics() {}
function cosmosReset() {}

// ---- Dropdown Toggle ----
var _openDropdown = null;
function toggleDropdown(name) {
  var menu = qs(name + '-menu');
  if (!menu) return;
  if (_openDropdown && _openDropdown !== menu) _openDropdown.classList.remove('open');
  menu.classList.toggle('open');
  _openDropdown = menu.classList.contains('open') ? menu : null;
}
function updateBundleBadge() {
  var active = _cosmosActiveBundles ? _cosmosActiveBundles.size : 0;
  var total = _cosmosActiveBundles ? _cosmosNodes.reduce(function(s,n) { var b=(n.id||n.concept_id||'').split('/')[0]||'root'; s.add(b); return s; }, new Set()).size : 0;
  var badge = qs('bundle-badge');
  if (badge) badge.textContent = active < total ? '' + active : 'All';
}

    _openDropdown.classList.remove('open');
    _openDropdown = null;
  }
});
window.cosmosZoom = cosmosZoom;
window.cosmosReset = cosmosReset;

// ---- Tab Switching ----
function switchTab(name, btn) {
  document.querySelectorAll('.nav-seg-item').forEach(function(t) { t.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
  qs('tab-' + name).classList.add('active');
  if (name === 'graph') {
    qs('main').classList.add('wide');
    loadCosmosExplore();
  } else {
    qs('main').classList.remove('wide');
  }
}

(function() {
  var t = localStorage.getItem('okf-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
function toggleTheme() {
  var html = document.documentElement;
  var cur = html.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);

  if (egoCy) { var c = conceptCache[currentId]; if (c) renderEgoGraph(currentId, c); }
}

// ---- Sidebar resize ----
(function() {
  var sidebar = qs('sidebar');
  var handle = qs('sidebar-resize');
  if (!sidebar || !handle) return;
  var isResizing = false;
  handle.addEventListener('mousedown', function(e) {
    isResizing = true;
    handle.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', function(e) {
    if (!isResizing) return;
    var newWidth = Math.max(180, Math.min(600, e.clientX));
    sidebar.style.width = newWidth + 'px';
    sidebar.style.flex = 'none';
  });
  document.addEventListener('mouseup', function() {
    if (isResizing) {
      isResizing = false;
      handle.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
  });
})();

// ---- Keyboard shortcuts ----
document.addEventListener('keydown', function(e) {
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && document.activeElement !== qs('search')) { qs('search').focus(); e.preventDefault(); }
  if (e.key === ' ' && e.target === document.body) { e.preventDefault(); }
});
