[package]
name = "erp-cms"
version = "0.1.0"
edition = "2024"

[dependencies]
frappe-meta = { path = "../frappe-meta" }
frappe-framework = { path = "../frappe-framework" }
frappe-storage = { path = "../frappe-storage" }
erp-accounting = { path = "../erp-accounting" }
erp-trade = { path = "../erp-trade" }
rust_decimal = { version = "1.43.0", features = ["serde", "maths"] }
rust_decimal_macros = "1.40.0"
compact_str = { version = "0.10.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "io-util",
    "process",
] }
hmac = "0.13.0"
sha2 = "0.11.0"
