[package]
name = "erp-accounting"
version = "0.1.0"
edition = "2021"

[dependencies]
frappe-meta = { path = "../frappe-meta" }
frappe-framework = { path = "../frappe-framework" }
rust_decimal = { version = "1.43.0", features = ["serde", "maths"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
chrono = { version = "0.4.44", features = ["serde"] }
