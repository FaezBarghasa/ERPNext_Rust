[package]
name = "frappe-framework"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
frappe-meta = { path = "../frappe-meta" }
frappe-storage = { path = "../frappe-storage" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
rust_decimal = { version = "1.43.0", features = ["serde", "maths"] }
chrono = { version = "0.4.44", features = ["serde"] }
compact_str = { version = "0.10.0", features = ["serde"] }
rhai = { version = "1.26.1", features = ["sync", "serde"] }
tracing = "0.1"
