[package]
name = "frappe-framework"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
frappe-meta = { path = "../frappe-meta" }
frappe-storage = { path = "../frappe-storage" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
rhai = { version = "1.26.1", features = ["sync", "serde"] }
tracing = "0.1"
