[package]
name = "rbench"
version = "0.1.0"
edition = "2021"

[dependencies]
frappe-meta = { path = "../frappe-meta" }
frappe-storage = { path = "../frappe-storage" }
frappe-net = { path = "../frappe-net" }
frappe-framework = { path = "../frappe-framework" }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
surrealdb = { version = "2.2", features = ["kv-mem"] }
