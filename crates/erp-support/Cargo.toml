[package]
name = "erp-support"
version = "0.1.0"
edition = "2021"

[dependencies]
frappe-meta = { path = "../frappe-meta" }
frappe-framework = { path = "../frappe-framework" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
chrono = { version = "0.4.44", features = ["serde"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
