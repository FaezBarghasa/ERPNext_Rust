[package]
name = "frappe-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
frappe-meta = { path = "../frappe-meta" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
sha2 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
compact_str = { version = "0.10.0", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde", "maths"] }
rust_decimal_macros = "1.40.0"
surrealdb = { version = "3.3.0", default-features = false, features = [
    "kv-mem",
] }
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "io-util",
] }
