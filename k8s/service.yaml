apiVersion: v1
kind: Service
metadata:
  name: rwl-service
  namespace: rust-web-land
  labels:
    app: rwl
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 4433
      targetPort: 4433
      protocol: UDP
      name: http3
  selector:
    app: rwl
