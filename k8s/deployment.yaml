apiVersion: apps/v1
kind: Deployment
metadata:
  name: rwl-deployment
  namespace: rust-web-land
  labels:
    app: rwl
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rwl
  template:
    metadata:
      labels:
        app: rwl
    spec:
      containers:
        - name: rwl
          image: rust-web-land:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 4433
              protocol: UDP
              name: http3
          envFrom:
            - configMapRef:
                name: rwl-config
            - secretRef:
                name: rwl-secrets
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: rwl-data-pvc
