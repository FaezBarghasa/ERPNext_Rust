apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rwl-hpa
  namespace: rust-web-land
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rwl-deployment
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
